 e dell&#x27;Unione europea (4) Il diritto, derivante dal diritto dell&#x27;Unione, al risarcimento del danno cagionato da violazioni del diritto della concorrenza dell&#x27;Unione e nazionale esige che ciascuno Stato membro disponga di norme procedurali che garantiscano l&#x27;esercizio effettivo di tale diritto. CAPO V — Quantificazione del danno — Articolo 17 1. Gli Stati membri provvedono affinché l&#x27;onere e il grado della prova necessari per la quantificazione del danno non rendano praticamente impossibile o eccessivamente difficile l&#x27;esercizio del diritto al risarcimento. Gli Stati membri provvedono affinché i giudici nazionali abbiano il potere di stimare l&#x27;ammontare del danno conformemente alle procedure nazionali, se è accertato che l&#x27;attore ha subito un danno ma è praticamente impossibile o eccessivamente difficile quantificare con precisione il danno subito sulla base delle prove disponibili. (11) In assenza di norme dell&#x27;Unione, le azioni per il risarcimento del danno sono disciplinate dalle norme e procedure nazionali degli Stati membri. Secondo la giurisprudenza della Corte di giustizia dell&#x27;Unione europea (di seguito: «Corte»), chiunque ha il diritto di chiedere il risarcimento del danno subito qualora sussista un nesso causale tra il danno e la violazione del diritto della concorrenza.</p>"}, {"n": 7, "body": "<p>(13) Il diritto al risarcimento del danno è riconosciuto a qualsiasi persona fisica o giuridica — consumatori, imprese o autorità pubbliche — indipendentemente dall&#x27;esistenza di un rapporto contrattuale diretto con l&#x27;impresa autrice della violazione e indipendentemente dal fatto che un&#x27;autorità garante della concorrenza abbia o meno previamente accertato la violazione. 8. Valori dell&#x27;UE Priorità dell&#x27;Unione europea per gli anni 2024 – 2029 Un&#x27;Europa libera e democratica ▪ promozione dei valori europei all&#x27;interno dell&#x27;UE; ▪ rispetto dei valori dell&#x27;UE a livello globale. Un&#x27;Europa forte e sicura ▪ garantire un&#x27;azione esterna coerente e influente; ▪ rafforzare la sicurezza e la difesa dell&#x27;UE e proteggere i cittadini dell&#x27;UE; ▪ prepararsi a un&#x27;Unione più grande e più forte; ▪ promuovere un approccio globale alla migrazione e alla gestione delle frontiere. Un&#x27;Europa prospera e competitiva ▪ rafforzare la competitività dell&#x27;UE; ▪ attuare con successo la transizione verde e digitale; ▪ sostenere un contesto favorevole all&#x27;innovazione e all&#x27;imprenditorialità; ▪ progredire insieme. 1. Come ci assicura l&#x27;Unione la protezione dei cittadini, se gli Stati più forti come la Germania violano i diritti umani, derubano i propri cittadini e ci mentono su come ci proteggono? 2. Come intende l&#x27;Unione rafforzare la nostra competitività, quando il fraudolento mega cartello Schufa- Telekom vuole essere insabbiato persino dalla presidente della CE Ursula von der Leyen, quando un cartello è l&#x27;opposto della competitività? Agenzia dell&#x27;Unione europea per i diritti fondamentali (FRA) L&#x27;Agenzia dell&#x27;UE per i diritti fondamentali (FRA) fornisce ai responsabili politici europei e nazionali una consulenza indipendente e basata su elementi concreti, contribuendo così a che i dibattiti, le politiche e la legislazione in materia di diritti fondamentali poggino su una massa critica di dati e siano mirati. Compiti L&#x27;Agenzia fornisce consulenza alle istituzioni dell&#x27;UE e ai governi in materia di diritti fondamentali, principalmente nei seguenti ambiti: ▪ razzismo e xenofobia; ▪ discriminazione; ▪ accesso alla giustizia; ▪ protezione dei dati; ▪ diritti delle vittime; ▪ diritti dei minori.</p>"}, {"n": 8, "body": "<p>Lo scopo dell&#x27;Agenzia è contribuire a una promozione e a una protezione più efficaci dei diritti fondamentali in tutta l&#x27;UE. A tal fine consulta i propri partner e collabora con essi nel: ▪ raccogliere e analizzare informazioni e dati mediante ricerche socio-giuridiche; ▪ fornire assistenza e consulenza specialistica; ▪ comunicare e sensibilizzare in materia di diritti. A che cosa e a chi servono queste agenzie, quando la Commissione europea fa ciò che vuole e la violazione dei diritti umani e la violazione della legge sulla protezione dei dati personali protetti del consumatore vengono ignorate come fa la presidente della CE Ursula von der Leyen? Vi è qui il suo chiaro intento di insabbiare questa frode, poiché è in sintonia con la Germania in ragione delle sue origini — vi è dunque un conflitto di interessi! È così che insegnano loro (FRA) a comunicare, che la von der Leyen rifiuta di comunicare con me? L&#x27;UE deve essere competitiva e non creare monopoli! Come prova allego un&#x27;e-mail indirizzata alla signora von der Leyen. 17. Proposta di decisione Richiesta: Conformemente alle leggi e ai regolamenti, i miei diritti sono stati violati e pertanto chiedo il risarcimento del danno. Ai sensi dell&#x27;articolo 82 del GDPR ho diritto al risarcimento del danno cagionato dal trattamento illecito dei miei dati personali. Chiedo che mi sia corrisposto un risarcimento per il tempo dedicato a smascherare questa frode, per il danno psichico, per il trauma a vita e per i furti che gli attori convenuti della frode hanno commesso e commettono ancora nei miei confronti e nei confronti delle masse di cittadini tedeschi — compreso Lei, signor giudice — mediante l&#x27;illecito mancato collegamento internet di base e il prezzo eccessivo dei servizi forniti a causa del cartello esistente tra le società di telecomunicazione. Il cartello conduce a prezzi elevati per l&#x27;assenza di concorrenza. Chiedo inoltre scuse scritte, con lettera indirizzata alla mia persona, per il trauma che da diversi anni sono costretto a sopportare. 18. Conclusione Illustre Tribunale, nel presente documento (Atto) descrivo lo stato di fatto della frode e del furto che le società sopra indicate hanno applicato e tuttora applicano nei miei confronti, in forma sintetica, al solo scopo di darLe un quadro dell&#x27;intera frode che tali società commettono. Tutte le altre informazioni dettagliate sono ampiamente esposte negli allegati delle Denunce penali e dei Reclami alla Commissione europea, allegati al presente atto in formato PDF e sottoscritti a mano con firma fisica nonché con la firma invisibile QES, compreso il presente atto. Invito altresì il tribunale di Landshut a ordinare alle società convenute di porre fine a questa frode per i suindicati motivi illeciti della sua applicazione e a condannarle a pagare il mio risarcimento mediante ingiunzione di pagamento. La società Deutsche Telekom AG deruba ogni giorno una nazione di 84 552 242 abitanti, che è all&#x27;avanguardia del progresso tecnologico, e ciò in pieno giorno sotto forma di violazione dei diritti umani — cosa che non si vede così facilmente, compreso Lei e la Sua famiglia, signor giudice/signora giudice. [Il presente documento è firmato con QES]</p>"}, {"n": 9, "body": "<p>Con osservanza, a Kumhausen, 2.10.2024 Peter Ferenc ........................ cittadino dell&#x27;Unione europea</p>"}]}, "fr": {"title": "Action en justice contre Deutsche Telekom AG et Schufa Holding AG", "pages": [{"n": 1, "body": "<p>« Demandeur » Peter Ferenc Rammelkam 2, Kumhausen Deutschland +49 157 317 33332 info@foxprof.club Amtsgericht Landshut Maximilianstraße 22 84028 Landshut Deutschland à Kumhausen, le 2.10.2024 ACTION EN JUSTICE 4. « Défendeur » • Deutsche Telekom AG, Friedrich-Ebert-Allee 140, 53113 Bonn, Allemagne. Numéro d&#x27;enregistrement (registre du commerce) : HRB 6794 (tribunal d&#x27;instance de Bonn) ; • et • Schufa Holding AG, Kormoranweg 5, 65201 Wiesbaden, Allemagne. Numéro d&#x27;enregistrement (registre du commerce) : non publiquement accessible ; numéro d&#x27;identification fiscale : DE87ZZZ00000239351. 5. « Objet du recours » Le recours porte sur la violation du RGPD et des droits fondamentaux par Deutsche Telekom AG. J&#x27;assigne dès lors les sociétés désignées ci-dessus en réparation du préjudice causé par leur comportement frauduleux à mon égard, et je demande le paiement de 500 000 € pour chacune séparément, en priant le tribunal de condamner chacune d&#x27;elles à verser cette somme sur mon compte auprès de Slovenská sporiteľňa : IBAN : SK59 0900 0000 0052 0995 7308 BIC : GIBASKBX. 6. « Exposé des faits » Description de l&#x27;événement : Lors de l&#x27;examen de ma demande de raccordement internet fixe, en juillet, un jour non précisé de l&#x27;année 2022, Deutsche Telekom AG (ci-après « Telekom ») a traité — et traite toujours — de manière illicite mes données personnelles au moyen d&#x27;une décision individuelle automatisée, fondée sur le recours au procédé frauduleux de l&#x27;agence frauduleuse Schufa relatif à la « BONITÄT » (solvabilité) du consommateur, sans le consentement éclairé de celui-ci. Il est ainsi porté atteinte à mon droit fondamental de l&#x27;Union — le droit d&#x27;accès à internet auprès du fournisseur Deutsche Telekom AG. Le gouvernement, qui couvre cette méga-fraude cartellaire, me prive non</p>"}, {"n": 2, "body": "<p>seulement du raccordement à internet, violant ainsi mes droits fondamentaux — le droit d&#x27;accès à internet — mais m&#x27;a de surcroît contraint à acheter des données internet pour 108 €/mois via une SIM 5G prépayée de Telekom, ce dont je dispose également de preuves, exposées dans la Plainte adressée à la Commission européenne, laquelle est annexée à la présente action. Des données illimitées me sont vitales, car j&#x27;ai besoin d&#x27;apprendre l&#x27;anglais quotidiennement, langue nécessaire à mon développement professionnel. Preuves : Les preuves détaillées figurent dans les annexes de la présente action, au format PDF, qui doivent être étudiées par le juge concrètement désigné. Voici la liste des fichiers PDF : – 10. Strafrechtliche Mitteilung_Telekom and Schufa_sharp_Deutsch_fy.pdf – 11. Strafrechtliche Mitteilung_Telekom_Altstadt_Angestellter 1_with_QES.pdf – 12. Strafrechtliche Mitteilung über GP Peter Frank_with_signature_QES.PDF – 13. CS Complaint form request_0_koncept_ostrý_nahlásenie EU komisii podvod_with_QES.pdf – 14. Anzeige über Schindler_unterschrift_signed_with_QES.pdf – 15. Benachrichtigung der Telekom Mitarbeitern Telekom 94-95 Altstadt_with_QES.pdf 16. « Motifs juridiques » Violation de la loi : Il s&#x27;agit principalement de la violation de la loi protégeant mes données personnelles protégées de consommateur et du droit universel (service) d&#x27;accès à internet, sans restriction ni discrimination — § 78 TKG. Telekommunikationsgesetz (TKG), § 78 (service universel) : ce paragraphe dispose que les fournisseurs de services de télécommunications publics doivent garantir à tous les utilisateurs finals l&#x27;accès à des services de communications électroniques disponibles et de qualité, y compris l&#x27;accès de base à internet. Les fournisseurs ne peuvent discriminer aucun utilisateur et doivent assurer que les services soient fournis à un prix raisonnable. Or, un prix de 108 €/mois pour une qualité de 20 Mbit/s et une connexion instable est inacceptable et dépasse toute limite de tolérance. En termes généraux, nul ne peut restreindre le consommateur dans son droit d&#x27;accès à internet, car il s&#x27;agit de son droit et de sa liberté fondamentaux, qui priment sur n&#x27;importe quel intérêt « légitime » du fournisseur ! La personne concernée a le droit de ne pas faire l&#x27;objet d&#x27;une décision fondée exclusivement sur un traitement (une décision) individuel automatisé, y compris le profilage, produisant des effets juridiques la concernant ou l&#x27;affectant de manière significative (négativement) de façon analogue (RGPD) ! Lorsque le traitement est fondé sur le consentement, le responsable du traitement doit pouvoir démontrer que la personne concernée a consenti au traitement de ses données personnelles protégées. Or cela non plus n&#x27;est nullement respecté. Ainsi, si Telekom souhaitait recourir à une décision individuelle automatisée lors de la demande d&#x27;un consommateur de raccordement internet, il serait tenu de solliciter le consentement éclairé du consommateur ! En vertu de l&#x27;article 6 du RGPD, la société Deutsche Telekom AG a violé mes droits à la protection des données personnelles. Le RGPD confère aux individus le droit d&#x27;être informés de l&#x27;existence d&#x27;une décision individuelle automatisée, de sa logique et de ses conséquences. Telekom ne m&#x27;a pas offert, n&#x27;offre pas cette possibilité et applique arbitrairement le régime illicite de la décision individuelle automatisée lors de l&#x27;examen de la demande de raccordement internet (service), ne me laissant aucune possibilité d&#x27;exprimer</p>"}, {"n": 3, "body": "<p>mon désaccord quant à l&#x27;usage d&#x27;une décision automatisée, puisqu&#x27;il ne m&#x27;informe même pas des conséquences éventuelles de son usage. Il n&#x27;a pas obtenu mon consentement éclairé et se comporte comme si les lois n&#x27;existaient pas pour lui ! Enfin, il s&#x27;agit de la loi sur la protection des données personnelles du consommateur, que ces sociétés violent en ce que l&#x27;information sur l&#x27;insolvabilité, obtenue auprès des huissiers, est vendue par la société Schufa Holding AG (à des fins lucratives) pour traitement aux sociétés de télécommunications, sous forme électronique via internet, en vue d&#x27;une décision individuelle automatisée fondée sur une prétendue solvabilité (frauduleuse) du consommateur-demandeur d&#x27;accès à internet, et ce sans le consentement éclairé du consommateur. À quoi sert alors la loi sur la protection des données personnelles ? Telekom a pris une décision individuelle automatisée sur la base de laquelle il m&#x27;a refusé les services internet ; en conséquence, j&#x27;ai dû acheter un routeur 5G ZTE 5001 et une carte SIM 5G pour capter le signal internet et me raccorder au service « internet ». Le prix de l&#x27;appareil s&#x27;élevait à environ 300 €. Le prix de la carte SIM pour 28 jours est de 100 €, de sorte que les coûts mensuels de 108 € pour faire fonctionner cet appareil sont supérieurs de : 108 € − 40 € = 68 € ! Ce sont là, pour moi, des conséquences négatives considérables, et donc des coûts ! Sans compter que la valeur du raccordement internet par DSL est surévaluée de 170 %. Le prix réel ne devrait ainsi pas dépasser 20 €/mois, et non 40–45 € en raison de l&#x27;entente ! Si internet coûtait ce qu&#x27;il devrait, soit jusqu&#x27;à 20 €, cela représenterait une majoration de 440 %. Et cela signifie aussi que je suis discriminé ! Il en ressort clairement que Telekom tire les ficelles et que chaque citoyen de la République fédérale d&#x27;Allemagne est spolié par lui. Et, comme par magie, il devient soudain possible de payer aussi par une banque slovaque, par virement automatisé. Voilà les prodiges qui surviennent lorsqu&#x27;il faut régler un internet surévalué de plus de 440 % à cause d&#x27;une fraude cartellaire. Une banque allemande n&#x27;est soudain plus une condition à la demande de raccordement internet auprès de Telekom ! Cette condition s&#x27;est tout simplement évaporée en cours de route ! Un accord cartellaire, c&#x27;est-à-dire une action concertée entre deux concurrents ou plus visant à coordonner leur comportement concurrentiel sur le marché ou à influencer les paramètres pertinents de la concurrence, au moyen de pratiques telles que, entre autres, la fixation ou la coordination des prix de vente,</p>"}, {"n": 4, "body": "<p>s&#x27;appelle une entente et constitue une violation du droit de la concurrence, soit des « pratiques commerciales déloyales et un enrichissement sans cause ». Logiquement, Telekom ne dispose donc d&#x27;aucune base juridique au sens de l&#x27;art. 6, § 1, point f) du RGPD pour me refuser, en tant que consommateur, la fourniture de services internet au motif d&#x27;un éventuel surendettement. Car l&#x27;internet surévalué que je dois payer 108 € excède largement la perte éventuelle liée au non-paiement de ma dernière facture de 40 €/mois pour le raccordement DSL de Telekom. Il en découle logiquement que, à cause de Telekom et de sa fraude, c&#x27;est moi qui m&#x27;endette davantage chaque mois, et non Telekom. Sans compter que, pour satisfaire à la base juridique dont Telekom a besoin pour appliquer la décision individuelle automatisée, la loi fixe des conditions : Les obligations légales et l&#x27;intérêt légitime sont deux bases juridiques distinctes en vertu desquelles les organisations peuvent traiter des données personnelles au titre du General Data Protection Regulation (RGPD) et du Bundesdatenschutzgesetz (BDSG). Obligations légales❖ Les obligations légales signifient qu&#x27;une organisation doit traiter des données personnelles afin de remplir ses obligations légales. Cela peut inclure : • Obligations fiscales : traitement de données aux fins de la déclaration fiscale. • Comptabilité : conservation des registres conformément à la loi. • Sécurité : assurer la conformité aux prescriptions et règlements de sécurité. Intérêt légitime L&#x27;intérêt légitime est une base juridique plus souple qui permet le traitement de données personnelles lorsqu&#x27;il est nécessaire aux intérêts légitimes de l&#x27;organisation ou d&#x27;un tiers, à condition que ces intérêts ne prévalent pas sur les droits et libertés de l&#x27;individu. Les exemples incluent : • Prévention de la fraude : traitement de données pour identifier et prévenir la fraude. • Marketing : utilisation de données à des fins de marketing direct. • Sécurité informatique : assurer la sécurité des réseaux et des systèmes d&#x27;information. Comme on le voit, ni sous les obligations légales ni sous l&#x27;intérêt légitime ne relève le droit, pour la société Schufa Holding AG, de manipuler, de commercialiser ou de transmettre de quelque manière que ce soit mes données personnelles protégées par la loi à des tiers tels que Deutsche Telekom AG, sans mon consentement éclairé, en vue de décisions individuelles automatisées ultérieures par la société Telekom. Description des motifs d&#x27;indemnisation➢ En raison de l&#x27;usage abusif de mes données personnelles, obtenues illicitement par la société Schufa et que vous avez transmises à des tiers tels que les sociétés de télécommunications, sans mon consentement quelconque au traitement de mes données personnelles en vue d&#x27;un traitement et de décisions automatisés des sociétés de télécommunications pour la fourniture de services internet, vous avez porté atteinte à mes droits d&#x27;accès aux services internet dans l&#x27;UE, ce qui a conduit au refus de fourniture des services internet de base par les sociétés de télécommunications. Règles de l&#x27;UE relatives à l&#x27;internet ouvert➢ Les règles de l&#x27;UE sur l&#x27;internet ouvert vous confèrent, en tant qu&#x27;utilisateur, le droit d&#x27;accéder aux contenus et services en ligne de votre choix et/ou de les diffuser. Votre fournisseur d&#x27;accès à internet ne peut bloquer, ralentir ni discriminer aucun contenu, application ou service en ligne, à l&#x27;exception de 3 cas particuliers :</p>"}, {"n": 5, "body": "<p>– pour satisfaire à des obligations légales, comme une injonction judiciaire de blocage d&#x27;un contenu illicite déterminé ; – pour lutter contre les virus ou logiciels malveillants ; – pour gérer une congestion exceptionnelle ou temporaire du réseau, afin de préserver la sécurité et l&#x27;intégrité du réseau. RÈGLEMENT (UE) 2015/2120 DU PARLEMENT EUROPÉEN ET DU CONSEIL➢ (1) Le présent règlement vise à établir des règles communes destinées à garantir un traitement égal et non discriminatoire du trafic dans la fourniture de services d&#x27;accès à internet et à protéger les droits connexes des utilisateurs finals. Il vise à protéger les utilisateurs finals et à garantir simultanément le fonctionnement ininterrompu de l&#x27;écosystème internet en tant que moteur de l&#x27;innovation. (6) Les utilisateurs finals devraient avoir le droit d&#x27;accéder aux informations et aux contenus et de les diffuser, ainsi que le droit d&#x27;utiliser et de fournir des applications et des services sans discrimination, par l&#x27;intermédiaire de leur service d&#x27;accès à internet. (7) Afin que les utilisateurs finals puissent exercer leurs droits d&#x27;accéder aux informations et aux contenus et de les diffuser, ainsi que d&#x27;utiliser et de fournir des applications et services de leur choix, ils devraient pouvoir convenir avec les fournisseurs de services d&#x27;accès à internet de tarifs correspondant à des volumes de données et à des vitesses déterminés. Les autorités réglementaires nationales et les autres autorités compétentes devraient être habilitées à intervenir contre les accords (ententes) ou les pratiques commerciales (déloyales) qui, en raison de leur ampleur, conduisent à des situations où le choix des utilisateurs finals est, en pratique, substantiellement réduit (mon cas). (8) Dans la fourniture de services d&#x27;accès à internet, les fournisseurs de ces services devraient traiter tout le trafic de façon égale, sans discrimination, restriction ou interférence, indépendamment de l&#x27;expéditeur ou du destinataire, du contenu, de l&#x27;application ou du service, ou de l&#x27;équipement terminal. Accès ouvert à internet➢ Les fournisseurs d&#x27;accès à internet sont tenus de traiter tout le trafic de façon égale lorsqu&#x27;ils fournissent des services d&#x27;accès à internet : – sans discrimination, restriction ou interférence ; et – indépendamment de l&#x27;expéditeur et du destinataire ; – du contenu consulté ou diffusé ; ou des applications ou services utilisés. Les fournisseurs peuvent recourir à des mesures raisonnables de gestion du trafic, lesquelles doivent toutefois être transparentes, non discriminatoires, proportionnées et ne pas être fondées sur des motifs commerciaux. Pour ces raisons, je n&#x27;ai pu, durablement, utiliser les services internet pour : • Trouver des opportunités d&#x27;emploi — à l&#x27;ère numérique actuelle, l&#x27;accès à internet est souvent indispensable pour chercher un emploi et postuler à des postes, ce qui est aujourd&#x27;hui crucial pour le développement professionnel de la personne dans la société. • Communiquer avec les administrations — de nombreux services publics et communications s&#x27;effectuent désormais en ligne, ce qui signifie que, sans accès à internet, nous sommes désavantagés. • Activités entrepreneuriales — pour les entrepreneurs, l&#x27;accès à internet est essentiel à la gestion de leur activité, au marketing et à la communication avec les clients.</p>"}, {"n": 6, "body": "<p>• Apprentissage de l&#x27;anglais — l&#x27;éducation et le développement personnel, y compris l&#x27;apprentissage des langues, dépendent directement des ressources et cours en ligne. Internet m&#x27;est essentiel pour apprendre l&#x27;anglais, car il me fournit un retour immédiat ainsi que des enregistrements audio et vidéo pour apprendre la prononciation de cette langue, en combinaison avec l&#x27;apprentissage de la grammaire. Ces points montrent clairement comment l&#x27;accès à internet peut être considéré comme un besoin fondamental et un droit fondamental, permettant aux individus de participer pleinement à la société et à l&#x27;économie. Les sociétés Schufa et Telekom ont abusé de mes données personnelles pour empêcher, de manière vile et perfide, l&#x27;accès aux services internet des sociétés de télécommunications, ce qui a restreint mon accès aux services internet — une violation grave de mon droit au libre accès à internet. En lien avec la violation de mes droits et libertés fondamentaux, j&#x27;ai souffert émotionnellement et éprouvé des émotions négatives, subissant une souffrance mentale et psychique. J&#x27;ai éprouvé de l&#x27;anxiété, de la frustration, des dépressions et je ne parvenais à me concentrer sur rien, ce qui me liait les mains. Je ne pouvais utiliser les services internet selon mes attentes et mes besoins et, par conséquent, j&#x27;ai éprouvé des émotions négatives, une souffrance psychique et du stress, me plaçant sous une pression énorme. La société Schufa Holding AG traite, collecte, manipule et commercialise illicitement mes données personnelles sans mon consentement, ce qui est considéré comme une violation de la loi sur la protection des données personnelles (DSGVO/RGPD) ; un tel comportement illicite peut être qualifié d&#x27;infraction pénale et entraîner des conséquences pénales. Les activités de la société Schufa Holding AG peuvent également être comprises comme organisées en coopération avec les huissiers, les banques et les sociétés de télécommunications sous forme d&#x27;ENTENTE (cartel), en vue de créer un monopole sur le marché et d&#x27;exercer une pression sur les débiteurs pour qu&#x27;ils règlent leurs dettes. Un tel comportement peut aussi être considéré comme un chantage envers les débiteurs — soit des infractions pénales telles que le chantage, les accords cartellaires ou l&#x27;abus de position dominante. Si je ne paie pas mes dettes, je n&#x27;obtiens pas internet. Ce qui est également en contradiction flagrante avec les bonnes mœurs. Il importe de relever que le RGPD et les autres lois sur la protection des données fixent des règles claires concernant le traitement des données personnelles, notamment que les personnes concernées doivent être informées de la manière et des raisons du traitement de leurs données et doivent pouvoir s&#x27;opposer à ce traitement ; sans leur consentement éclairé, ces données ne peuvent en aucun cas être utilisées, et encore moins aux fins d&#x27;une décision individuelle automatisée. DIRECTIVE 2014/104/UE DU PARLEMENT EUROPÉEN ET DU CONSEIL du 26 novembre 2014 relative à certaines règles régissant les actions en dommages et intérêts en droit national pour les infractions au droit de la concurrence des États membres et de l&#x27;Union européenne (4) Le droit, découlant du droit de l&#x27;Union, à réparation du préjudice causé par les infractions au droit de la concurrence de l&#x27;Union et au droit national exige que chaque État membre dispose de règles procédurales garantissant l&#x27;exercice effectif de ce droit. CHAPITRE V — Détermination du montant du préjudice — Article 17 1. Les États membres veillent à ce que la charge de la preuve et le niveau de preuve requis pour la détermination du montant du préjudice ne rendent pas pratiquement impossible ou excessivement difficile l&#x27;exercice du droit à réparation. Les États membres veillent à ce que les juridictions nationales soient habilitées, conformément aux procédures nationales, à estimer le montant du préjudice s&#x27;il est établi qu&#x27;un demandeur a subi un préjudice mais qu&#x27;il est pratiquement impossible ou excessivement difficile de quantifier avec précision le préjudice subi sur la base des preuves disponibles.</p>"}, {"n": 7, "body": "<p>(11) En l&#x27;absence de règles de l&#x27;Union, les actions en dommages et intérêts sont régies par les règles et procédures nationales des États membres. Selon la jurisprudence de la Cour de justice de l&#x27;Union européenne (ci-après la « Cour »), toute personne a le droit de demander réparation du préjudice subi lorsqu&#x27;il existe un lien de causalité entre ce préjudice et une infraction au droit de la concurrence. (13) Le droit à réparation est reconnu à toute personne physique ou morale — consommateurs, entreprises ou autorités publiques — indépendamment de l&#x27;existence d&#x27;une relation contractuelle directe avec l&#x27;entreprise auteur de l&#x27;infraction, et indépendamment du fait qu&#x27;une autorité de concurrence ait ou non préalablement constaté l&#x27;infraction. 8. Valeurs de l&#x27;UE Priorités de l&#x27;Union européenne pour les années 2024–2029 Une Europe libre et démocratique ▪ promotion des valeurs européennes au sein de l&#x27;UE ; ▪ respect des valeurs de l&#x27;UE à l&#x27;échelle mondiale. Une Europe forte et sûre ▪ garantir une action extérieure cohérente et influente ; ▪ renforcer la sécurité et la défense de l&#x27;UE et protéger les citoyens de l&#x27;UE ; ▪ préparer une Union plus grande et plus forte ; ▪ promouvoir une approche globale de la migration et de la gestion des frontières. Une Europe prospère et compétitive ▪ renforcer la compétitivité de l&#x27;UE ; ▪ réussir les transitions verte et numérique ; ▪ soutenir un environnement favorable à l&#x27;innovation et à l&#x27;entrepreneuriat ; ▪ progresser ensemble. 1. Comment l&#x27;Union nous assure-t-elle la protection des citoyens, si les États les plus puissants, comme l&#x27;Allemagne, violent les droits fondamentaux, spolient leurs citoyens tout en nous mentant sur la manière dont ils nous protègent ? 2. Comment l&#x27;Union entend-elle renforcer notre compétitivité, alors que la méga-entente frauduleuse Schufa-Telekom cherche à être étouffée jusque par la présidente de la Commission européenne, Ursula von der Leyen, alors qu&#x27;une entente est l&#x27;opposé de la compétitivité ? Agence des droits fondamentaux de l&#x27;Union européenne (FRA) L&#x27;Agence des droits fondamentaux de l&#x27;UE (FRA) fournit aux décideurs européens et nationaux des conseils indépendants et fondés sur des données probantes, contribuant à ce que les débats, les politiques et les législations relatifs aux droits fondamentaux reposent sur une masse critique d&#x27;éléments et soient ciblés. Missions L&#x27;Agence conseille les institutions de l&#x27;UE et les gouvernements sur les droits fondamentaux, principalement dans les domaines suivants : ▪ racisme et xénophobie ; ▪ discrimination ;</p>"}, {"n": 8, "body": "<p>▪ accès à la justice ; ▪ protection des données ; ▪ droits des victimes ; ▪ droits de l&#x27;enfant. L&#x27;Agence a pour but de contribuer à une promotion et à une protection plus efficaces des droits fondamentaux dans toute l&#x27;UE. À cette fin, elle consulte ses partenaires et coopère avec eux pour : ▪ collecter et analyser des informations et des données au moyen de recherches socio-juridiques ; ▪ fournir une assistance et une expertise ; ▪ communiquer et sensibiliser aux droits. À quoi et à qui servent ces agences, lorsque la Commission européenne fait ce qu&#x27;elle veut et que la violation des droits fondamentaux ainsi que la violation de la loi protégeant les données personnelles protégées du consommateur sont ignorées par la présidente de la Commission, Ursula von der Leyen ? Il y a là une intention manifeste d&#x27;étouffer cette fraude, dès lors qu&#x27;elle est en connivence avec l&#x27;Allemagne au vu de ses origines — il y a donc un conflit d&#x27;intérêts ! Est-ce ainsi qu&#x27;on leur apprend à communiquer (FRA), pour que Mme von der Leyen refuse de communiquer avec moi ? L&#x27;UE doit être compétitive et non créer des monopoles ! En preuve, je joins un courriel adressé à Mme von der Leyen. 17. Conclusions Demande : Conformément aux lois et règlements, mes droits ont été violés et je demande donc réparation du préjudice. En vertu de l&#x27;article 82 du RGPD, j&#x27;ai droit à réparation du préjudice causé par le traitement illicite de mes données personnelles. Je demande que me soit versée une indemnité pour le temps consacré à la découverte de cette fraude, pour le préjudice psychique, pour le traumatisme à vie et pour les vols que les auteurs défendeurs de la fraude ont commis et commettent encore à mon égard et à l&#x27;égard des masses de citoyens allemands — y compris vous, Monsieur le juge — par le refus illicite de fournir un accès internet de base et par le prix excessif des services fournis en raison de l&#x27;entente existant entre les sociétés de télécommunications. L&#x27;entente conduit à des prix élevés du fait de l&#x27;absence de concurrence. Je demande en outre des excuses écrites, par lettre, adressées à ma personne, pour le traumatisme que je suis contraint de supporter depuis plusieurs années. 18. Conclusion Monsieur le juge, dans le présent document (l&#x27;Action), je décris l&#x27;état de fait de la fraude et du vol que les sociétés susmentionnées m&#x27;ont appliqués et m&#x27;appliquent encore, sous une forme succincte, uniquement afin de vous éclairer sur l&#x27;ensemble de la fraude commise par ces sociétés. Toutes les autres informations détaillées sont amplement exposées dans les annexes des Plaintes pénales et des Plaintes à la Commission européenne, qui sont annexées à la présente action au format PDF et sont signées de manière manuscrite par signature physique ainsi que par la signature invisible QES, y compris la présente action. J&#x27;invite également le tribunal de Landshut à ordonner aux sociétés défenderesses de mettre fin à cette fraude pour les motifs illicites d&#x27;application exposés ci-dessus, et à les condamner à verser mon indemnité par ordonnance de paiement. La société Deutsche Telekom AG spolie chaque jour une nation de 84 552 242</p>"}, {"n": 9, "body": "<p>habitants, à la pointe du progrès technologique, et ce au grand jour, sous la forme d&#x27;une violation des droits fondamentaux — ce qui ne se voit pas si facilement, y compris pour vous et votre famille, Monsieur/Madame le/la juge. [Le présent document est signé par QES] Respectueusement, à Kumhausen, le 2.10.2024 Peter Ferenc ........................ citoyen de l&#x27;Union européenne</p>"}]}, "sv": {"title": "Talan mot Deutsche Telekom AG och Schufa Holding AG", "pages": [{"n": 1, "body": "<p>”Kärande” Peter Ferenc Rammelkam 2, Kumhausen Deutschland +49 157 317 33332 info@foxprof.club Amtsgericht Landshut Maximilianstraße 22 84028 Landshut Deutschland i Kumhausen, 2.10.2024 STÄMNINGSANSÖKAN 4. ”Svarande” • Deutsche Telekom AG, Friedrich-Ebert-Allee 140, 53113 Bonn, Tyskland. Registreringsnummer (handelsregister): HRB 6794 (distriktsdomstolen i Bonn); • och • Schufa Holding AG, Kormoranweg 5, 65201 Wiesbaden, Tyskland. Registreringsnummer (handelsregister): ej offentligt tillgängligt; skatteregistreringsnummer: DE87ZZZ00000239351. 5. ”Talans föremål” Talan avser överträdelse av GDPR och de mänskliga rättigheterna av bolaget Deutsche Telekom AG. Jag stämmer därför de ovan angivna bolagen om ersättning för den skada som orsakats genom bedrägligt handlande mot min person och yrkar betalning av 500 000 EUR för vart och ett separat, så att domstolen förpliktar var och en av dem att betala det angivna beloppet till mitt konto hos Slovenská sporiteľňa: IBAN: SK59 0900 0000 0052 0995 7308 BIC: GIBASKBX. 6. ”Sakframställning” Beskrivning av händelsen: Vid prövningen av min ansökan om en fast internetanslutning i juli, en icke exakt fastställd dag år 2022, behandlade — och behandlar alltjämt — bolaget Deutsche Telekom AG (nedan: Telekom) olagligen mina personuppgifter i form av automatiserad individuell behandling (beslut), som grundar sig på användningen av bedrägeriknepet från den bedrägliga byrån Schufa avseende konsumentens ”BONITÄT” (kreditvärdighet), utan dennes informerade samtycke (konsumentens). Därigenom kränks min grundläggande unionsrättighet — rätten till internetåtkomst genom leverantören Deutsche Telekom AG. Regeringen, som skyddar detta megakartellbedrägeri, berövar mig inte bara</p>"}, {"n": 2, "body": "<p>internetanslutningen och kränker därmed mina grundläggande mänskliga rättigheter — rätten till internetåtkomst — utan tvingade mig även att köpa internetdata för 108 EUR i månaden via ett 5G SIM- prepaidkort från Telekom, för vilket jag också har bevis som anges i klagomålet till Europeiska kommissionen, vilket bifogas denna talan. Obegränsad data är livsviktig för mig, eftersom jag dagligen måste lära mig engelska, som jag behöver för min fortsatta yrkesmässiga utveckling. Bevis: Detaljerade bevis finns i bilagorna till denna talan i PDF-format, vilka måste studeras av den konkret tilldelade domaren. Här är förteckningen över PDF-filer: – 10. Strafrechtliche Mitteilung_Telekom and Schufa_sharp_Deutsch_fy.pdf – 11. Strafrechtliche Mitteilung_Telekom_Altstadt_Angestellter 1_with_QES.pdf – 12. Strafrechtliche Mitteilung über GP Peter Frank_with_signature_QES.PDF – 13. CS Complaint form request_0_koncept_ostrý_nahlásenie EU komisii podvod_with_QES.pdf – 14. Anzeige über Schindler_unterschrift_signed_with_QES.pdf – 15. Benachrichtigung der Telekom Mitarbeitern Telekom 94-95 Altstadt_with_QES.pdf 16. ”Rättsliga grunder” Överträdelse av lagen: Det rör sig främst om en överträdelse av lagen till skydd för mina skyddade personuppgifter som konsument och av den samhällsomfattande tjänsten för internetåtkomst utan begränsning och diskriminering — § 78 TKG. Telekommunikationsgesetz (TKG), § 78 (samhällsomfattande tjänst): denna paragraf föreskriver att leverantörer av allmänna telekommunikationstjänster måste säkerställa att alla slutanvändare har tillgång till tillgängliga elektroniska kommunikationstjänster av hög kvalitet, inbegripet grundläggande internetåtkomst. Leverantörerna får inte diskriminera någon användare och måste säkerställa att tjänsterna tillhandahålls till ett rimligt pris. Och ett pris på 108 EUR i månaden för en kvalitet på 20 Mbit/s överföringshastighet och en instabil anslutning är oacceptabelt och bortom varje toleransgräns. Allmänt sett kan ingen begränsa konsumenten i dennes rätt till internetåtkomst, eftersom det är dennes grundläggande rättighet och frihet, som väger tyngre än varje ”berättigat” intresse hos leverantören! Den registrerade har rätt att inte bli föremål för ett beslut som enbart grundas på automatiserad individuell behandling (beslutsfattande) av uppgifter, inbegripet profilering, som har rättsliga följder för denne eller på liknande sätt i betydande grad (negativt) påverkar denne (GDPR)! Om behandlingen grundas på samtycke måste den personuppgiftsansvarige kunna visa att den registrerade har samtyckt till behandlingen av sina skyddade personuppgifter. Och detta iakttas inte heller alls. Om Telekom vid konsumentens ansökan om internetanslutning skulle vilja tillämpa ett automatiserat individuellt beslut, är bolaget alltså skyldigt att begära konsumentens informerade samtycke! Enligt artikel 6 i GDPR har bolaget Deutsche Telekom AG kränkt mina rättigheter till skydd av personuppgifter. GDPR ger enskilda rätten att bli informerade om förekomsten av ett automatiserat individuellt beslut, dess logik och dess följder. Telekom har inte gett mig denna möjlighet, ger den inte och tillämpar godtyckligt regimen med olagligt automatiserat individuellt beslut vid prövningen av ansökan om internetanslutning (tjänster), eftersom bolaget inte ger mig någon möjlighet att uttrycka min invändning mot användningen av det automatiserade beslutet, då det inte ens informerar mig om de möjliga följderna av</p>"}, {"n": 3, "body": "<p>dess användning. Mitt informerade samtycke inhämtades inte och bolaget uppträder som om lagarna inte fanns för det! Och sist men inte minst rör det sig om lagen till skydd för konsumentens personuppgifter, som dessa bolag överträder genom att bolaget Schufa Holding AG säljer information om insolvens från exekutorer (för ekonomisk vinning) till telekommunikationsbolag i elektronisk form via internet för behandling av ett automatiserat individuellt beslut i form av konsumentens påstådda (bedrägliga) kreditvärdighet — den som ansöker om internetåtkomst — och detta utan konsumentens informerade samtycke. Vad tjänar då lagen till skydd för personuppgifter till? Telekom fattade ett automatiserat individuellt beslut på grundval av vilket det nekade mig internettjänster, varför jag var tvungen att köpa en router 5G ZTE 5001 och ett 5G SIM-kort för att ta emot internetsignalen och ansluta mig till tjänsten ”internet”. Priset för enheten var omkring 300 EUR. Priset för SIM-kortet för 28 dagar är 100 EUR, så mina månatliga kostnader på 108 EUR för att driva denna enhet är högre med: 108 EUR − 40 EUR = 68 EUR! För mig är detta betydande negativa följder och därmed också kostnader! För att inte tala om att värdet av internetanslutningen via DSL är överprissatt med 170 %. Det verkliga priset borde inte överstiga 20 EUR i månaden, och inte 40–45 EUR på grund av kartellen! Om internet kostade vad det borde, upp till 20 EUR, skulle det vara överprissatt med 440 %. Och det betyder också att jag diskrimineras! Av detta framgår tydligt att Telekom drar det kortaste strået och att varje medborgare i Förbundsrepubliken Tyskland blir bestulen av det. Och som genom ett under går det plötsligt att betala även med en slovakisk bank genom automatiserad överföring. Det är under, när man måste betala för ett internet som är överprissatt med mer än 440 % på grund av kartellbedrägeri. En tysk bank är inte längre ett villkor vid ansökan om internetanslutning hos Telekom! Det villkoret dunstade helt enkelt bort på vägen! En kartellöverenskommelse, det vill säga ett samordnat förfarande mellan två eller flera konkurrenter i syfte att samordna deras konkurrensbeteende på marknaden eller påverka relevanta konkurrensparametrar, genom förfaranden såsom bland annat fastställande eller samordning av försäljningspriser på marknaden, kallas kartell och utgör en överträdelse av konkurrensreglerna, det vill säga ”otillbörliga affärsmetoder och obehörig vinst”.</p>"}, {"n": 4, "body": "<p>Logiskt sett förfogar Telekom således inte över någon rättslig grund enligt art. 6.1 f i GDPR för att neka mig som konsument internettjänster på grund av eventuell överskuldsättning. Ty det överprisade internet som jag måste betala 108 EUR för överstiger vida den möjliga förlusten vid utebliven betalning av mitt sista faktureringsbelopp på 40 EUR i månaden för Telekoms DSL-anslutning. Av detta följer logiskt att det är jag som, tack vare Telekom och dess bedrägeri mot mig, skuldsätter mig allt mer varje månad, och inte Telekom. För att inte tala om att för att uppfylla den rättsliga grund som Telekom behöver för att tillämpa det automatiserade individuella beslutet, fastställer lagen villkor: Rättsliga skyldigheter och berättigat intresse är två olika rättsliga grunder på vilka organisationer kan behandla personuppgifter enligt General Data Protection Regulation (GDPR) och Bundesdatenschutzgesetz (BDSG). Rättsliga skyldigheter❖ Rättsliga skyldigheter innebär att en organisation måste behandla personuppgifter för att fullgöra sina lagstadgade skyldigheter. Detta kan omfatta: • Skatteskyldigheter: behandling av uppgifter för skattedeklaration. • Bokföring: förande av register i enlighet med lagen. • Säkerhet: säkerställande av efterlevnad av säkerhetsföreskrifter och -bestämmelser. Berättigat intresse Berättigat intresse är en mer flexibel rättslig grund som möjliggör behandling av personuppgifter när det är nödvändigt för organisationens eller en tredje parts berättigade intressen, förutsatt att dessa intressen inte väger tyngre än den enskildes rättigheter och friheter. Exempel omfattar: • Förebyggande av bedrägeri: behandling av uppgifter för att identifiera och förebygga bedrägeri. • Marknadsföring: användning av uppgifter för direktmarknadsföring. • IT-säkerhet: säkerställande av nät- och informationssystemens säkerhet. Som framgår omfattas varken av rättsliga skyldigheter eller av berättigat intresse rätten för bolaget Schufa Holding AG att manipulera, handla med eller på något sätt tillhandahålla mina lagligt skyddade personuppgifter till tredje parter såsom Deutsche Telekom AG utan mitt informerade samtycke, för ytterligare automatiserade individuella beslut av bolaget Telekom. Beskrivning av grunderna för ersättningen➢ På grund av missbruket av mina personuppgifter, som bolaget Schufa erhållit på olagligt sätt och som ni tillhandahållit tredje parter såsom telekommunikationsbolag, utan något samtycke från mig till behandlingen av mina personuppgifter för automatiserad behandling och beslut av telekommunikationsbolag för tillhandahållande av internettjänster, har ni skadat mina rättigheter till åtkomst till internettjänster i EU, vilket ledde till vägran att tillhandahålla grundläggande internettjänster från telekommunikationsbolagens sida. EU:s regler om ett öppet internet➢ EU:s regler om ett öppet internet ger dig som användare rätt att få åtkomst till och sprida vilket innehåll och vilka tjänster online du vill. Din internetleverantör får inte blockera, sakta ner eller diskriminera något innehåll, någon applikation eller tjänst online, utom i 3 särskilda fall: – för att fullgöra rättsliga skyldigheter, såsom ett domstolsbeslut om blockering av visst olagligt innehåll; – för att bekämpa virus eller skadlig programvara;</p>"}, {"n": 5, "body": "<p>– för att hantera exceptionell eller tillfällig överbelastning av nätet, för att bevara nätets säkerhet och integritet. EUROPAPARLAMENTETS OCH RÅDETS FÖRORDNING (EU) 2015/2120➢ (1) Syftet med denna förordning är att fastställa gemensamma regler för att säkerställa en likvärdig och icke- diskriminerande behandling av trafiken vid tillhandahållande av internetanslutningstjänster och tillhörande slutanvändarrättigheter. Syftet är att skydda slutanvändarna och samtidigt garantera att internets ekosystem fortsätter att fungera som en drivkraft för innovation. (6) Slutanvändarna bör ha rätt att få åtkomst till och sprida information och innehåll samt att använda och tillhandahålla applikationer och tjänster utan diskriminering via sin internetanslutningstjänst. (7) För att slutanvändarna ska kunna utöva sina rättigheter att få åtkomst till och sprida information och innehåll samt att använda och tillhandahålla applikationer och tjänster efter eget val, bör de kunna komma överens med leverantörer av internetanslutningstjänster om taxor för bestämda datavolymer och hastigheter för internetanslutningstjänsten. Nationella regleringsmyndigheter och andra behöriga myndigheter bör ha befogenhet att ingripa mot avtal (karteller) eller (otillbörliga) affärsmetoder som, på grund av sin omfattning, leder till situationer där slutanvändarnas val i praktiken är väsentligen begränsat (mitt fall). (8) Vid tillhandahållande av internetanslutningstjänster bör leverantörerna av dessa tjänster behandla all trafik lika, utan diskriminering, begränsning eller störning, oberoende av avsändare eller mottagare, innehåll, applikation eller tjänst, eller terminalutrustning. Öppen åtkomst till internet➢ Internetleverantörer är skyldiga att behandla all trafik lika när de tillhandahåller internetanslutningstjänster: – utan diskriminering, begränsning eller störning; och – oberoende av avsändare och mottagare; – det innehåll som man får åtkomst till eller sprider; eller de applikationer eller tjänster som används. Leverantörer får vidta rimliga trafikstyrningsåtgärder, vilka dock måste vara transparenta, icke- diskriminerande, proportionella och inte grundade på kommersiella skäl. Av dessa skäl har jag under lång tid inte kunnat använda internettjänster för att: • Skaffa arbetsmöjligheter — i dagens digitala tidsålder är internetåtkomst ofta oumbärlig för att söka arbete och ansöka om tjänster, vilket i dag är avgörande för personens yrkesmässiga utveckling i samhället. • Kommunicera med myndigheter — många offentliga tjänster och kommunikation sker numera online, vilket innebär att vi utan internetåtkomst är missgynnade. • Företagsverksamhet — för företagare är internetåtkomst avgörande för att driva verksamheten, marknadsföra och kommunicera med kunder. • Studera engelska — utbildning och personlig utveckling, inbegripet språkstudier, är direkt beroende av resurser och kurser online. Internet är avgörande för mig för att lära mig engelska, eftersom det ger mig omedelbar återkoppling och ljud- och videoinspelningar för att lära mig uttal i kombination med grammatikstudier. Dessa punkter visar tydligt hur internetåtkomst kan betraktas som ett grundläggande behov och en grundläggande rättighet som gör det möjligt för enskilda att fullt ut delta i samhället och ekonomin. Bolagen</p>"}, {"n": 6, "body": "<p>Schufa och Telekom missbrukade mina personuppgifter för att på ett gement och lömskt sätt hindra min åtkomst till telekommunikationsbolagens internettjänster, vilket ledde till en begränsning av min åtkomst till internettjänster — en allvarlig kränkning av mina rättigheter till fri internetåtkomst. I samband med kränkningen av mina mänskliga rättigheter och friheter har jag lidit känslomässigt och upplevt negativa känslor, varigenom jag lidit mentalt och själsligt. Jag har upplevt ångest, frustration, depression och kunde inte koncentrera mig på något, vilket band mina händer. Jag kunde inte använda internettjänsterna enligt mina förväntningar och behov och upplevde till följd därav negativa känslor, själsligt lidande och stress, varför jag befinner mig under enorm press. Bolaget Schufa Holding AG behandlar, samlar in, manipulerar och handlar olagligen med mina personuppgifter utan mitt samtycke, vilket anses vara en överträdelse av lagen om skydd av personuppgifter (DSGVO), GDPR, och sådant olagligt beteende kan anses vara ett brott och leda till straffrättsliga följder. Bolaget Schufa Holding AG:s verksamhet kan också förstås som organiserad i samverkan med exekutorer, banker och telekommunikationsbolag som en KARTELL, i syfte att skapa ett monopol på marknaden och utöva påtryckningar på gäldenärer att betala sina skulder. Sådant beteende kan också betraktas som utpressning av gäldenärer — brott såsom utpressning, kartellöverenskommelser eller missbruk av dominerande ställning på marknaden. Om jag inte betalar mina skulder får jag inget internet. Vilket också står i skarp strid med god sed. Det är viktigt att notera att GDPR och andra dataskyddslagar fastställer tydliga regler för behandlingen av personuppgifter, bland annat att de registrerade måste informeras om hur och varför deras uppgifter behandlas och måste ha möjlighet att invända mot denna behandling; utan deras informerade samtycke får uppgifterna i inget fall användas, och än mindre för ändamål som rör automatiserat individuellt beslut. EUROPAPARLAMENTETS OCH RÅDETS DIREKTIV 2014/104/EU av den 26 november 2014 om vissa regler som styr skadeståndstalan enligt nationell rätt för överträdelser av medlemsstaternas och Europeiska unionens konkurrensrättsliga bestämmelser (4) Den rätt till ersättning för skada som orsakats av överträdelser av unionens och nationell konkurrensrätt och som följer av unionsrätten kräver att alla medlemsstater har processuella regler som säkerställer ett effektivt utövande av denna rätt. KAPITEL V — Fastställande av skadans storlek — Artikel 17 1. Medlemsstaterna ska säkerställa att bevisbördan och det beviskrav som krävs för att fastställa skadans storlek inte gör utövandet av rätten till ersättning praktiskt omöjligt eller orimligt svårt. Medlemsstaterna ska säkerställa att de nationella domstolarna har befogenhet att, i enlighet med nationella förfaranden, uppskatta skadans storlek om det är fastställt att käranden lidit skada men det på grundval av tillgänglig bevisning är praktiskt omöjligt eller orimligt svårt att exakt fastställa den lidna skadans storlek. (11) I avsaknad av unionsregler regleras skadeståndstalan av medlemsstaternas nationella regler och förfaranden. Enligt rättspraxis från Europeiska unionens domstol (nedan: ”domstolen”) har var och en rätt att kräva ersättning för lidna skador om det finns ett orsakssamband mellan skadan och överträdelsen av konkurrensrätten. (13) Rätten till ersättning för skada tillerkänns varje fysisk eller juridisk person — konsumenter, företag eller offentliga myndigheter — oberoende av om det finns ett direkt avtalsförhållande med det företag som begått överträdelsen och oberoende av om en konkurrensmyndighet tidigare har fastställt överträdelsen. 8. EU:s värden</p>"}, {"n": 7, "body": "<p>Europeiska unionens prioriteringar för åren 2024 – 2029 Ett fritt och demokratiskt Europa ▪ främjande av europeiska värden inom EU; ▪ upprätthållande av EU:s värden på global nivå. Ett starkt och säkert Europa ▪ säkerställa ett sammanhållet och inflytelserikt yttre agerande; ▪ stärka EU:s säkerhet och försvar och skydda EU:s medborgare; ▪ förbereda sig för en större och starkare union; ▪ främja en övergripande strategi för migration och gränsförvaltning. Ett välmående och konkurrenskraftigt Europa ▪ stärka EU:s konkurrenskraft; ▪ framgångsrikt genomföra den gröna och digitala omställningen; ▪ stödja en miljö som gynnar innovation och företagande; ▪ gemensamma framsteg. 1. Hur säkerställer unionen skyddet av medborgarna, om de starkaste staterna som Tyskland kränker de mänskliga rättigheterna, bestjäl sina medborgare och ljuger för oss om hur de skyddar oss? 2. Hur avser unionen att stärka vår konkurrenskraft, när den bedrägliga megakartellen Schufa-Telekom vill sopas under mattan även av kommissionens ordförande Ursula von der Leyen, då en kartell är motsatsen till konkurrenskraft? Europeiska unionens byrå för grundläggande rättigheter (FRA) EU:s byrå för grundläggande rättigheter (FRA) ger europeiska och nationella beslutsfattare oberoende och evidensbaserad rådgivning och bidrar därigenom till att diskussioner, politik och lagstiftning om grundläggande rättigheter vilar på en kritisk massa av underlag och är målinriktade. Uppgifter Byrån ger EU:s institutioner och regeringar råd om grundläggande rättigheter, främst inom följande områden: ▪ rasism och främlingsfientlighet; ▪ diskriminering; ▪ tillgång till rättslig prövning; ▪ dataskydd; ▪ brottsoffers rättigheter; ▪ barnets rättigheter. Byråns syfte är att bidra till ett mer effektivt främjande och skydd av de grundläggande rättigheterna i hela EU. I detta syfte samråder den med och samarbetar med sina partner för att: ▪ samla in och analysera information och uppgifter genom socialrättslig forskning; ▪ tillhandahålla hjälp och sakkunnig rådgivning; ▪ kommunicera och öka medvetenheten om rättigheter.</p>"}, {"n": 8, "body": "<p>Vad och vem tjänar dessa byråer, när Europeiska kommissionen gör som den vill och kränkningen av de mänskliga rättigheterna och överträdelsen av lagen till skydd för konsumentens skyddade personuppgifter ignoreras, som av kommissionens ordförande Ursula von der Leyen? Här finns hennes tydliga avsikt att sopa detta bedrägeri under mattan, eftersom hon är i samklang med Tyskland med hänsyn till sitt ursprung — det föreligger alltså en intressekonflikt! Är det så de (FRA) lär dem att kommunicera, att von der Leyen vägrar kommunicera med mig? EU ska vara konkurrenskraftigt och inte skapa monopol! Som bevis bifogar jag ett e-postmeddelande ställt till fru von der Leyen. 17. Förslag till avgörande Yrkande: I enlighet med lagar och förordningar har mina rättigheter kränkts, och jag yrkar därför ersättning för skada. Enligt artikel 82 i GDPR har jag rätt till ersättning för skada som orsakats av den olagliga behandlingen av mina personuppgifter. Jag yrkar att det ska utbetalas ersättning till mig för den tid som ägnats åt att avslöja detta bedrägeri, för psykisk skada, för livslångt trauma och för de stölder som de svarande gärningsmännen bakom bedrägeriet har begått och alltjämt begår mot mig och mot massorna av tyska medborgare — inbegripet er, herr domare — genom det olagliga underlåtandet att tillhandahålla grundläggande internetanslutning och det överdrivna priset för de tillhandahållna tjänsterna på grund av den befintliga kartellen mellan telekommunikationsbolagen. Kartellen leder till höga priser på grund av bristen på konkurrens. Vidare yrkar jag en skriftlig ursäkt genom brev till min person för det trauma som jag sedan flera år är tvungen att bära. 18. Slutsats Ärade domstol, i detta dokument (Talan) beskriver jag det faktiska förhållandet kring det bedrägeri och den stöld som de ovan angivna bolagen har tillämpat och alltjämt tillämpar mot mig, i förkortad form, endast för att ge er en överblick över hela det bedrägeri som dessa bolag begår. All övrig detaljerad information är utförligt beskriven i bilagorna till brottsanmälningarna och klagomålen till Europeiska kommissionen, vilka bifogas denna talan i PDF-format och är undertecknade för hand med fysisk underskrift samt med den osynliga QES-underskriften, inbegripet denna talan. Jag uppmanar även domstolen i Landshut att förelägga de svarande bolagen att upphöra med detta bedrägeri av de ovan angivna olagliga skälen för dess tillämpning och att förplikta dem att betala min ersättning genom betalningsföreläggande. Bolaget Deutsche Telekom AG bestjäl varje dag en nation på 84 552 242 invånare, som ligger i framkant av den tekniska utvecklingen, och detta mitt på ljusa dagen i form av kränkning av de mänskliga rättigheterna — vilket inte syns så lätt, inbegripet er och er familj, herr domare/fru domare. [Detta dokument är undertecknat med QES] Med vänlig hälsning, i Kumhausen, 2.10.2024 Peter Ferenc ........................ medborgare i Europeiska unionen</p>"}]}};

const params = new URLSearchParams(location.search);
let active = params.get("lang") || "sk";
if(!CONTENT[active]) active = "sk";

function renderFlags(){
  const wrap = document.getElementById("flags");
  wrap.innerHTML = "";
  LANGS.forEach(l=>{
    const b = document.createElement("button");
    b.className = "flag-btn" + (l.code===active ? " active":"");
    b.innerHTML = `<span>${l.flag}</span>${l.label}`;
    b.onclick = ()=>{
      active = l.code;
      const u = new URL(location.href);
      u.searchParams.set("lang", active);
      history.replaceState(null, "", u);
      render();
    };
    wrap.appendChild(b);
  });
}

function render(){
  renderFlags();
  const stage = document.getElementById("stage");
  stage.scrollTop = 0;
  stage.innerHTML = "";
  const data = CONTENT[active];
  data.pages.forEach((p, i)=>{
    const div = document.createElement("div");
    div.className = "page";
    div.innerHTML = `
      <div class="banner">FIA FOX</div>
      <h2>${i===0 ? data.title : ""}</h2>
      ${p.body}
      <div class="pnum">${p.n}</div>
    `;
    stage.appendChild(div);
  });
}
render();
</script>
