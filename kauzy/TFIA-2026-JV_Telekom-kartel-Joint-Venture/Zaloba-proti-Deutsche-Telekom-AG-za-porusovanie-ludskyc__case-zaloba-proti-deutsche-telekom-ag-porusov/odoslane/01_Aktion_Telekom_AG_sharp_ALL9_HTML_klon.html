vanje ili koordinacija prodajnih cijena na tržištu, naziva se kartel i predstavlja povredu propisa o tržišnom natjecanju, dakle „nepoštene poslovne prakse i neopravdano bogaćenje“. Dakle, logično, Telekom ne raspolaže nikakvom pravnom osnovom iz čl. 6. st. 1. točke f) GDPR-a da mi kao potrošaču zbog mogućeg prekomjernog zaduženja odbije pružiti internetske usluge. Jer precijenjeni internet koji moram platiti 108 EUR daleko premašuje mogući gubitak pri neplaćanju mojeg posljednjeg računa od 40 EUR mjesečno za DSL priključak Telekoma. Iz ovoga logično proizlazi da se ja, zahvaljujući Telekomu i njegovoj prijevari nada mnom, svakog mjeseca sve više zadužujem, a ne Telekom. Da ne spominjem da za ispunjenje pravne osnove koja je Telekomu potrebna za primjenu automatizirane pojedinačne odluke zakon propisuje uvjete:</p>"}, {"n": 4, "body": "<p>Pravne obveze i legitimni interes dvije su različite pravne osnove na temelju kojih organizacije mogu obrađivati osobne podatke prema General Data Protection Regulation (GDPR) i Bundesdatenschutzgesetz (BDSG). Pravne obveze❖ Pravne obveze znače da organizacija mora obrađivati osobne podatke kako bi ispunila svoje zakonske obveze. To može uključivati: • Porezne obveze: obrada podataka u svrhu porezne prijave. • Računovodstvo: vođenje evidencije u skladu sa zakonom. • Sigurnost: osiguravanje usklađenosti sa sigurnosnim propisima i uredbama. Legitimni interes Legitimni interes fleksibilnija je pravna osnova koja omogućuje obradu osobnih podataka kada je to nužno za legitimne interese organizacije ili treće strane, pod uvjetom da ti interesi ne prevladavaju nad pravima i slobodama pojedinca. Primjeri uključuju: • Sprječavanje prijevara: obrada podataka radi utvrđivanja i sprječavanja prijevara. • Marketing: uporaba podataka u svrhu izravnog marketinga. • IT sigurnost: osiguravanje sigurnosti mreža i informacijskih sustava. Kao što je vidljivo, ni pod pravne obveze ni pod legitimni interes ne potpada pravo da društvo Schufa Holding AG manipulira, trguje ili na bilo koji način ustupa moje zakonom zaštićene osobne podatke trećim stranama poput Deutsche Telekom AG bez moje informirane privole za daljnje automatizirane pojedinačne odluke društva Telekom. Opis razloga za naknadu štete➢ Zbog zlouporabe mojih osobnih podataka koje je društvo Schufa pribavilo nezakonitim putem i koje ste ustupili trećim stranama poput telekomunikacijskih društava, bez ikakve moje privole za obradu mojih osobnih podataka radi automatizirane obrade i odluka telekomunikacijskih društava za pružanje internetskih usluga, oštetili ste moja prava na pristup internetskim uslugama u EU-u, što je dovelo do odbijanja pružanja osnovnih internetskih usluga od strane telekomunikacijskih društava. Pravila EU-a o otvorenom internetu➢ Pravila EU-a o otvorenom internetu daju vam kao korisniku pravo na pristup bilo kojem internetskom sadržaju i uslugama po vašem izboru i/ili njihovo distribuiranje. Vaš pružatelj internetskih usluga ne smije blokirati, usporavati ni diskriminirati bilo koji internetski sadržaj, aplikacije ili usluge, osim u 3 posebna slučaja: – radi ispunjenja zakonskih obveza, poput sudskog naloga za blokiranje određenog nezakonitog sadržaja; – radi borbe protiv virusa ili zlonamjernog softvera; – radi upravljanja iznimnim ili privremenim zagušenjem mreže, radi očuvanja sigurnosti i integriteta mreže. UREDBA (EU) 2015/2120 EUROPSKOG PARLAMENTA I VIJEĆA➢ (1) Cilj je ove Uredbe utvrditi zajednička pravila za osiguravanje jednakog i nediskriminirajućeg postupanja s prometom pri pružanju usluga pristupa internetu i povezanih prava krajnjih korisnika. Njezin je cilj zaštititi krajnje korisnike i istodobno jamčiti neprekidno funkcioniranje internetskog ekosustava kao pokretača inovacija.</p>"}, {"n": 5, "body": "<p>(6) Krajnji korisnici trebali bi imati pravo pristupiti informacijama i sadržaju te ih distribuirati, kao i pravo koristiti se aplikacijama i uslugama te ih pružati bez diskriminacije putem svoje usluge pristupa internetu. (7) Kako bi krajnji korisnici mogli ostvarivati svoja prava na pristup informacijama i sadržaju te njihovo distribuiranje, kao i na uporabu i pružanje aplikacija i usluga po vlastitom izboru, trebali bi moći s pružateljima usluga pristupa internetu dogovoriti tarife za određene količine podataka i brzine usluge pristupa internetu. Nacionalna regulatorna tijela i druga nadležna tijela trebala bi biti ovlaštena djelovati protiv sporazuma (kartela) ili (nepoštenih) poslovnih praksi koje zbog svojeg opsega dovode do situacija u kojima je izbor krajnjih korisnika u praksi znatno ograničen (moj slučaj). (8) Pri pružanju usluga pristupa internetu pružatelji tih usluga trebali bi jednako postupati sa svim prometom, bez diskriminacije, ograničenja ili uplitanja, neovisno o pošiljatelju ili primatelju, sadržaju, aplikaciji ili usluzi, ili terminalnoj opremi. Otvoren pristup internetu➢ Pružatelji internetskih usluga dužni su jednako postupati sa svim prometom kada pružaju usluge pristupa internetu: – bez diskriminacije, ograničenja ili uplitanja; i – neovisno o pošiljatelju i primatelju; – sadržaju kojemu se pristupa ili koji se distribuira; ili korištenim aplikacijama ili uslugama. Pružatelji mogu primjenjivati razumne mjere upravljanja prometom, koje pak moraju biti transparentne, nediskriminirajuće, razmjerne i ne smiju se temeljiti na komercijalnim razlozima. Iz tih razloga dugoročno nisam mogao koristiti internetske usluge za: • Pronalaženje prilika za zapošljavanje — u današnje digitalno doba pristup internetu često je nužan za traženje posla i prijavu na radna mjesta, što je danas ključno za profesionalni razvoj osobe u društvu. • Komunikaciju s tijelima — mnoge državne usluge i komunikacija sada se odvijaju putem interneta, što znači da smo bez pristupa internetu u nepovoljnom položaju. • Poduzetničke aktivnosti — za poduzetnike je pristup internetu ključan za vođenje poslovanja, marketing i komunikaciju s klijentima. • Učenje engleskog jezika — obrazovanje i osobni razvoj, uključujući učenje jezika, izravno ovise o internetskim izvorima i tečajevima. Internet mi je ključan za učenje engleskog jer mi pruža trenutačnu povratnu informaciju te audio i video snimke za učenje izgovora u kombinaciji s učenjem gramatike. Ove točke jasno pokazuju kako se pristup internetu može smatrati temeljnom potrebom i temeljnim pravom koje pojedincima omogućuje potpuno sudjelovanje u društvu i gospodarstvu. Društva Schufa i Telekom zlouporabila su moje osobne podatke kako bi mi na podao i podmukao način onemogućila pristup internetskim uslugama telekomunikacijskih društava, što je dovelo do ograničenja mojeg pristupa internetskim uslugama — ozbiljne povrede mojih prava na slobodan pristup internetu. U vezi s povredom mojih ljudskih prava i sloboda trpio sam emocionalno i proživljavao negativne emocije, čime sam mentalno i duševno patio. Proživljavao sam tjeskobu, frustraciju, depresiju i nisam se mogao ni na što usredotočiti, što mi je vezalo ruke. Nisam mogao koristiti internetske usluge prema svojim očekivanjima i potrebama te sam uslijed toga proživljavao negativne emocije, duševnu patnju i stres, zbog čega sam pod golemim pritiskom.</p>"}, {"n": 6, "body": "<p>Društvo Schufa Holding AG nezakonito obrađuje, prikuplja, manipulira i trguje mojim osobnim podacima bez moje privole, što se smatra povredom Zakona o zaštiti osobnih podataka (DSGVO), GDPR-a, a takvo se nezakonito ponašanje može smatrati kaznenim djelom i dovesti do kaznenopravnih posljedica. Aktivnosti društva Schufa Holding AG mogu se shvatiti i kao organizirane u suradnji s ovršiteljima, bankama i telekomunikacijskim društvima kao KARTEL, s ciljem stvaranja monopola na tržištu i vršenja pritiska na dužnike da podmire svoje obveze. Takvo se ponašanje može smatrati i iznudom dužnika — što su kaznena djela poput iznude, kartelnih sporazuma ili zlouporabe vladajućeg položaja na tržištu. Ako ne platim svoje dugove, neću dobiti internet. Što je također u oštroj suprotnosti s dobrim običajima. Važno je napomenuti da GDPR i drugi propisi o zaštiti podataka utvrđuju jasna pravila o obradi osobnih podataka, uključujući to da ispitanici moraju biti informirani o tome kako i zašto se njihovi podaci obrađuju te moraju imati mogućnost prigovora na tu obradu; bez njihove informirane privole podaci se ni u kojem slučaju ne smiju koristiti, a pogotovo ne u svrhu automatizirane pojedinačne odluke. DIREKTIVA 2014/104/EU EUROPSKOG PARLAMENTA I VIJEĆA od 26. studenoga 2014. o određenim pravilima kojima se uređuju postupci za naknadu štete prema nacionalnom pravu za povrede odredaba prava tržišnog natjecanja država članica i Europske unije (4) Pravo na naknadu štete prouzročene povredama prava tržišnog natjecanja Unije i nacionalnog prava, koje proizlazi iz prava Unije, zahtijeva da sve države članice imaju postupovna pravila koja osiguravaju djelotvorno ostvarivanje tog prava. POGLAVLJE V. — Utvrđivanje visine štete — Članak 17. 1. Države članice osiguravaju da teret dokazivanja i zahtjevi u pogledu dokazivanja potrebni za utvrđivanje visine štete ne čine ostvarivanje prava na naknadu štete praktički nemogućim ili pretjerano teškim. Države članice osiguravaju da nacionalni sudovi imaju ovlast procijeniti visinu štete u skladu s nacionalnim postupcima ako je utvrđeno da je tužitelj pretrpio štetu, ali je na temelju raspoloživih dokaza praktički nemoguće ili pretjerano teško precizno utvrditi visinu prouzročene štete. (11) U nedostatku propisa Unije, postupci za naknadu štete uređeni su nacionalnim pravilima i postupcima država članica. Prema sudskoj praksi Suda Europske unije (dalje: „Sud“), svatko ima pravo zahtijevati naknadu pretrpljene štete ako postoji uzročna veza između štete i povrede propisa o tržišnom natjecanju. (13) Pravo na naknadu štete priznaje se svim fizičkim ili pravnim osobama — potrošačima, poduzećima ili tijelima javne vlasti — neovisno o postojanju izravnog ugovornog odnosa s poduzećem koje je počinilo povredu i neovisno o tome je li tijelo za tržišno natjecanje prethodno utvrdilo povredu. 8. Vrijednosti EU-a Prioriteti Europske unije za razdoblje 2024. – 2029. Slobodna i demokratska Europa ▪ promicanje europskih vrijednosti unutar EU-a; ▪ poštovanje vrijednosti EU-a na globalnoj razini. Snažna i sigurna Europa ▪ osiguravanje usklađenog i utjecajnog vanjskog djelovanja; ▪ jačanje sigurnosti i obrane EU-a te zaštita građana EU-a; ▪ priprema za veću i snažniju Uniju; ▪ promicanje sveobuhvatnog pristupa migracijama i upravljanju granicama.</p>"}, {"n": 7, "body": "<p>Prosperitetna i konkurentna Europa ▪ jačanje konkurentnosti EU-a; ▪ uspješna provedba zelene i digitalne tranzicije; ▪ podupiranje okruženja pogodnog za inovacije i poduzetništvo; ▪ zajednički napredak. 1. Kako nam Unija osigurava zaštitu građana ako najjače države poput Njemačke krše ljudska prava, pljačkaju svoje građane, a lažu nam kako nas štite? 2. Kako nam Unija namjerava ojačati konkurentnost kada prijevarni mega kartel Schufa-Telekom pod tepih želi pomesti i sama predsjednica EK Ursula von der Leyen, kada je kartel suprotnost konkurentnosti? Agencija Europske unije za temeljna prava (FRA) Agencija EU-a za temeljna prava (FRA) pruža neovisno, na dokazima utemeljeno savjetovanje europskim i nacionalnim donositeljima politika, čime pridonosi tomu da rasprave, politike i propisi o temeljnim pravima počivaju na kritičnoj masi podataka i budu ciljani. Zadaće Agencija savjetuje institucije EU-a i vlade o temeljnim pravima, ponajprije u sljedećim područjima: ▪ rasizam i ksenofobija; ▪ diskriminacija; ▪ pristup pravosuđu; ▪ zaštita podataka; ▪ prava žrtava; ▪ prava djece. Svrha je Agencije pridonijeti djelotvornijem promicanju i zaštiti temeljnih prava u cijelom EU-u. U tu svrhu savjetuje se i surađuje sa svojim partnerima pri: ▪ prikupljanju i analizi informacija i podataka putem sociopravnih istraživanja; ▪ pružanju pomoći i stručnog savjetovanja; ▪ komunikaciji i podizanju svijesti o pravima. Čemu i komu služe te agencije kada Europska komisija radi što hoće, a povredu ljudskih prava i povredu zakona o zaštiti zaštićenih osobnih podataka potrošača ignorira poput predsjednice EK Ursule von der Leyen? Ovdje je njezina jasna namjera da ovu prijevaru pomete pod tepih, budući da je s Njemačkom u suglasju s obzirom na svoje podrijetlo — dakle postoji sukob interesa! Zar ih tako (FRA) uče komunicirati, da von der Leyen odbija komunicirati sa mnom? EU treba biti konkurentan, a ne stvarati monopole! Kao dokaz prilažem e-poštu upućenu gđi von der Leyen. 17. Prijedlog odluke Zahtjev: U skladu sa zakonima i propisima došlo je do povrede mojih prava te stoga tražim naknadu štete. Prema članku 82. GDPR-a imam pravo na naknadu štete prouzročene nezakonitom obradom mojih osobnih podataka. Zahtijevam da mi se isplati naknada za izgubljeno vrijeme uloženo u otkrivanje ove prijevare, za psihičku štetu, za doživotnu traumu i krađe koje su tuženi počinitelji prijevare počinili i još uvijek čine nada</p>"}, {"n": 8, "body": "<p>mnom i nad masama njemačkih građana — uključujući vas, gospodine suče — nezakonitim nepružanjem osnovnog internetskog priključka i prekomjernom cijenom pruženih usluga zbog postojećeg kartela među telekomunikacijskim društvima. Kartel dovodi do visokih cijena zbog nedostatka tržišnog natjecanja. Nadalje zahtijevam pisanu ispriku dopisom mojoj osobi za traumu koju sam već nekoliko godina prisiljen podnositi. 18. Zaključak Poštovani sude, u ovom dokumentu (Tužbi) opisujem činjenično stanje prijevare i krađe koju su nada mnom primijenila i još uvijek primjenjuju gore navedena društva, u skraćenom obliku, samo kako bih vas uveo u sliku cjelokupne prijevare koju ta društva čine. Sve ostale detaljne informacije opširno su izložene u prilozima Kaznenih prijava i Pritužbi Europskoj komisiji, koje su prilog ovoj tužbi u PDF formatu i potpisane su vlastoručno fizičkim potpisom te nevidljivim QES potpisom, uključujući i ovu tužbu. Također pozivam sud u Landshutu da naloži tuženim društvima da prekinu ovu prijevaru iz gore navedenih nezakonitih razloga njezine primjene i da ih obveže da mi isplate naknadu platnim nalogom. Društvo Deutsche Telekom AG svakodnevno pljačka naciju od 84 552 242 stanovnika, koja je na vrhu tehnološkog napretka, i to usred bijela dana u obliku povrede ljudskih prava — što se tako lako ne vidi, uključujući vas i vašu obitelj, gospodine/gospođo suče. [Ovaj je dokument potpisan QES-om] S poštovanjem, u Kumhausenu, 2.10.2024. Peter Ferenc ........................ građanin Europske unije</p>"}]}, "pl": {"title": "Pozew przeciwko Deutsche Telekom AG i Schufa Holding AG", "pages": [{"n": 1, "body": "<p>„Powód” Peter Ferenc Rammelkam 2, Kumhausen Deutschland +49 157 317 33332 info@foxprof.club Amtsgericht Landshut Maximilianstraße 22 84028 Landshut Deutschland w Kumhausen, 2.10.2024 POZEW 4. „Pozwani” • Deutsche Telekom AG, Friedrich-Ebert-Allee 140, 53113 Bonn, Niemcy. Numer rejestrowy (rejestr handlowy): HRB 6794 (Sąd Rejonowy w Bonn); • oraz • Schufa Holding AG, Kormoranweg 5, 65201 Wiesbaden, Niemcy. Numer rejestrowy (rejestr handlowy): niedostępny publicznie; numer identyfikacji podatkowej: DE87ZZZ00000239351. 5. „Przedmiot pozwu” Pozew dotyczy naruszenia RODO i praw człowieka przez spółkę Deutsche Telekom AG. W związku z tym pozywam wyżej wymienione spółki o naprawienie szkody wyrządzonej oszukańczym działaniem wobec mojej osoby i wnoszę o zapłatę 500 000 EUR od każdej z osobna, aby sąd zobowiązał każdą z nich do zapłaty wskazanej kwoty na mój rachunek w Slovenská sporiteľňa: IBAN: SK59 0900 0000 0052 0995 7308 BIC: GIBASKBX. 6. „Twierdzenia faktyczne” Opis zdarzenia: Przy rozpatrywaniu mojego wniosku o stałe łącze internetowe w lipcu, w dokładnie nieustalonym dniu 2022 roku, spółka Deutsche Telekom AG (dalej: Telekom) bezprawnie przetworzyła — i nadal przetwarza — moje dane osobowe w formie zautomatyzowanego przetwarzania indywidualnego (decyzji), którego podstawą jest wykorzystanie oszukańczej sztuczki oszukańczej agencji Schufa dotyczącej „BONITÄT” (zdolności kredytowej) konsumenta, bez jego świadomej zgody (konsumenta). Naruszone zostało w ten sposób moje podstawowe prawo unijne — prawo dostępu do internetu za pośrednictwem dostawcy Deutsche Telekom AG. Rząd, który kryje to megaoszustwo kartelowe, nie tylko</p>"}, {"n": 2, "body": "<p>pozbawia mnie łącza internetowego, naruszając moje podstawowe prawa człowieka — prawo dostępu do internetu — lecz zmusił mnie również do kupowania danych internetowych za 108 EUR miesięcznie poprzez kartę 5G SIM prepaid Telekomu, na co również mam dowody wymienione w Skardze do Komisji Europejskiej, która jest załącznikiem do niniejszego pozwu. Nieograniczone dane są dla mnie życiowo ważne, ponieważ muszę codziennie uczyć się języka angielskiego, którego potrzebuję do dalszego rozwoju zawodowego. Dowody: Szczegółowe dowody znajdują się w załącznikach do niniejszego pozwu w formacie PDF, które muszą zostać przestudiowane przez konkretnie wyznaczonego sędziego. Oto lista plików PDF: – 10. Strafrechtliche Mitteilung_Telekom and Schufa_sharp_Deutsch_fy.pdf – 11. Strafrechtliche Mitteilung_Telekom_Altstadt_Angestellter 1_with_QES.pdf – 12. Strafrechtliche Mitteilung über GP Peter Frank_with_signature_QES.PDF – 13. CS Complaint form request_0_koncept_ostrý_nahlásenie EU komisii podvod_with_QES.pdf – 14. Anzeige über Schindler_unterschrift_signed_with_QES.pdf – 15. Benachrichtigung der Telekom Mitarbeitern Telekom 94-95 Altstadt_with_QES.pdf 16. „Podstawy prawne” Naruszenie prawa: Chodzi przede wszystkim o naruszenie prawa chroniącego moje chronione dane osobowe konsumenta oraz usługi powszechnej dostępu do internetu bez ograniczeń i dyskryminacji — § 78 TKG. Telekommunikationsgesetz (TKG), § 78 (usługa powszechna): przepis ten stanowi, że dostawcy publicznych usług telekomunikacyjnych muszą zapewnić wszystkim użytkownikom końcowym dostęp do dostępnych i wysokiej jakości usług łączności elektronicznej, w tym podstawowego dostępu do internetu. Dostawcy nie mogą dyskryminować żadnego użytkownika i muszą zapewnić świadczenie usług po rozsądnej cenie. A cena 108 EUR miesięcznie za jakość 20 Mbit/s prędkości transmisji i niestabilne połączenie jest nie do przyjęcia i wykracza poza wszelkie granice tolerancji. Ogólnie rzecz biorąc, nikt nie może ograniczyć konsumenta w jego prawie dostępu do internetu, ponieważ jest to jego podstawowe prawo i wolność, które przeważa nad jakimikolwiek „uzasadnionymi” interesami dostawcy! Osoba, której dane dotyczą, ma prawo, by nie podlegać decyzji opierającej się wyłącznie na zautomatyzowanym przetwarzaniu indywidualnym (podejmowaniu decyzji) danych, w tym profilowaniu, wywołującej wobec niej skutki prawne lub w podobny sposób istotnie (negatywnie) na nią wpływającej (RODO)! Jeżeli przetwarzanie opiera się na zgodzie, administrator musi być w stanie wykazać, że osoba, której dane dotyczą, wyraziła zgodę na przetwarzanie swoich chronionych danych osobowych. A to również w ogóle nie jest przestrzegane. Zatem gdyby Telekom przy wniosku konsumenta o łącze internetowe chciał zastosować zautomatyzowaną decyzję indywidualną, jest zobowiązany zwrócić się do konsumenta o jego świadomą zgodę! Zgodnie z artykułem 6 RODO spółka Deutsche Telekom AG naruszyła moje prawa do ochrony danych osobowych. RODO przyznaje jednostkom prawo do bycia poinformowanym o istnieniu zautomatyzowanej decyzji indywidualnej, jej logice i konsekwencjach. Telekom nie dał mi tej możliwości, nie daje jej i samowolnie stosuje reżim bezprawnej zautomatyzowanej decyzji indywidualnej przy rozpatrywaniu wniosku o łącze internetowe (usługi), gdyż nie daje mi żadnej możliwości wyrażenia mojego sprzeciwu wobec</p>"}, {"n": 3, "body": "<p>zastosowania decyzji zautomatyzowanej, ponieważ nie informuje mnie nawet o możliwych konsekwencjach jej zastosowania. Mojej świadomej zgody nie uzyskał i zachowuje się, jakby dla niego prawa w ogóle nie istniały! I wreszcie, co nie mniej ważne, chodzi o ustawę o ochronie danych osobowych konsumenta, którą spółki te naruszają w ten sposób, że informację o niewypłacalności od komorników spółka Schufa Holding AG sprzedaje (dla korzyści finansowej) do przetwarzania spółkom telekomunikacyjnym w formie elektronicznej przez internet w celu przetworzenia zautomatyzowanej decyzji indywidualnej w postaci rzekomej (oszukańczej) zdolności kredytowej konsumenta — wnioskodawcy o dostęp do internetu, i to bez świadomej zgody konsumenta. Po co zatem jest ustawa o ochronie danych osobowych? Telekom podjął zautomatyzowaną decyzję indywidualną, na podstawie której odmówił mi świadczenia usług internetowych, w wyniku czego musiałem kupić router 5G ZTE 5001 i kartę 5G SIM w celu odbioru sygnału internetowego i połączenia z usługą „internet”. Cena urządzenia wynosiła około 300 EUR. Cena karty SIM na 28 dni wynosi 100 EUR, więc moje miesięczne koszty 108 EUR na obsługę tego urządzenia są wyższe o: 108 EUR − 40 EUR = 68 EUR! Są to dla mnie znaczne negatywne konsekwencje, a więc i koszty! Nie wspominając o tym, że wartość łącza internetowego przez DSL jest zawyżona o 170 %. Realna cena nie powinna przekraczać 20 EUR miesięcznie, a nie 40–45 EUR z powodu kartelu! Gdyby internet kosztował tyle, ile powinien, do 20 EUR, byłoby to zawyżone o 440 %. A to również oznacza, że jestem dyskryminowany! Z tego jasno wynika, że Telekom ciągnie za krótszy koniec i że okradany jest przez niego każdy obywatel Republiki Federalnej Niemiec. I jak za sprawą cudu, nagle można zapłacić także bankiem słowackim przelewem zautomatyzowanym. To są cuda, gdy trzeba zapłacić za zawyżony o ponad 440 % internet z powodu oszustwa kartelowego. Bank niemiecki nie jest już warunkiem przy wniosku o łącze internetowe u Telekomu! Warunek ten po prostu wyparował po drodze! Porozumienie kartelowe, czyli uzgodnione działanie między dwoma lub więcej konkurentami w celu koordynacji ich zachowań konkurencyjnych na rynku lub wpływania na istotne parametry konkurencji, poprzez praktyki takie jak m.in. ustalanie lub koordynacja cen sprzedaży na rynku, nazywa się kartelem i stanowi naruszenie przepisów o ochronie konkurencji, czyli „nieuczciwe praktyki handlowe i bezpodstawne wzbogacenie”.</p>"}, {"n": 4, "body": "<p>Zatem logicznie Telekom nie dysponuje żadną podstawą prawną z art. 6 ust. 1 lit. f) RODO, aby z powodu możliwego nadmiernego zadłużenia odmówić mi jako konsumentowi świadczenia usług internetowych. Ponieważ zawyżony internet, który muszę zapłacić 108 EUR, znacznie przewyższa możliwą stratę przy niezapłaceniu mojej ostatniej kwoty rozliczeniowej 40 EUR miesięcznie za łącze DSL Telekomu. Z tego logicznie wynika, że to ja, dzięki Telekomowi i jego oszustwu wobec mnie, zadłużam się co miesiąc jeszcze bardziej, a nie Telekom. Nie wspominając o tym, że dla spełnienia podstawy prawnej, której Telekom potrzebuje do zastosowania zautomatyzowanej decyzji indywidualnej, ustawa określa warunki: Obowiązki prawne i uzasadniony interes to dwie różne podstawy prawne, na podstawie których organizacje mogą przetwarzać dane osobowe zgodnie z General Data Protection Regulation (RODO) i Bundesdatenschutzgesetz (BDSG). Obowiązki prawne❖ Obowiązki prawne oznaczają, że organizacja musi przetwarzać dane osobowe, aby wypełnić swoje obowiązki ustawowe. Może to obejmować: • Obowiązki podatkowe: przetwarzanie danych na potrzeby zeznania podatkowego. • Rachunkowość: prowadzenie ewidencji zgodnie z ustawą. • Bezpieczeństwo: zapewnienie zgodności z przepisami i regulacjami dotyczącymi bezpieczeństwa. Uzasadniony interes Uzasadniony interes to bardziej elastyczna podstawa prawna, która umożliwia przetwarzanie danych osobowych, jeżeli jest to niezbędne dla uzasadnionych interesów organizacji lub strony trzeciej, o ile interesy te nie przeważają nad prawami i wolnościami jednostki. Przykłady obejmują: • Zapobieganie oszustwom: przetwarzanie danych w celu wykrywania i zapobiegania oszustwom. • Marketing: wykorzystanie danych do celów marketingu bezpośredniego. • Bezpieczeństwo IT: zapewnienie bezpieczeństwa sieci i systemów informatycznych. Jak widać, ani pod obowiązki prawne, ani pod uzasadniony interes nie podpada prawo do manipulowania, obrotu ani jakiegokolwiek udostępniania przez spółkę Schufa Holding AG moich chronionych prawem danych osobowych stronom trzecim, takim jak Deutsche Telekom AG, bez mojej świadomej zgody, w celu dalszych zautomatyzowanych decyzji indywidualnych spółki Telekom. Opis podstaw odszkodowania➢ Z powodu nadużycia moich danych osobowych uzyskanych przez spółkę Schufa w sposób bezprawny, które udostępniliście stronom trzecim, takim jak spółki telekomunikacyjne, bez jakiejkolwiek mojej zgody na przetwarzanie moich danych osobowych w celu zautomatyzowanego przetwarzania i decyzji spółek telekomunikacyjnych dla świadczenia usług internetowych, naruszyliście moje prawa dostępu do usług internetowych w UE, co doprowadziło do odmowy świadczenia podstawowych usług internetowych przez spółki telekomunikacyjne. Przepisy UE o otwartym internecie➢ Przepisy UE o otwartym internecie dają wam jako użytkownikowi prawo dostępu do dowolnych treści i usług online według waszego wyboru i/lub ich rozpowszechniania. Wasz dostawca internetu nie może blokować, spowalniać ani dyskryminować żadnych treści, aplikacji ani usług online, z wyjątkiem 3 szczególnych przypadków:</p>"}, {"n": 5, "body": "<p>– w celu spełnienia obowiązków ustawowych, jak nakaz sądowy zablokowania określonej nielegalnej treści; – w celu zwalczania wirusów lub złośliwego oprogramowania; – w celu zarządzania wyjątkowym lub tymczasowym przeciążeniem sieci, dla zachowania bezpieczeństwa i integralności sieci. ROZPORZĄDZENIE (UE) 2015/2120 PARLAMENTU EUROPEJSKIEGO I RADY➢ (1) Celem niniejszego rozporządzenia jest ustanowienie wspólnych zasad w celu zapewnienia równego i niedyskryminacyjnego traktowania ruchu przy świadczeniu usług dostępu do internetu oraz związanych z tym praw użytkowników końcowych. Jego celem jest ochrona użytkowników końcowych i jednoczesne zagwarantowanie nieprzerwanego funkcjonowania ekosystemu internetu jako motoru innowacji. (6) Użytkownicy końcowi powinni mieć prawo dostępu do informacji i treści oraz ich rozpowszechniania, a także korzystania z aplikacji i usług oraz ich udostępniania bez dyskryminacji za pośrednictwem swojej usługi dostępu do internetu. (7) Aby użytkownicy końcowi mogli wykonywać swoje prawa dostępu do informacji i treści oraz ich rozpowszechniania, jak również korzystania i udostępniania aplikacji oraz usług według własnego wyboru, powinni móc uzgadniać z dostawcami usług dostępu do internetu taryfy za określone ilości danych i prędkości usługi dostępu do internetu. Krajowe organy regulacyjne i inne właściwe organy powinny mieć uprawnienia do interweniowania przeciwko porozumieniom (kartelom) lub (nieuczciwym) praktykom handlowym, które ze względu na swój zakres prowadzą do sytuacji, w których wybór użytkowników końcowych jest w praktyce istotnie ograniczony (mój przypadek). (8) Przy świadczeniu usług dostępu do internetu dostawcy tych usług powinni traktować cały ruch jednakowo, bez dyskryminacji, ograniczeń czy ingerencji, niezależnie od nadawcy lub odbiorcy, treści, aplikacji lub usługi, czy urządzenia końcowego. Otwarty dostęp do internetu➢ Dostawcy internetu są zobowiązani traktować cały ruch jednakowo, gdy świadczą usługi dostępu do internetu: – bez dyskryminacji, ograniczeń czy ingerencji; oraz – niezależnie od nadawcy i odbiorcy; – treści, do której się uzyskuje dostęp lub którą się rozpowszechnia; lub wykorzystywanych aplikacji lub usług. Dostawcy mogą stosować rozsądne środki zarządzania ruchem, które jednak muszą być przejrzyste, niedyskryminacyjne, proporcjonalne i nie mogą opierać się na względach komercyjnych. Z tych powodów przez dłuższy czas nie mogłem korzystać z usług internetowych do: • Zdobywania możliwości zatrudnienia — w dzisiejszej erze cyfrowej dostęp do internetu jest często niezbędny do poszukiwania pracy i aplikowania na stanowiska, co jest dziś kluczowe dla rozwoju zawodowego osoby w społeczeństwie. • Komunikacji z urzędami — wiele usług publicznych i komunikacji odbywa się teraz online, co oznacza, że bez dostępu do internetu jesteśmy w niekorzystnej sytuacji. • Działalności gospodarczej — dla przedsiębiorców dostęp do internetu jest kluczowy dla prowadzenia działalności, marketingu i komunikacji z klientami.</p>"}, {"n": 6, "body": "<p>• Nauki języka angielskiego — edukacja i rozwój osobisty, w tym nauka języków, są bezpośrednio zależne od zasobów i kursów online. Internet jest dla mnie kluczowy do nauki angielskiego, ponieważ zapewnia mi natychmiastową informację zwrotną oraz nagrania audio i wideo do nauki wymowy w połączeniu z nauką gramatyki. Punkty te jasno pokazują, jak dostęp do internetu można uznać za podstawową potrzebę i podstawowe prawo, które umożliwia jednostkom pełne uczestnictwo w społeczeństwie i gospodarce. Spółki Schufa i Telekom nadużyły moich danych osobowych, aby w podły i podstępny sposób uniemożliwić mi dostęp do usług internetowych spółek telekomunikacyjnych, co doprowadziło do ograniczenia mojego dostępu do usług internetowych — poważnego naruszenia moich praw do swobodnego dostępu do internetu. W związku z naruszeniem moich praw i wolności człowieka cierpiałem emocjonalnie i doświadczałem negatywnych emocji, przez co cierpiałem psychicznie i duchowo. Doświadczałem lęku, frustracji, depresji i nie potrafiłem się na niczym skoncentrować, co wiązało mi ręce. Nie mogłem korzystać z usług internetowych zgodnie z moimi oczekiwaniami i potrzebami, w wyniku czego doświadczałem negatywnych emocji, cierpienia psychicznego i stresu, przez co jestem pod ogromną presją. Spółka Schufa Holding AG bezprawnie przetwarza, gromadzi, manipuluje i handluje moimi danymi osobowymi bez mojej zgody, co uznaje się za naruszenie ustawy o ochronie danych osobowych (DSGVO), RODO, a takie bezprawne zachowanie może zostać uznane za czyn zabroniony i prowadzić do konsekwencji karnych. Działalność spółki Schufa Holding AG można rozumieć również jako zorganizowaną we współpracy z komornikami, bankami i spółkami telekomunikacyjnymi jako KARTEL, w celu stworzenia monopolu na rynku i wywierania presji na dłużników, by spłacali swoje zobowiązania. Takie zachowanie można też uznać za wymuszenie wobec dłużników — co stanowi czyny zabronione, takie jak wymuszenie, porozumienia kartelowe lub nadużycie pozycji dominującej na rynku. Jeśli nie spłacę długów, nie dostanę internetu. Co jest również w rażącej sprzeczności z dobrymi obyczajami. Ważne jest zauważyć, że RODO i inne przepisy o ochronie danych ustanawiają jasne zasady dotyczące przetwarzania danych osobowych, w tym to, że osoby, których dane dotyczą, muszą być informowane o tym, jak i dlaczego ich dane są przetwarzane, oraz muszą mieć możliwość sprzeciwu wobec tego przetwarzania; bez ich świadomej zgody dane w żadnym wypadku nie mogą być wykorzystywane, a już zwłaszcza nie do celów zautomatyzowanej decyzji indywidualnej. DYREKTYWA PARLAMENTU EUROPEJSKIEGO I RADY 2014/104/UE z dnia 26 listopada 2014 r. w sprawie niektórych przepisów regulujących dochodzenie roszczeń odszkodowawczych z tytułu naruszenia prawa konkurencji państw członkowskich i Unii Europejskiej (4) Wynikające z prawa Unii prawo do naprawienia szkody spowodowanej naruszeniami unijnego i krajowego prawa konkurencji wymaga, aby wszystkie państwa członkowskie posiadały przepisy proceduralne zapewniające skuteczne wykonywanie tego prawa. ROZDZIAŁ V — Ustalenie wysokości szkody — Artykuł 17 1. Państwa członkowskie zapewniają, aby ciężar dowodu i wymogi dowodowe niezbędne do ustalenia wysokości szkody nie czyniły wykonywania prawa do odszkodowania praktycznie niemożliwym lub nadmiernie utrudnionym. Państwa członkowskie zapewniają, aby sądy krajowe były uprawnione do oszacowania wysokości szkody zgodnie z procedurami krajowymi, jeżeli ustalono, że powód poniósł szkodę, lecz na podstawie dostępnych dowodów praktycznie niemożliwe lub nadmiernie utrudnione jest dokładne ustalenie wysokości poniesionej szkody.</p>"}, {"n": 7, "body": "<p>(11) W braku przepisów Unii roszczenia odszkodowawcze są regulowane krajowymi zasadami i procedurami państw członkowskich. Zgodnie z orzecznictwem Trybunału Sprawiedliwości Unii Europejskiej (dalej: „Trybunał”) każdy ma prawo dochodzić naprawienia poniesionej szkody, jeżeli istnieje związek przyczynowy między szkodą a naruszeniem prawa konkurencji. (13) Prawo do naprawienia szkody przysługuje wszystkim osobom fizycznym lub prawnym — konsumentom, przedsiębiorstwom lub organom publicznym — niezależnie od istnienia bezpośredniego stosunku umownego z przedsiębiorstwem dopuszczającym się naruszenia oraz niezależnie od tego, czy naruszenie zostało wcześniej stwierdzone przez organ ochrony konkurencji. 8. Wartości UE Priorytety Unii Europejskiej na lata 2024 – 2029 Wolna i demokratyczna Europa ▪ promowanie wartości europejskich w ramach UE; ▪ przestrzeganie wartości UE na poziomie globalnym. Silna i bezpieczna Europa ▪ zapewnienie spójnego i wpływowego działania zewnętrznego; ▪ wzmocnienie bezpieczeństwa i obrony UE oraz ochrona obywateli UE; ▪ przygotowanie na większą i silniejszą Unię; ▪ promowanie kompleksowego podejścia do migracji i zarządzania granicami. Dostatnia i konkurencyjna Europa ▪ wzmocnienie konkurencyjności UE; ▪ skuteczne wdrożenie transformacji zielonej i cyfrowej; ▪ wspieranie środowiska sprzyjającego innowacjom i przedsiębiorczości; ▪ wspólny postęp. 1. Jak Unia zapewnia nam ochronę obywateli, jeżeli najsilniejsze państwa, jak Niemcy, naruszają prawa człowieka, okradają swoich obywateli, a kłamią nam, jak nas chronią? 2. Jak Unia zamierza wzmocnić naszą konkurencyjność, skoro oszukańczy megakartel Schufa-Telekom chce zamieść pod dywan sama przewodnicząca KE Ursula von der Leyen, skoro kartel jest przeciwieństwem konkurencyjności? Agencja Praw Podstawowych Unii Europejskiej (FRA) Agencja Praw Podstawowych UE (FRA) zapewnia niezależne, oparte na dowodach doradztwo europejskim i krajowym decydentom, przyczyniając się do tego, by dyskusje, polityki i przepisy dotyczące praw podstawowych opierały się na krytycznej masie danych i były ukierunkowane. Zadania Agencja doradza instytucjom UE i rządom w zakresie praw podstawowych, głównie w następujących obszarach: ▪ rasizm i ksenofobia; ▪ dyskryminacja; ▪ dostęp do wymiaru sprawiedliwości;</p>"}, {"n": 8, "body": "<p>▪ ochrona danych; ▪ prawa ofiar; ▪ prawa dziecka. Celem Agencji jest wspieranie skuteczniejszego promowania i ochrony praw podstawowych w całej UE. W tym celu konsultuje się i współpracuje ze swoimi partnerami w zakresie: ▪ gromadzenia i analizy informacji i danych za pomocą badań społeczno-prawnych; ▪ udzielania pomocy i fachowego doradztwa; ▪ komunikacji i podnoszenia świadomości praw. Czemu i komu służą te agencje, skoro Komisja Europejska robi, co chce, a naruszenie praw człowieka i naruszenie ustawy o ochronie chronionych danych osobowych konsumenta ignoruje, jak przewodnicząca KE Ursula von der Leyen? Jest tu jej wyraźny zamiar zamieść to oszustwo pod dywan, ponieważ jest z Niemcami w zgodzie ze względu na swoje pochodzenie — istnieje więc konflikt interesów! Czy tak ich (FRA) uczą komunikować, że von der Leyen odmawia komunikacji ze mną? UE ma być konkurencyjna, a nie tworzyć monopole! Jako dowód załączam e-mail adresowany do pani von der Leyen. 17. Wniosek o rozstrzygnięcie Żądanie: Zgodnie z ustawami i przepisami doszło do naruszenia moich praw, dlatego żądam naprawienia szkody. Zgodnie z artykułem 82 RODO przysługuje mi odszkodowanie za szkodę spowodowaną bezprawnym przetwarzaniem moich danych osobowych. Żądam wypłaty mi odszkodowania za czas poświęcony na wykrycie tego oszustwa, za szkodę psychiczną, za dożywotnią traumę i kradzieże, których pozwani sprawcy oszustwa dopuścili się i nadal dopuszczają wobec mnie oraz wobec mas obywateli niemieckich — w tym wobec pana, panie sędzio — poprzez bezprawne nieświadczenie podstawowego dostępu do internetu oraz nadmierną cenę świadczonych usług z powodu istniejącego kartelu między spółkami telekomunikacyjnymi. Kartel prowadzi do wysokich cen z powodu braku konkurencji. Ponadto żądam pisemnych przeprosin listem skierowanym do mojej osoby za traumę, którą od kilku lat jestem zmuszony znosić. 18. Zakończenie Szanowny Sądzie, w niniejszym dokumencie (Pozwie) opisuję stan faktyczny oszustwa i kradzieży, które wobec mnie zastosowały i nadal stosują wyżej wymienione spółki, w skróconej formie, jedynie po to, by wprowadzić Pana w obraz całego oszustwa, którego te spółki się dopuszczają. Wszystkie pozostałe szczegółowe informacje są obszernie opisane w załącznikach Zawiadomień o przestępstwie i Skarg do Komisji Europejskiej, które są załącznikiem do niniejszego pozwu w formacie PDF i są podpisane własnoręcznie podpisem fizycznym oraz niewidocznym podpisem QES, łącznie z niniejszym pozwem. Wzywam również sąd w Landshut, aby nakazał pozwanym spółkom zaprzestanie tego oszustwa z wyżej wymienionych bezprawnych powodów jego stosowania i zobowiązał je do zapłaty mojego odszkodowania nakazem zapłaty. Spółka Deutsche Telekom AG codziennie okrada 84 552 242-milionowy naród, który jest na szczycie postępu technologicznego, i to w biały dzień w formie naruszania praw człowieka — czego tak łatwo nie widać, w tym Pana i Pańskiej rodziny, Panie sędzio/Pani sędzio.</p>"}, {"n": 9, "body": "<p>[Niniejszy dokument jest podpisany podpisem QES] Z poważaniem, w Kumhausen, 2.10.2024 Peter Ferenc ........................ obywatel Unii Europejskiej</p>"}]}, "es": {"title": "Demanda contra Deutsche Telekom AG y Schufa Holding AG", "pages": [{"n": 1, "body": "<p>«Demandante» Peter Ferenc Rammelkam 2, Kumhausen Deutschland +49 157 317 33332 info@foxprof.club Amtsgericht Landshut Maximilianstraße 22 84028 Landshut Deutschland en Kumhausen, 2.10.2024 DEMANDA 4. «Demandadas» • Deutsche Telekom AG, Friedrich-Ebert-Allee 140, 53113 Bonn, Alemania. Número de registro (registro mercantil): HRB 6794 (Juzgado de Distrito de Bonn); • y • Schufa Holding AG, Kormoranweg 5, 65201 Wiesbaden, Alemania. Número de registro (registro mercantil): no accesible al público; número de identificación fiscal: DE87ZZZ00000239351. 5. «Objeto de la demanda» La demanda se refiere a la vulneración del RGPD y de los derechos humanos por parte de la sociedad Deutsche Telekom AG. Por ello demando a las sociedades arriba indicadas por la reparación del daño causado por su conducta fraudulenta hacia mi persona y solicito el pago de 500 000 EUR a cada una por separado, para que el tribunal condene a cada una de ellas a pagar la cantidad indicada en mi cuenta en Slovenská sporiteľňa: IBAN: SK59 0900 0000 0052 0995 7308 BIC: GIBASKBX. 6. «Alegaciones de hecho» Descripción del suceso: Al examinar mi solicitud de una conexión fija a internet en julio, en un día no determinado con exactitud de 2022, la sociedad Deutsche Telekom AG (en lo sucesivo: Telekom) trató —y sigue tratando— ilícitamente mis datos personales en forma de tratamiento individual automatizado (decisión), fundado en el uso del ardid fraudulento de la agencia fraudulenta Schufa relativo a la «BONITÄT» (solvencia) del consumidor, sin su consentimiento informado (del consumidor).</p>"}, {"n": 2, "body": "<p>Se vulnera así mi derecho fundamental de la Unión —el derecho de acceso a internet a través del proveedor Deutsche Telekom AG—. El gobierno, que encubre este mega fraude de cártel, no solo me priva de la conexión a internet, vulnerando mis derechos humanos fundamentales —el derecho de acceso a internet—, sino que además me obligó a comprar datos de internet por 108 EUR al mes mediante una SIM 5G de prepago de Telekom, de lo cual también tengo pruebas indicadas en la Reclamación a la Comisión Europea, que se adjunta a la presente demanda. Los datos ilimitados son para mí vitales, ya que necesito aprender inglés a diario, lengua que preciso para mi ulterior desarrollo profesional. Pruebas: Las pruebas detalladas se encuentran en los anexos de la presente demanda en formato PDF, que deben ser estudiadas por el juez concretamente asignado. He aquí la lista de archivos PDF: – 10. Strafrechtliche Mitteilung_Telekom and Schufa_sharp_Deutsch_fy.pdf – 11. Strafrechtliche Mitteilung_Telekom_Altstadt_Angestellter 1_with_QES.pdf – 12. Strafrechtliche Mitteilung über GP Peter Frank_with_signature_QES.PDF – 13. CS Complaint form request_0_koncept_ostrý_nahlásenie EU komisii podvod_with_QES.pdf – 14. Anzeige über Schindler_unterschrift_signed_with_QES.pdf – 15. Benachrichtigung der Telekom Mitarbeitern Telekom 94-95 Altstadt_with_QES.pdf 16. «Fundamentos de derecho» Vulneración de la ley: Se trata principalmente de la vulneración de la ley que protege mis datos personales protegidos de consumidor y del servicio universal de acceso a internet sin restricciones ni discriminación —§ 78 TKG—. Telekommunikationsgesetz (TKG), § 78 (servicio universal): este artículo establece que los proveedores de servicios públicos de telecomunicaciones deben garantizar que todos los usuarios finales tengan acceso a servicios de comunicaciones electrónicas disponibles y de calidad, incluido el acceso básico a internet. Los proveedores no pueden discriminar a ningún usuario y deben garantizar que los servicios se presten a un precio razonable. Y un precio de 108 EUR al mes por una calidad de 20 Mbit/s de velocidad de transmisión y una conexión inestable es inaceptable y está más allá de todo límite de tolerancia. En términos generales, nadie puede restringir al consumidor en su derecho de acceso a internet, pues es su derecho y su libertad fundamentales, que prevalecen sobre cualesquiera intereses «legítimos» del proveedor. El interesado tiene derecho a no ser objeto de una decisión basada únicamente en el tratamiento individual automatizado (la toma de decisiones) de datos, incluida la elaboración de perfiles, que produzca efectos jurídicos que le conciernan o le afecten de modo análogo significativamente (negativamente) (RGPD). Si el tratamiento se basa en el consentimiento, el responsable debe poder demostrar que el interesado consintió el tratamiento de sus datos personales protegidos. Y esto tampoco se respeta en absoluto. Así pues, si Telekom quisiera aplicar, ante la solicitud de conexión a internet del consumidor, una decisión individual automatizada, está obligada a solicitar al consumidor su consentimiento informado. Con arreglo al artículo 6 del RGPD, la sociedad Deutsche Telekom AG ha vulnerado mis derechos a la protección de datos personales. El RGPD reconoce a las personas el derecho a ser informadas de la existencia de una decisión individual automatizada, de su lógica y de sus consecuencias. Telekom no me ha ofrecido, no me ofrece esa posibilidad y aplica arbitrariamente el régimen ilícito de la decisión individual</p>"}, {"n": 3, "body": "<p>automatizada al examinar la solicitud de conexión a internet (servicios), sin ofrecerme posibilidad alguna de expresar mi desacuerdo con el uso de la decisión automatizada, pues ni siquiera me informa de las posibles consecuencias de su uso. Mi consentimiento informado no se obtuvo y se comporta como si para ella las leyes no existieran. Y, por último pero no menos importante, se trata de la ley de protección de datos personales del consumidor, que estas sociedades vulneran al vender la sociedad Schufa Holding AG la información sobre la insolvencia obtenida de los agentes ejecutores (a cambio de un beneficio económico) para su tratamiento a las empresas de telecomunicaciones en forma electrónica a través de internet, con el fin de tratar una decisión individual automatizada bajo la forma de una supuesta (fraudulenta) solvencia del consumidor — solicitante de acceso a internet—, y ello sin el consentimiento informado del consumidor. ¿Para qué sirve entonces la ley de protección de datos personales? Telekom adoptó una decisión individual automatizada sobre cuya base me denegó los servicios de internet, por lo que tuve que comprar un router 5G ZTE 5001 y una SIM 5G para recibir la señal de internet y conectarme al servicio «internet». El precio del dispositivo fue de unos 300 EUR. El precio de la SIM para 28 días es de 100 EUR, de modo que mis costes mensuales de 108 EUR por el funcionamiento de este dispositivo son superiores en: 108 EUR − 40 EUR = 68 EUR. Para mí son consecuencias negativas considerables y, por tanto, también costes. Por no hablar de que el valor de la conexión a internet por DSL está sobrevalorado en un 170 %. El precio real no debería superar los 20 EUR al mes, y no 40–45 EUR a causa del cártel. Si internet costara lo que debería, hasta 20 EUR, estaría sobrevalorado en un 440 %. Y ello también significa que soy discriminado. De esto se desprende con claridad que Telekom lleva las de perder y que cada ciudadano de la República Federal de Alemania es robado por ella. Y, como por arte de magia, de repente es posible pagar también con un banco eslovaco mediante transferencia automatizada. Son milagros, cuando hay que pagar un internet sobrevalorado en más de un 440 % a causa de un fraude de cártel. Un banco alemán ya no es un requisito para solicitar la conexión a internet en Telekom. Esa condición simplemente se evaporó por el camino. Un acuerdo de cártel, es decir, una actuación concertada entre dos o más competidores con el fin de coordinar su comportamiento competitivo en el mercado o de influir en los parámetros pertinentes de la competencia, mediante prácticas</p>"}, {"n": 4, "body": "<p>como, entre otras, la fijación o coordinación de los precios de venta en el mercado, se denomina cártel y constituye una infracción de las normas de competencia, es decir, «prácticas comerciales desleales y enriquecimiento injustificado». Así pues, lógicamente, Telekom no dispone de base jurídica alguna con arreglo al art. 6, apdo. 1, letra f) del RGPD para denegarme, como consumidor, la prestación de servicios de internet por un posible sobreendeudamiento. Pues el internet sobrevalorado que debo pagar, 108 EUR, supera con creces la posible pérdida por el impago de mi último importe de facturación de 40 EUR al mes por la conexión DSL de Telekom. De ello se desprende lógicamente que soy yo quien, gracias a Telekom y a su fraude contra mí, se endeuda cada mes aún más, y no Telekom. Por no hablar de que, para cumplir la base jurídica que Telekom necesita para aplicar la decisión individual automatizada, la ley fija condiciones: Las obligaciones legales y el interés legítimo son dos bases jurídicas distintas con arreglo a las cuales las organizaciones pueden tratar datos personales según el General Data Protection Regulation (RGPD) y el Bundesdatenschutzgesetz (BDSG). Obligaciones legales❖ Las obligaciones legales significan que una organización debe tratar datos personales para cumplir sus obligaciones legales. Ello puede comprender: • Obligaciones fiscales: tratamiento de datos a efectos de la declaración de impuestos. • Contabilidad: llevanza de registros conforme a la ley. • Seguridad: garantizar el cumplimiento de las prescripciones y reglamentos de seguridad. Interés legítimo El interés legítimo es una base jurídica más flexible que permite el tratamiento de datos personales cuando es necesario para los intereses legítimos de la organización o de un tercero, siempre que dichos intereses no prevalezcan sobre los derechos y libertades del individuo. Los ejemplos comprenden: • Prevención del fraude: tratamiento de datos para identificar y prevenir el fraude. • Marketing: uso de datos con fines de marketing directo. • Seguridad informática: garantizar la seguridad de las redes y los sistemas de información. Como se ve, ni bajo las obligaciones legales ni bajo el interés legítimo queda comprendido el derecho de la sociedad Schufa Holding AG a manipular, comerciar o facilitar de cualquier modo mis datos personales protegidos por la ley a terceros como Deutsche Telekom AG sin mi consentimiento informado, con vistas a ulteriores decisiones individuales automatizadas de la sociedad Telekom. Descripción de los motivos de la indemnización➢ A causa del uso indebido de mis datos personales obtenidos por la sociedad Schufa de modo ilícito y que ustedes facilitaron a terceros como las empresas de telecomunicaciones, sin consentimiento alguno mío al tratamiento de mis datos personales con vistas al tratamiento y a las decisiones automatizadas de las empresas de telecomunicaciones para la prestación de servicios de internet, han lesionado mis derechos de acceso a los servicios de internet en la UE, lo que condujo a la denegación de la prestación de servicios básicos de internet por parte de las empresas de telecomunicaciones. Normas de la UE sobre la internet abierta➢ Las normas de la UE sobre la internet abierta le confieren, como usuario, el derecho a acceder a cualesquiera contenidos y servicios en línea de su elección y/o a distribuirlos. Su proveedor de internet no puede</p>"}, {"n": 5, "body": "<p>bloquear, ralentizar ni discriminar ningún contenido, aplicación o servicio en línea, salvo en 3 casos particulares: – para cumplir obligaciones legales, como una orden judicial de bloqueo de un determinado contenido ilícito; – para combatir virus o programas maliciosos; – para gestionar una congestión excepcional o temporal de la red, a fin de preservar la seguridad y la integridad de la red. REGLAMENTO (UE) 2015/2120 DEL PARLAMENTO EUROPEO Y DEL CONSEJO➢ (1) El objetivo del presente Reglamento es establecer normas comunes para garantizar un trato equitativo y no discriminatorio del tráfico en la prestación de servicios de acceso a internet y los derechos conexos de los usuarios finales. Su finalidad es proteger a los usuarios finales y garantizar al mismo tiempo el funcionamiento ininterrumpido del ecosistema de internet como motor de innovación. (6) Los usuarios finales deben tener derecho a acceder a la información y a los contenidos y a distribuirlos, así como a utilizar y facilitar aplicaciones y servicios sin discriminación a través de su servicio de acceso a internet. (7) Para que los usuarios finales puedan ejercer sus derechos a acceder a la información y a los contenidos y a distribuirlos, así como a utilizar y facilitar aplicaciones y servicios de su elección, deben poder acordar con los proveedores de servicios de acceso a internet tarifas para volúmenes de datos y velocidades determinados del servicio de acceso a internet. Las autoridades nacionales de reglamentación y otras autoridades competentes deben estar facultadas para intervenir contra acuerdos (cárteles) o prácticas comerciales (desleales) que, por su alcance, conduzcan a situaciones en las que la elección de los usuarios finales quede en la práctica sustancialmente restringida (mi caso). (8) En la prestación de servicios de acceso a internet, los proveedores de dichos servicios deben tratar todo el tráfico de manera equitativa, sin discriminación, restricción ni interferencia, con independencia del emisor o del receptor, del contenido, de la aplicación o del servicio, o del equipo terminal. Acceso abierto a internet➢ Los proveedores de internet están obligados a tratar todo el tráfico de manera equitativa cuando prestan servicios de acceso a internet: – sin discriminación, restricción ni interferencia; y – con independencia del emisor y del receptor; – del contenido al que se accede o que se distribuye; o de las aplicaciones o servicios utilizados. Los proveedores pueden aplicar medidas razonables de gestión del tráfico, que, no obstante, deben ser transparentes, no discriminatorias, proporcionadas y no basarse en motivos comerciales. Por estas razones, durante mucho tiempo no he podido utilizar los servicios de internet para: • Obtener oportunidades de empleo — en la era digital actual, el acceso a internet es a menudo indispensable para buscar trabajo y presentarse a puestos, lo cual es hoy crucial para el desarrollo profesional de la persona en la sociedad. • Comunicarme con las autoridades — muchos servicios públicos y comunicaciones se realizan ahora en línea, lo que significa que sin acceso a internet estamos en desventaja.</p>"}, {"n": 6, "body": "<p>• Actividades empresariales — para los empresarios, el acceso a internet es crucial para la gestión del negocio, el marketing y la comunicación con los clientes. • Estudiar inglés — la educación y el desarrollo personal, incluido el estudio de idiomas, dependen directamente de recursos y cursos en línea. Internet es para mí crucial para aprender inglés, pues me proporciona una respuesta inmediata y grabaciones de audio y vídeo para aprender la pronunciación en combinación con el estudio de la gramática. Estos puntos muestran con claridad cómo el acceso a internet puede considerarse una necesidad fundamental y un derecho fundamental que permite a las personas participar plenamente en la sociedad y en la economía. Las sociedades Schufa y Telekom abusaron de mis datos personales para impedirme, de forma vil e insidiosa, el acceso a los servicios de internet de las empresas de telecomunicaciones, lo que condujo a la restricción de mi acceso a los servicios de internet —una grave vulneración de mis derechos al libre acceso a internet—. En relación con la vulneración de mis derechos y libertades humanos, he sufrido emocionalmente y experimentado emociones negativas, padeciendo mental y anímicamente. He experimentado ansiedad, frustración, depresión y no lograba concentrarme en nada, lo que me ató las manos. No pude utilizar los servicios de internet conforme a mis expectativas y necesidades y, en consecuencia, experimenté emociones negativas, sufrimiento anímico y estrés, por lo que estoy bajo una enorme presión. La sociedad Schufa Holding AG trata, recopila, manipula y comercia ilícitamente con mis datos personales sin mi consentimiento, lo que se considera una vulneración de la ley de protección de datos personales (DSGVO), del RGPD, y tal conducta ilícita puede considerarse delito y acarrear consecuencias penales. Las actividades de la sociedad Schufa Holding AG también pueden entenderse como organizadas en cooperación con agentes ejecutores, bancos y empresas de telecomunicaciones como un CÁRTEL, con el fin de crear un monopolio en el mercado y ejercer presión sobre los deudores para que salden sus obligaciones. Tal conducta también puede considerarse extorsión de los deudores —delitos como la extorsión, los acuerdos de cártel o el abuso de posición dominante en el mercado—. Si no pago mis deudas, no obtengo internet. Lo cual está además en flagrante contradicción con las buenas costumbres. Es importante señalar que el RGPD y otras leyes de protección de datos establecen normas claras sobre el tratamiento de datos personales, entre ellas que los interesados deben ser informados de cómo y por qué se tratan sus datos y deben tener la posibilidad de oponerse a dicho tratamiento; sin su consentimiento informado, los datos no pueden en ningún caso utilizarse, y menos aún con fines de una decisión individual automatizada. DIRECTIVA 2014/104/UE DEL PARLAMENTO EUROPEO Y DEL CONSEJO de 26 de noviembre de 2014 relativa a determinadas normas por las que se rigen las acciones por daños en virtud del Derecho nacional, por infracciones del Derecho de la competencia de los Estados miembros y de la Unión Europea (4) El derecho, derivado del Derecho de la Unión, a la reparación del daño causado por infracciones del Derecho de la competencia de la Unión y nacional exige que todos los Estados miembros dispongan de normas procesales que garanticen el ejercicio efectivo de ese derecho. CAPÍTULO V — Cuantificación del daño — Artículo 17 1. Los Estados miembros velarán por que la carga y el nivel de la prueba necesarios para la cuantificación del daño no hagan prácticamente imposible o excesivamente difícil el ejercicio del derecho al resarcimiento. Los Estados miembros velarán por que los órganos jurisdiccionales nacionales estén facultados, con arreglo a los procedimientos nacionales, para estimar el importe del daño si se acredita que el demandante sufrió un</p>"}, {"n": 7, "body": "<p>daño pero resulta prácticamente imposible o excesivamente difícil cuantificar con precisión el daño sufrido sobre la base de las pruebas disponibles. (11) A falta de normas de la Unión, las acciones por daños se rigen por las normas y procedimientos nacionales de los Estados miembros. Según la jurisprudencia del Tribunal de Justicia de la Unión Europea (en lo sucesivo: «Tribunal de Justicia»), toda persona tiene derecho a reclamar la reparación del daño sufrido cuando exista una relación de causalidad entre el daño y la infracción del Derecho de la competencia. (13) El derecho a la reparación del daño se reconoce a toda persona física o jurídica —consumidores, empresas o autoridades públicas— con independencia de la existencia de una relación contractual directa con la empresa infractora e independientemente de que una autoridad de competencia haya constatado o no previamente la infracción. 8. Valores de la UE Prioridades de la Unión Europea para los años 2024 – 2029 Una Europa libre y democrática ▪ promoción de los valores europeos dentro de la UE; ▪ respeto de los valores de la UE a escala mundial. Una Europa fuerte y segura ▪ garantizar una acción exterior coherente e influyente; ▪ reforzar la seguridad y la defensa de la UE y proteger a los ciudadanos de la UE; ▪ prepararse para una Unión más grande y más fuerte; ▪ promover un enfoque global de la migración y la gestión de las fronteras. Una Europa próspera y competitiva ▪ reforzar la competitividad de la UE; ▪ aplicar con éxito la transición ecológica y digital; ▪ apoyar un entorno favorable a la innovación y al espíritu empresarial; ▪ progresar juntos. 1. ¿Cómo nos garantiza la Unión la protección de los ciudadanos, si los Estados más fuertes, como Alemania, vulneran los derechos humanos, roban a sus ciudadanos y nos mienten sobre cómo nos protegen? 2. ¿Cómo pretende la Unión reforzar nuestra competitividad, cuando el fraudulento mega cártel Schufa- Telekom quiere ser barrido bajo la alfombra por la propia presidenta de la CE, Ursula von der Leyen, siendo un cártel lo opuesto a la competitividad? Agencia de los Derechos Fundamentales de la Unión Europea (FRA) La Agencia de los Derechos Fundamentales de la UE (FRA) presta a los responsables políticos europeos y nacionales un asesoramiento independiente y basado en datos contrastados, contribuyendo así a que los debates, las políticas y la legislación en materia de derechos fundamentales se basen en una masa crítica de datos y estén orientados a objetivos. Funciones La Agencia asesora a las instituciones de la UE y a los gobiernos en materia de derechos fundamentales, principalmente en los siguientes ámbitos:</p>"}, {"n": 8, "body": "<p>▪ racismo y xenofobia; ▪ discriminación; ▪ acceso a la justicia; ▪ protección de datos; ▪ derechos de las víctimas; ▪ derechos del menor. El objetivo de la Agencia es contribuir a una promoción y protección más eficaces de los derechos fundamentales en toda la UE. A tal fin consulta a sus socios y coopera con ellos en: ▪ recopilar y analizar información y datos mediante investigaciones sociojurídicas; ▪ prestar asistencia y asesoramiento especializado; ▪ comunicar y sensibilizar sobre los derechos. ¿Para qué y a quién sirven estas agencias, cuando la Comisión Europea hace lo que quiere y la vulneración de los derechos humanos y la vulneración de la ley de protección de los datos personales protegidos del consumidor son ignoradas, como hace la presidenta de la CE, Ursula von der Leyen? Existe aquí su clara intención de barrer este fraude bajo la alfombra, ya que está en sintonía con Alemania en razón de su origen —hay, pues, un conflicto de intereses—. ¿Es así como les enseñan (FRA) a comunicar, que la von der Leyen se niega a comunicarse conmigo? La UE debe ser competitiva y no crear monopolios. Como prueba adjunto un correo electrónico dirigido a la señora von der Leyen. 17. Propuesta de resolución Solicitud: Conforme a las leyes y reglamentos, mis derechos han sido vulnerados y por ello solicito la reparación del daño. Con arreglo al artículo 82 del RGPD tengo derecho a la reparación del daño causado por el tratamiento ilícito de mis datos personales. Solicito que se me abone una indemnización por el tiempo dedicado a descubrir este fraude, por el daño psíquico, por el trauma de por vida y por los robos que los demandados autores del fraude cometieron y siguen cometiendo contra mí y contra las masas de ciudadanos alemanes — incluido usted, señor juez—, mediante la ilícita no prestación de una conexión básica a internet y el precio excesivo de los servicios prestados a causa del cártel existente entre las empresas de telecomunicaciones. El cártel conduce a precios elevados por la falta de competencia. Solicito además una disculpa por escrito, mediante carta dirigida a mi persona, por el trauma que desde hace varios años me veo obligado a soportar. 18. Conclusión Ilustre Tribunal, en el presente documento (Demanda) describo el estado de hecho del fraude y del robo que las sociedades arriba indicadas han aplicado y siguen aplicando contra mí, de forma resumida, con el único fin de darle una visión del conjunto del fraude que estas sociedades cometen. Toda la demás información detallada está ampliamente expuesta en los anexos de las Denuncias penales y las Reclamaciones a la Comisión Europea, que se adjuntan a la presente demanda en formato PDF y están firmadas de puño y letra con firma física y también con la firma invisible QES, incluida la presente demanda. Insto asimismo al tribunal de Landshut a que ordene a las sociedades demandadas poner fin a este fraude por los motivos ilícitos de su aplicación arriba indicados y a que las condene a pagar mi indemnización</p>"}, {"n": 9, "body": "<p>mediante requerimiento de pago. La sociedad Deutsche Telekom AG roba cada día a una nación de 84 552 242 habitantes, que está a la vanguardia del progreso tecnológico, y ello a plena luz del día en forma de vulneración de los derechos humanos —lo cual no se ve tan fácilmente, incluido usted y su familia, señor juez/señora jueza—. [El presente documento está firmado con QES] Atentamente, en Kumhausen, 2.10.2024 Peter Ferenc ........................ ciudadano de la Unión Europea</p>"}]}, "it": {"title": "Azione legale contro Deutsche Telekom AG e Schufa Holding AG", "pages": [{"n": 1, "body": "<p>«Attore» Peter Ferenc Rammelkam 2, Kumhausen Deutschland +49 157 317 33332 info@foxprof.club Amtsgericht Landshut Maximilianstraße 22 84028 Landshut Deutschland a Kumhausen, 2.10.2024 ATTO DI CITAZIONE 4. «Convenuti» • Deutsche Telekom AG, Friedrich-Ebert-Allee 140, 53113 Bonn, Germania. Numero di registro (registro delle imprese): HRB 6794 (Tribunale circoscrizionale di Bonn); • e • Schufa Holding AG, Kormoranweg 5, 65201 Wiesbaden, Germania. Numero di registro (registro delle imprese): non accessibile al pubblico; numero di identificazione fiscale: DE87ZZZ00000239351. 5. «Oggetto della domanda» La domanda riguarda la violazione del GDPR e dei diritti umani da parte della società Deutsche Telekom AG. Cito pertanto le società sopra indicate per il risarcimento del danno cagionato dalla condotta fraudolenta nei miei confronti e chiedo il pagamento di 500 000 EUR per ciascuna separatamente, affinché il giudice condanni ciascuna di esse a versare la somma indicata sul mio conto presso Slovenská sporiteľňa: IBAN: SK59 0900 0000 0052 0995 7308 BIC: GIBASKBX. 6. «Allegazioni di fatto» Descrizione dell&#x27;evento: Nell&#x27;esame della mia richiesta di un collegamento internet fisso, a luglio, in un giorno non esattamente accertato del 2022, la società Deutsche Telekom AG (di seguito: Telekom) ha trattato — e tuttora tratta — illecitamente i miei dati personali sotto forma di trattamento individuale automatizzato (decisione), fondato sull&#x27;impiego del trucco fraudolento dell&#x27;agenzia fraudolenta Schufa relativo alla «BONITÄT» (affidabilità creditizia) del consumatore, senza il suo consenso informato (del consumatore). È così violato il mio diritto fondamentale dell&#x27;Unione — il diritto di accesso a internet tramite il fornitore Deutsche Telekom AG. Il governo, che copre questa mega frode di cartello, non solo mi priva del</p>"}, {"n": 2, "body": "<p>collegamento internet, violando i miei diritti umani fondamentali — il diritto di accesso a internet — ma mi ha altresì costretto ad acquistare dati internet per 108 EUR al mese tramite una SIM 5G prepagata di Telekom, di cui ho anche prove indicate nel Reclamo alla Commissione europea, allegato al presente atto. I dati illimitati sono per me vitali, poiché devo studiare l&#x27;inglese quotidianamente, lingua necessaria alla mia ulteriore crescita professionale. Prove: Le prove dettagliate si trovano negli allegati del presente atto in formato PDF, che devono essere esaminate dal giudice concretamente assegnato. Ecco l&#x27;elenco dei file PDF: – 10. Strafrechtliche Mitteilung_Telekom and Schufa_sharp_Deutsch_fy.pdf – 11. Strafrechtliche Mitteilung_Telekom_Altstadt_Angestellter 1_with_QES.pdf – 12. Strafrechtliche Mitteilung über GP Peter Frank_with_signature_QES.PDF – 13. CS Complaint form request_0_koncept_ostrý_nahlásenie EU komisii podvod_with_QES.pdf – 14. Anzeige über Schindler_unterschrift_signed_with_QES.pdf – 15. Benachrichtigung der Telekom Mitarbeitern Telekom 94-95 Altstadt_with_QES.pdf 16. «Motivi di diritto» Violazione della legge: Si tratta principalmente della violazione della legge a tutela dei miei dati personali protetti di consumatore e del servizio universale di accesso a internet senza restrizioni e discriminazioni — § 78 TKG. Telekommunikationsgesetz (TKG), § 78 (servizio universale): tale paragrafo stabilisce che i fornitori di servizi di telecomunicazione pubblici devono garantire che tutti gli utenti finali abbiano accesso a servizi di comunicazione elettronica disponibili e di qualità, compreso l&#x27;accesso di base a internet. I fornitori non possono discriminare alcun utente e devono garantire che i servizi siano forniti a un prezzo ragionevole. E un prezzo di 108 EUR al mese per una qualità di 20 Mbit/s di velocità di trasmissione e una connessione instabile è inaccettabile e oltre ogni limite di tolleranza. In generale, nessuno può limitare il consumatore nel suo diritto di accesso a internet, poiché è il suo diritto e la sua libertà fondamentali, che prevalgono su qualsiasi interesse «legittimo» del fornitore! L&#x27;interessato ha il diritto di non essere sottoposto a una decisione basata unicamente sul trattamento individuale automatizzato (decisionale) dei dati, compresa la profilazione, che produca effetti giuridici che lo riguardano o che incida in modo analogo significativamente (negativamente) sulla sua persona (GDPR)! Se il trattamento è basato sul consenso, il titolare deve essere in grado di dimostrare che l&#x27;interessato ha prestato il consenso al trattamento dei propri dati personali protetti. E anche questo non viene affatto rispettato. Pertanto, se Telekom volesse applicare, alla richiesta di collegamento internet del consumatore, una decisione individuale automatizzata, è tenuta a chiedere al consumatore il suo consenso informato! Ai sensi dell&#x27;articolo 6 del GDPR, la società Deutsche Telekom AG ha violato i miei diritti alla protezione dei dati personali. Il GDPR riconosce agli individui il diritto di essere informati dell&#x27;esistenza di una decisione individuale automatizzata, della sua logica e delle sue conseguenze. Telekom non mi ha offerto, non mi offre tale possibilità e applica arbitrariamente il regime illecito della decisione individuale automatizzata nell&#x27;esame della richiesta di collegamento internet (servizi), non offrendomi alcuna possibilità di esprimere il mio dissenso all&#x27;uso della decisione automatizzata, poiché non mi informa nemmeno delle possibili</p>"}, {"n": 3, "body": "<p>conseguenze del suo impiego. Il mio consenso informato non è stato ottenuto e si comporta come se per essa le leggi non esistessero! E non da ultimo, si tratta della legge sulla protezione dei dati personali del consumatore, che tali società violano in quanto l&#x27;informazione sull&#x27;insolvenza ottenuta dagli ufficiali giudiziari viene venduta dalla società Schufa Holding AG (per profitto finanziario) al trattamento alle società di telecomunicazione in forma elettronica via internet, ai fini del trattamento di una decisione individuale automatizzata sotto forma di presunta (fraudolenta) affidabilità creditizia del consumatore — richiedente l&#x27;accesso a internet, e ciò senza il consenso informato del consumatore. A che serve allora la legge sulla protezione dei dati personali? Telekom ha adottato una decisione individuale automatizzata sulla cui base mi ha rifiutato i servizi internet, per cui ho dovuto acquistare un router 5G ZTE 5001 e una SIM 5G per ricevere il segnale internet e collegarmi al servizio «internet». Il prezzo del dispositivo era di circa 300 EUR. Il prezzo della SIM per 28 giorni è di 100 EUR, sicché i miei costi mensili di 108 EUR per il funzionamento di questo dispositivo sono superiori di: 108 EUR − 40 EUR = 68 EUR! Per me sono conseguenze negative rilevanti, e quindi anche costi! Per non dire che il valore del collegamento internet tramite DSL è sopravvalutato del 170 %. Il prezzo reale non dovrebbe superare i 20 EUR al mese, e non 40–45 EUR a causa del cartello! Se internet costasse quanto dovrebbe, fino a 20 EUR, sarebbe sopravvalutato del 440 %. E ciò significa anche che sono discriminato! Da questo risulta chiaramente che Telekom ha la peggio e che ogni cittadino della Repubblica Federale di Germania è da essa derubato. E come per magia, all&#x27;improvviso è possibile pagare anche con una banca slovacca tramite bonifico automatizzato. Sono miracoli, quando si deve pagare un internet sopravvalutato di oltre il 440 % a causa di una frode di cartello. Una banca tedesca non è più una condizione per la richiesta di collegamento internet presso Telekom! Tale condizione è semplicemente evaporata lungo il percorso! Un accordo di cartello, cioè un&#x27;azione concertata tra due o più concorrenti allo scopo di coordinare il loro comportamento concorrenziale sul mercato o di influenzare i pertinenti parametri della concorrenza, mediante pratiche quali, tra l&#x27;altro, la fissazione o il coordinamento dei prezzi di vendita sul mercato, si chiama cartello ed è una violazione delle norme sulla concorrenza, cioè «pratiche commerciali sleali e arricchimento ingiustificato».</p>"}, {"n": 4, "body": "<p>Dunque, logicamente, Telekom non dispone di alcuna base giuridica ai sensi dell&#x27;art. 6, par. 1, lett. f) del GDPR per rifiutarmi, quale consumatore, la fornitura di servizi internet a causa di un possibile sovraindebitamento. Poiché l&#x27;internet sopravvalutato che devo pagare 108 EUR supera di gran lunga la possibile perdita in caso di mancato pagamento del mio ultimo importo di fatturazione di 40 EUR al mese per il collegamento DSL di Telekom. Ne consegue logicamente che, grazie a Telekom e alla sua frode nei miei confronti, sono io a indebitarmi sempre più ogni mese, e non Telekom. Per non dire che, per soddisfare la base giuridica di cui Telekom necessita per applicare la decisione individuale automatizzata, la legge fissa delle condizioni: Gli obblighi legali e il legittimo interesse sono due diverse basi giuridiche sulla cui base le organizzazioni possono trattare dati personali secondo il General Data Protection Regulation (GDPR) e il Bundesdatenschutzgesetz (BDSG). Obblighi legali❖ Gli obblighi legali significano che un&#x27;organizzazione deve trattare dati personali per adempiere ai propri obblighi di legge. Ciò può comprendere: • Obblighi fiscali: trattamento di dati a fini di dichiarazione dei redditi. • Contabilità: tenuta delle scritture in conformità alla legge. • Sicurezza: garantire la conformità alle prescrizioni e ai regolamenti di sicurezza. Legittimo interesse Il legittimo interesse è una base giuridica più flessibile che consente il trattamento di dati personali quando è necessario per i legittimi interessi dell&#x27;organizzazione o di un terzo, purché tali interessi non prevalgano sui diritti e sulle libertà dell&#x27;individuo. Gli esempi comprendono: • Prevenzione delle frodi: trattamento di dati per identificare e prevenire le frodi. • Marketing: uso dei dati a fini di marketing diretto. • Sicurezza informatica: garantire la sicurezza delle reti e dei sistemi informativi. Come si vede, né sotto gli obblighi legali né sotto il legittimo interesse rientra il diritto della società Schufa Holding AG di manipolare, commerciare o comunque fornire i miei dati personali protetti dalla legge a terzi come Deutsche Telekom AG senza il mio consenso informato, ai fini di ulteriori decisioni individuali automatizzate della società Telekom. Descrizione dei motivi del risarcimento➢ A causa dell&#x27;abuso dei miei dati personali ottenuti dalla società Schufa in modo illecito e da voi forniti a terzi come le società di telecomunicazione, senza alcun mio consenso al trattamento dei miei dati personali ai fini del trattamento e delle decisioni automatizzate delle società di telecomunicazione per la fornitura di servizi internet, avete leso i miei diritti di accesso ai servizi internet nell&#x27;UE, il che ha condotto al rifiuto di fornire i servizi internet di base da parte delle società di telecomunicazione. Norme dell&#x27;UE sull&#x27;internet aperto➢ Le norme dell&#x27;UE sull&#x27;internet aperto vi conferiscono, in quanto utente, il diritto di accedere a qualsiasi contenuto e servizio online di vostra scelta e/o di distribuirlo. Il vostro fornitore di internet non può bloccare, rallentare o discriminare alcun contenuto, applicazione o servizio online, salvo in 3 casi particolari: – per adempiere a obblighi di legge, come un&#x27;ordinanza giudiziaria di blocco di un determinato contenuto illecito;</p>"}, {"n": 5, "body": "<p>– per combattere virus o malware; – per gestire una congestione eccezionale o temporanea della rete, al fine di preservare la sicurezza e l&#x27;integrità della rete. REGOLAMENTO (UE) 2015/2120 DEL PARLAMENTO EUROPEO E DEL CONSIGLIO➢ (1) L&#x27;obiettivo del presente regolamento è stabilire norme comuni per garantire un trattamento equo e non discriminatorio del traffico nella fornitura di servizi di accesso a internet e i relativi diritti degli utenti finali. Il suo obiettivo è tutelare gli utenti finali e garantire al contempo il funzionamento ininterrotto dell&#x27;ecosistema di internet quale motore dell&#x27;innovazione. (6) Gli utenti finali dovrebbero avere il diritto di accedere alle informazioni e ai contenuti e di distribuirli, nonché di utilizzare e fornire applicazioni e servizi senza discriminazioni tramite il proprio servizio di accesso a internet. (7) Affinché gli utenti finali possano esercitare i loro diritti di accedere alle informazioni e ai contenuti e di distribuirli, nonché di utilizzare e fornire applicazioni e servizi di loro scelta, dovrebbero poter concordare con i fornitori di servizi di accesso a internet tariffe per determinati volumi di dati e velocità del servizio di accesso a internet. Le autorità nazionali di regolamentazione e le altre autorità competenti dovrebbero avere il potere di intervenire contro accordi (cartelli) o pratiche commerciali (sleali) che, per la loro portata, conducono a situazioni in cui la scelta degli utenti finali è in pratica sostanzialmente limitata (il mio caso). (8) Nella fornitura di servizi di accesso a internet, i fornitori di tali servizi dovrebbero trattare tutto il traffico in modo uguale, senza discriminazioni, restrizioni o interferenze, indipendentemente dal mittente o dal destinatario, dal contenuto, dall&#x27;applicazione o dal servizio, o dall&#x27;apparecchiatura terminale. Accesso aperto a internet➢ I fornitori di internet sono tenuti a trattare tutto il traffico in modo uguale quando forniscono servizi di accesso a internet: – senza discriminazioni, restrizioni o interferenze; e – indipendentemente dal mittente e dal destinatario; – dal contenuto cui si accede o che si distribuisce; o dalle applicazioni o dai servizi utilizzati. I fornitori possono adottare misure ragionevoli di gestione del traffico, che tuttavia devono essere trasparenti, non discriminatorie, proporzionate e non basate su motivi commerciali. Per questi motivi non ho potuto, a lungo, utilizzare i servizi internet per: • Ottenere opportunità di lavoro — nell&#x27;odierna era digitale l&#x27;accesso a internet è spesso indispensabile per cercare lavoro e candidarsi a posizioni, il che è oggi cruciale per lo sviluppo professionale della persona nella società. • Comunicare con le autorità — molti servizi pubblici e comunicazioni avvengono ormai online, il che significa che senza accesso a internet siamo svantaggiati. • Attività imprenditoriali — per gli imprenditori l&#x27;accesso a internet è cruciale per la gestione dell&#x27;attività, il marketing e la comunicazione con i clienti. • Studio della lingua inglese — l&#x27;istruzione e lo sviluppo personale, compreso lo studio delle lingue, dipendono direttamente da risorse e corsi online. Internet è per me cruciale per imparare l&#x27;inglese, poiché mi fornisce un riscontro immediato e registrazioni audio e video per apprendere la pronuncia in combinazione con lo studio della grammatica.</p>"}, {"n": 6, "body": "<p>Questi punti mostrano chiaramente come l&#x27;accesso a internet possa essere considerato un bisogno fondamentale e un diritto fondamentale, che consente agli individui di partecipare pienamente alla società e all&#x27;economia. Le società Schufa e Telekom hanno abusato dei miei dati personali per impedirmi, in modo vile e subdolo, l&#x27;accesso ai servizi internet delle società di telecomunicazione, il che ha condotto alla limitazione del mio accesso ai servizi internet — una grave violazione dei miei diritti al libero accesso a internet. In relazione alla violazione dei miei diritti e libertà umani ho sofferto emotivamente e provato emozioni negative, patendo mentalmente e psichicamente. Ho provato ansia, frustrazione, depressione e non riuscivo a concentrarmi su nulla, il che mi ha legato le mani. Non ho potuto utilizzare i servizi internet secondo le mie aspettative e necessità e, di conseguenza, ho provato emozioni negative, sofferenza psichica e stress, per cui sono sotto enorme pressione. La società Schufa Holding AG tratta, raccoglie, manipola e commercia illecitamente i miei dati personali senza il mio consenso, il che è considerato una violazione della legge sulla protezione dei dati personali (DSGVO), del GDPR, e tale comportamento illecito può essere considerato reato e comportare conseguenze penali. Le attività della società Schufa Holding AG possono essere intese anche come organizzate in cooperazione con ufficiali giudiziari, banche e società di telecomunicazione quale CARTELLO, allo scopo di creare un monopolio sul mercato e di esercitare pressione sui debitori affinché saldino le proprie obbligazioni. Tale comportamento può essere considerato anche estorsione dei debitori — reati quali estorsione, accordi di cartello o abuso di posizione dominante sul mercato. Se non pago i miei debiti, non ottengo internet. Il che è anche in netto contrasto con il buon costume. È importante rilevare che il GDPR e le altre leggi sulla protezione dei dati stabiliscono norme chiare sul trattamento dei dati personali, tra cui che gli interessati devono essere informati su come e perché i loro dati sono trattati e devono avere la possibilità di opporsi a tale trattamento; senza il loro consenso informato i dati non possono in alcun caso essere utilizzati, e tanto meno ai fini di una decisione individuale automatizzata. DIRETTIVA 2014/104/UE DEL PARLAMENTO EUROPEO E DEL CONSIGLIO del 26 novembre 2014 relativa a determinate norme che regolano le azioni per il risarcimento del danno ai sensi del diritto nazionale per violazioni delle disposizioni del diritto della concorrenza degli Stati membri
