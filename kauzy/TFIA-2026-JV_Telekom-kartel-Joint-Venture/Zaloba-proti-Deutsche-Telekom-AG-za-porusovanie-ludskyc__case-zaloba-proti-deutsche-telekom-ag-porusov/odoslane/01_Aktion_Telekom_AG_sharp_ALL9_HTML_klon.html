<script>
const LANGS = [{"code": "de", "flag": "🇩🇪", "label": "DE"}, {"code": "en", "flag": "🇬🇧", "label": "EN"}, {"code": "sk", "flag": "🇸🇰", "label": "SK"}, {"code": "hr", "flag": "🇭🇷", "label": "HR"}, {"code": "pl", "flag": "🇵🇱", "label": "PL"}, {"code": "es", "flag": "🇪🇸", "label": "ES"}, {"code": "it", "flag": "🇮🇹", "label": "IT"}, {"code": "fr", "flag": "🇫🇷", "label": "FR"}, {"code": "sv", "flag": "🇸🇪", "label": "SV"}];
const CONTENT = {"de": {"title": "Klage gegen Deutsche Telekom AG und Schufa Holding AG", "pages": [{"n": 1, "body": "<p>Kläger: Peter Ferenc Rammelkam 2, Kumhausen Deutschland +49 157 317 33332 info@foxprof.club</p><p>in Kumhausen 2.10.2024 „Klage“</p><p>1. Beklagte</p><p>• Deutsche Telekom AG, Friedrich-Ebert-Allee 140, 53113 Bonn, Deutschland. HRB 6794 (Amtsgericht Bonn), USt-IdNr. DE 123475223 und Schufa Holding AG, Kormoranweg 5, 65201 Wiesbaden, Deutschland. HRB: Nicht öffentlich zugänglich, USt-IdNr: DE87ZZZ00000239351</p><p>2. Klagegegenstand:</p><p>Die Klage betrifft die Verletzung der DSGVO und der Menschenrechte durch die Deutsche Telekom AG. Daher klage ich die oben genannten Unternehmen auf Schadensersatz in Höhe von 500.000€ pro Person, damit das Gericht jeden von ihnen verpflichtet, den genannten Betrag auf mein Konto bei der Slovenská sporiteľňa zu zahlen: IBAN: SK59 0900 0000 0052 0995 7308 BIC: GIBASKBX.</p><p>3. Tatsachenbehauptungen • Ereignisbeschreibung: Bei der Prüfung meines Antrags auf einen festen Internetanschluss im Juli an einem nicht genau festgestellten Tag im Jahr 2022 hat die Deutsche Telekom AG (im Folgenden Telekom) meine personenbezogenen Daten unrechtmäßig in Form einer automatisierten individuellen Verarbeitung (Entscheidung) verwendet und verwendet sie weiterhin betrügerischer Trick der betrügerischen Agentur Schufa mit der „BONITÄT“ des Verbrauchers ohne dessen informierte Zustimmung (Verbraucher): Es ist mein grundlegendes Unionsrecht verletzt, nämlich das Recht auf Zugang zum Internet durch den Anbieter Deutsche Telekom AG. Die Regierung, die diesen Mega-Kartellbetrug deckt, beraubt mich nicht nur des Internetzugangs, wodurch meine grundlegenden Menschenrechte verletzt werden, nämlich das Recht auf Zugang Amtsgericht Landshut Maximilianstraße 22 84028 Landshut Deutschland</p>"}, {"n": 2, "body": "<p>zum Internet!!! Und nicht nur das, sie zwang mich, Internetdaten für 108€/Monat über eine 5G SIM-Prepaid-Karte von Telekom zu kaufen, wofür ich auch Beweise habe, die in der Beschwerde an die EK aufgeführt sind, die dieser Klage beigefügt ist!! Unbegrenzte Daten sind für mich lebenswichtig, da ich täglich Englisch lernen muss, was ich für mein weiteres berufliches Wachstum benötige.</p><p>▪ Gesetzesverstoß: Es handelt sich hauptsächlich um einen Verstoß gegen das Gesetz zum Schutz meiner geschützten personenbezogenen Daten des Verbrauchers und des universellen Dienstes für den Internetzugang ohne Einschränkungen und Diskriminierung gemäß §78 TKG. Telekommunikationsgesetz (TKG): § 78 (Universaldienst): Dieser Paragraph legt fest, dass Anbieter öffentlicher Telekommunikationsdienste sicherstellen müssen, dass alle Endnutzer Zugang zu verfügbaren und qualitativ hochwertigen elektronischen Kommunikationsdiensten haben, einschließlich des grundlegenden Internetzugangs. Anbieter dürfen keinen Nutzer diskriminieren und müssen sicherstellen, dass die Dienste zu angemessenen Preisen angeboten werden. Und der Preis von 108€/Monat für eine Geschwindigkeit von 20Mbit/s und eine instabile Verbindung ist inakzeptabel und jenseits jeder Toleranzgrenze. ▪ Beweise: Detaillierte Beweise befinden sich in den Anhängen dieser Klage in PDF- Formaten, die von den zuständigen Richtern geprüft werden müssen. Hier ist die Liste der PDF-Dateien: 2. Strafrechtliche Mitteilung_Telekom und Schufa_scharf_Deutsch_fy.pdf 3. Strafrechtliche Mitteilung Telekom Altstadt Angestellter 1_mit QES.pdf 4. Strafrechtliche Mitteilung über GP Peter Frank_mit Unterschrift_QES.PDF 5. CS Beschwerdeformular Anfrage 0 Konzept scharf Meldung an die EU- Kommission Betrug_mit_QES.pdf 6. Anzeige über Schindler Unterschrift unterzeichnet mit QES.pdf 7. Benachrichtigung der Telekom Mitarbeiter Telekom 94-95 Altstadt mit_QES.pdf</p>"}, {"n": 3, "body": "<p>4. „Rechtliche Gründe“</p><p>• Gesetzesverstoß:</p><p>Es handelt sich hauptsächlich um einen Verstoß gegen das Gesetz zum Schutz meiner geschützten personenbezogenen Daten des Verbrauchers und des universellen Gesetzes (Dienstes) für den Internetzugang ohne Einschränkungen und Diskriminierung gemäß §78 TKG. Telekommunikationsgesetz (TKG): § 78 (Universaldienst): Dieser Paragraph legt fest, dass Anbieter öffentlicher Telekommunikationsdienste sicherstellen müssen, dass alle Endnutzer Zugang zu verfügbaren und qualitativ hochwertigen elektronischen Kommunikationsdiensten haben, einschließlich des grundlegenden Internetzugangs. Anbieter dürfen keinen Nutzer diskriminieren und müssen sicherstellen, dass die Dienste zu angemessenen Preisen angeboten werden. Und der Preis von 108€/Monat für eine Geschwindigkeit von 20Mbit/s und eine instabile Verbindung ist inakzeptabel und jenseits jeder Toleranzgrenze.</p><p>Allgemein gesagt, niemand kann den Verbraucher in seinem Recht auf Zugang zum Internet einschränken, da dies sein grundlegendes Recht und seine Freiheit ist und über allen „berechtigten“ Interessen des Anbieters steht! Die betroffene Person hat das Recht, dass auf sie !!keine!! Entscheidung angewendet wird, die ausschließlich auf !!automatisierter individueller Entscheidungsfindung (Datenverarbeitung)!! basiert, einschließlich Profiling, und die rechtliche Auswirkungen hat, die sie betreffen oder sie in ähnlicher Weise erheblich (negativ) beeinflussen (DSGVO)!!! Wenn die Verarbeitung auf Einwilligung beruht, muss der Verantwortliche nachweisen können, dass die betroffene Person der Verarbeitung ihrer geschützten personenbezogenen Daten zugestimmt hat. Und dies wird ebenfalls überhaupt nicht eingehalten. Wenn die Telekom bei der Anfrage des Verbrauchers nach einem Internetanschluss eine Automatisierte Individuelle Entscheidung verwenden möchte, ist sie verpflichtet, den Verbraucher um seine informierte Einwilligung zu bitten!!!</p><p>Gemäß Artikel 6 DSGVO hat die Deutsche Telekom AG meine Datenschutzrechte verletzt. Die DSGVO gewährt Einzelpersonen das Recht, über die Existenz einer automatisierten individuellen Entscheidung, deren Logik und deren Konsequenzen informiert zu werden.</p><p>Die Telekom hat mir diese Möglichkeit nicht gegeben, gibt sie mir nicht und wendet willkürlich das rechtswidrige Regime der automatisierten individuellen Entscheidung bei der Prüfung des Antrags auf Internetanschluss (Dienstleistungen) an, da sie mir keine Möglichkeit bietet, meinen Widerspruch gegen die Verwendung der Automatisierten Entscheidung Auszudrücken, weil sie mich auch nicht über die möglichen Konsequenzen ihrer Verwendung informiert. Meine informierte Einwilligung hat er nicht eingeholt und verhält sich, als ob für ihn keine Gesetze existieren würden!!!</p>"}, {"n": 4, "body": "<p>Und nicht zuletzt geht es um das Gesetz zum Schutz der personenbezogenen Daten des Verbrauchers, das diese Unternehmen dadurch verletzen, dass die Schufa Holding AG Informationen über die Zahlungsunfähigkeit von Gerichtsvollziehern an Telekommunikationsunternehmen in elektronischer Form über das Internet zum Zweck der Verarbeitung einer Automatisierten Individuellen Entscheidung in Form einer angeblichen (betrügerischen) Bonität des Verbrauchers, der einen Internetanschluss beantragt, verkauft (zum finanziellen Vorteil) und dies ohne die informierte Zustimmung des Verbrauchers. Wozu gibt es dann das Gesetz zum Schutz personenbezogener Daten?</p><p>Die Telekom hat eine Automatisierte Individuelle Entscheidung getroffen, aufgrund derer mir die Internetdienste verweigert wurden, weshalb ich einen 5G ZTE 5001 Router und eine 5G SIM-Karte kaufen musste, um das Internetsignal zu empfangen und die Dienstleistung „Internet“ zu nutzen. Der Preis für das Gerät betrug ca. 300€. Der Preis für die SIM-Karte für 28 Tage beträgt 100€, was bedeutet, dass meine monatlichen Kosten für den Betrieb dieses Geräts um 108€ - 40€ = 68€ höher sind!!! Dies sind erhebliche negative Folgen und somit auch Kosten für mich!! Ganz zu schweigen davon, dass der Wert des Internetanschlusses über DSL um 170% überteuert ist. Der reale Preis sollte nicht mehr als 20€/Monat betragen und nicht 40€-45€ aufgrund des Kartells!!! Wenn das Internet so viel kosten würde, wie es sollte, nämlich bis zu 20€, wäre es um 440% überteuert. Und das bedeutet auch, dass ich diskriminiert werde!!! Daraus geht klar hervor, dass die Telekom den Kürzeren zieht und dass jeder Bürger des Bundeslandes Deutschland von ihr betrogen wird.</p>"}, {"n": 5, "body": "<p>Und wie durch ein Wunder kann man plötzlich auch mit einer slowakischen Bank per automatisierter Überweisung bezahlen. Das sind Wunder, wenn man einen um mehr als 440% überteuerten Internetanschluss wegen eines Kartellbetrugs bezahlen muss. Plötzlich ist bei der Beantragung eines Internetanschlusses bei der Telekom keine deutsche Bank mehr erforderlich!!! Diese Bedingung hat sich einfach in Luft aufgelöst!!! Eine Kartellvereinbarung, also ein abgestimmtes Verhalten zwischen zwei oder mehr Wettbewerbern mit dem Ziel, ihr Wettbewerbsverhalten auf dem Markt zu koordinieren oder relevante Wettbewerbsparameter zu beeinflussen, durch Praktiken wie unter anderem die Festlegung oder Koordinierung von Verkaufspreisen auf dem Markt, wird als Kartell bezeichnet und ist ein Verstoß gegen die Wettbewerbsrechtlichen Vorschriften, also „unlautere Geschäftspraktiken und ungerechtfertigte Bereicherung“ . Also verfügt die Telekom logisch gesehen über keine rechtliche Grundlage gemäß Artikel 6 Absatz 1 Buchstabe f) DSGVO, um mir als Verbraucher aufgrund einer möglichen Überschuldung die Internetdienste zu verweigern. Denn das überteuerte Internet, das ich für 108€ bezahlen muss, übersteigt bei weitem den möglichen Verlust bei Nichtzahlung meiner letzten Rechnungsbetrag von 40€/Monat für den DSL-Anschluss der Telekom. Daraus ergibt sich logisch, dass ich mich dank der Telekom und ihres Betrugs an mir jeden Monat noch mehr verschulde und nicht die Telekom. Ganz zu schweigen davon, dass zur Erfüllung der rechtlichen Grundlage, die die Telekom für die Anwendung der Automatisierten Individuellen Entscheidung (AIE) benötigt, gesetzlich festgelegte Bedingungen erfüllt sein müssen: Rechtliche Pflichten und berechtigtes Interesse sind zwei verschiedene Rechtsgrundlagen, auf deren Grundlage Organisationen personenbezogene Daten gemäß der Datenschutz- Grundverordnung (DSGVO) und dem Bundesdatenschutzgesetz (BDSG) verarbeiten können. ➢ Rechtliche Pflichten Rechtliche Pflichten bedeuten, dass eine Organisation personenbezogene Daten verarbeiten muss, um ihre gesetzlichen Pflichten zu erfüllen. Dies kann umfassen: • Steuerpflichten: Verarbeitung von Daten für Steuererklärungszwecke. • Buchhaltung: Führung von Aufzeichnungen gemäß dem Gesetz. • Sicherheit: Sicherstellung der Einhaltung von Sicherheitsvorschriften und -regelungen.</p><p>➢ Berechtigtes Interesse Berechtigtes Interesse ist eine flexiblere Rechtsgrundlage, die die Verarbeitung personenbezogener Daten ermöglicht, wenn dies für die berechtigten Interessen der</p>"}, {"n": 6, "body": "<p>Organisation oder einer dritten Partei erforderlich ist, sofern diese Interessen nicht die Rechte und Freiheiten des Einzelnen überwiegen. Beispiele umfassen:</p><p>• Betrugsprävention: Verarbeitung von Daten zur Identifizierung und Verhinderung von Betrug. • Marketing: Verwendung von Daten für Direktmarketingzwecke. • IT-Sicherheit: Sicherstellung der Sicherheit von Netzwerken und Informationssystemen. Wie ersichtlich, fällt weder unter rechtliche Pflichten noch unter berechtigtes Interesse das Recht, meine gesetzlich geschützten personenbezogenen Daten durch die Schufa Holding AG an Dritte wie die Deutsche Telekom AG ohne meine informierte Einwilligung für weitere automatisierte individuelle Entscheidungen der Telekom zu manipulieren, zu handeln oder in irgendeiner Weise bereitzustellen. ➢ Beschreibung der Gründe für die Entschädigung Aufgrund des Missbrauchs meiner personenbezogenen Daten, die von der Schufa auf rechtswidrige Weise erlangt und ohne meine Zustimmung an Dritte wie Telekommunikationsunternehmen zur Verarbeitung meiner personenbezogenen Daten für automatisierte informierte Entscheidungen und zur Bereitstellung von Internetdiensten weitergegeben wurden, haben Sie meine Rechte auf Zugang zu Internetdiensten in der EU verletzt. Dies führte zur Verweigerung der Bereitstellung grundlegender Internetdienste durch Telekommunikations- und Internetdienstanbieter. ➢ EU-Vorschriften zum offenen Internet Offenes internet (Quelle: here...) EU-Vorschriften zum offenen Internet geben Ihnen als Nutzer das Recht auf Zugang zu jeglichen Online-Inhalten und -Diensten Ihrer Wahl und/oder deren Verbreitung. Ihr Internetanbieter darf keine Online-Inhalte, Anwendungen oder Dienste blockieren, verlangsamen oder diskriminieren, außer in 3 besonderen Fällen: • um gesetzliche Verpflichtungen zu erfüllen, wie z.B. eine gerichtliche Anordnung zur Sperrung bestimmter illegaler Inhalte • zur Aufrechterhaltung der Sicherheit und Integrität des Netzwerks, z.B. zur Bekämpfung von Viren oder Malware • zur Bewältigung außergewöhnlicher oder vorübergehender Netzüberlastungen</p><p>➢ VERORDNUNG (EU) 2015/2120 DES EUROPÄISCHEN PARLAMENTS UND DES RATES (Quelle: here...)</p>"}, {"n": 7, "body": "<p>(1) Ziel dieser Verordnung ist es, gemeinsame Regeln festzulegen, um eine gleiche und nicht diskriminierende Behandlung des Datenverkehrs bei der Bereitstellung von Internetzugangsdiensten und den damit verbundenen Rechten der Endnutzer zu gewährleisten. Ihr Ziel ist es, die Endnutzer zu schützen und gleichzeitig das kontinuierliche Funktionieren des Internet- Ökosystems als Motor für Innovationen zu gewährleisten. (6) Endnutzer sollten das Recht haben, auf Informationen und Inhalte zuzugreifen und diese zu verbreiten sowie Anwendungen und Dienste ohne Diskriminierung über ihren Internetzugangsdienst zu nutzen und bereitzustellen. (7) Damit Endnutzer ihre Rechte auf Zugang zu Informationen und Inhalten sowie deren Verbreitung und die Nutzung und Bereitstellung von Anwendungen und Diensten ihrer Wahl ausüben können, sollten sie die Möglichkeit haben, mit Internetzugangsanbietern Vereinbarungen über Tarife für bestimmte Datenvolumina und Geschwindigkeiten des Internetzugangsdienstes zu treffen. Nationale Regulierungsbehörden und andere zuständige Behörden sollten befugt sein, gegen Vereinbarungen (Kartelle) oder (unlautere) Geschäftspraktiken vorzugehen, die aufgrund ihres Umfangs zu Situationen führen, in denen die Wahlmöglichkeiten der Endnutzer in der Praxis erheblich eingeschränkt sind (mein Fall).</p><p>(8)Bei der Bereitstellung von Internetzugangsdiensten sollten die Anbieter dieser Dienste den gesamten Datenverkehr gleich behandeln, ohne Diskriminierung, Einschränkung oder Eingriff, unabhängig vom Absender oder Empfänger, Inhalt, Anwendung oder Dienst oder Endgerät. ➢ Offener Zugang zum Internet (Quelle: here...) Internetanbieter sind verpflichtet, den gesamten Datenverkehr gleich zu behandeln, wenn sie Internetzugangsdienste bereitstellen: • ohne Diskriminierung, Einschränkung oder Eingriff; und • unabhängig von: • Absender und Empfänger; • dem Inhalt, auf den zugegriffen oder der verbreitet wird; oder • den verwendeten Anwendungen oder Diensten. Anbieter dürfen angemessene Maßnahmen zur Verkehrssteuerung ergreifen, diese müssen jedoch transparent, nicht diskriminierend, verhältnismäßig und nicht aus kommerziellen Gründen sein.</p>"}, {"n": 8, "body": "<p>Aus diesen Gründen konnte ich die Internetdienste langfristig nicht nutzen für: • Erwerb von Arbeitsmöglichkeiten: In der heutigen digitalen Ära ist der Zugang zum Internet oft unerlässlich, um Arbeit zu suchen und sich auf Stellen zu bewerben, was für die berufliche Entwicklung einer Person in der Gesellschaft von entscheidender Bedeutung ist. • Kommunikation mit Behörden:  Viele Regierungsdienste und die Kommunikation erfolgen jetzt online, was bedeutet, dass wir ohne Internetzugang benachteiligt sind. • Geschäftliche Aktivitäten: Für Unternehmer ist der Zugang zum Internet entscheidend für die Führung ihres Geschäfts, Marketing und Kommunikation mit Kunden. • Englisch lernen: Bildung und persönliche Entwicklung, einschließlich des Sprachenlernens, sind direkt von Online-Ressourcen und Kursen abhängig. Das Internet ist für mich beim Englischlernen von entscheidender Bedeutung, da es mir sofortiges Feedback und Audio-Video-Aufnahmen zur Verbesserung der Aussprache in Kombination mit dem Erlernen der Grammatik bietet Diese Punkte zeigen deutlich, wie der Zugang zum Internet als Grundbedürfnis und Grundrecht angesehen werden kann, das es Einzelpersonen ermöglicht, sich vollständig in die Gesellschaft und Wirtschaft einzubringen. Meine persönlichen Daten wurden von den Unternehmen Schufa und Telekom missbraucht, um mir auf hinterhältige und heimtückische Weise den Zugang zu den Internetdiensten der Telekommunikationsunternehmen zu verwehren, was zu einer Einschränkung meines Zugangs zu Internetdiensten führte und eine schwerwiegende Verletzung meiner Rechte auf freien Internetzugang darstellt. Im Zusammenhang mit der Verletzung meiner Menschenrechte und Freiheiten habe ich emotional gelitten und negative Emotionen erlebt, was zu mentalem und seelischem Leiden führte. Ich habe Angst, Frustration und Depressionen erlebt und konnte mich auf nichts konzentrieren, was mir die Hände gebunden hat. Ich konnte die Internetdienste nicht nach meinen Erwartungen und Bedürfnissen nutzen, und infolgedessen habe ich negative Emotionen, seelisches Leiden und Stress erlebt, was mich unter enormen Druck gesetzt hat. Die Schufa Holding AG verarbeitet, sammelt, manipuliert und handelt illegal mit meinen persönlichen Daten ohne meine Zustimmung, was als Verstoß gegen</p>"}, {"n": 9, "body": "<p>das Datenschutzgesetz (DSGVO), GDPR angesehen wird. Solches rechtswidriges Verhalten kann als Straftat betrachtet werden und zu strafrechtlichen Konsequenzen führen. Die Aktivitäten der Schufa Holding AG können auch als organisiert in Zusammenarbeit mit Vollstreckungsbeamten, Banken und Telekommunikationsunternehmen als Kartell verstanden werden, um ein Monopol auf dem Markt zu schaffen und Druck auf Schuldner auszuüben, ihre Verpflichtungen zu erfüllen. Solches Verhalten kann auch als Erpressung von Schuldnern angesehen werden und stellt Straftaten wie Erpressung, Kartellabsprachen oder Missbrauch einer marktbeherrschenden Stellung dar. Wenn ich meine Schulden nicht bezahle, bekomme ich kein Internet. Dies steht auch im krassen Widerspruch zu den guten Sitten. Es ist wichtig zu beachten, dass die DSGVO und andere Datenschutzgesetze klare Regeln für die Verarbeitung personenbezogener Daten festlegen, einschließlich der Tatsache, dass betroffene Personen darüber informiert werden müssen, wie und warum ihre Daten verarbeitet werden, und die Möglichkeit haben müssen, dieser Verarbeitung zu widersprechen. Ohne ihre informierte Zustimmung dürfen die Daten in keinem Fall verwendet werden, insbesondere nicht für Zwecke automatisierter individueller Entscheidungen. RICHTLINIE 2014/104/EU DES EUROPÄISCHEN PARLAMENTS UND DES RATES vom 26. November 2014 über bestimmte Vorschriften für Schadensersatzklagen nach nationalem Recht bei Verstößen gegen die Wettbewerbsrechtsvorschriften der Mitgliedstaaten und der Europäischen Union (4) Das aus dem Unionsrecht abgeleitete Recht auf Schadensersatz für Schäden, die durch Verstöße gegen das Unions- und nationale Wettbewerbsrecht verursacht wurden, erfordert, dass alle Mitgliedstaaten Verfahrensregeln haben, die die wirksame Ausübung dieses Rechts gewährleisten KAPITEL V Ermittlung der Schadenshöhe Artikel 17 Ermittlung der Schadenshöhe (1)  Die Mitgliedstaaten stellen sicher, dass die Beweislast und die Anforderungen an den Nachweis, die zur Feststellung der Schadenshöhe erforderlich sind, die Ausübung des Rechts auf Schadensersatz nicht praktisch unmöglich machen oder unangemessen erschweren. Die Mitgliedstaaten stellen sicher, dass die nationalen Gerichte befugt sind, die Schadenshöhe nach nationalen Verfahren zu schätzen, wenn festgestellt wurde, dass dem Kläger ein Schaden entstanden ist, es jedoch aufgrund der verfügbaren Beweise praktisch unmöglich oder unangemessen schwierig ist, die genaue Schadenshöhe festzustellen. (11) In Ermangelung von Rechtsvorschriften der Union richten sich Schadensersatzklagen nach den nationalen Regeln und Verfahren der Mitgliedstaaten. Nach der Rechtsprechung des Gerichtshofs der Europäischen Union (im Folgenden „Gerichtshof“) hat jeder das Recht, Schadensersatz zu verlangen, wenn ein Kausalzusammenhang zwischen dem Schaden und dem Verstoß gegen die Wettbewerbsrechtsvorschriften besteht.</p>"}, {"n": 10, "body": "<p>(13) Das Recht auf Schadensersatz wird allen natürlichen oder juristischen Personen zuerkannt, sei es Verbrauchern, Unternehmen oder öffentlichen Behörden, unabhängig vom Bestehen einer direkten vertraglichen Beziehung mit dem rechtswidrig handelnden Unternehmen und unabhängig davon, ob das rechtswidrige Verhalten zuvor von der Wettbewerbsbehörde festgestellt wurde. 5. Werte der EU Prioritäten der Europäischen Union für die Jahre 2024 – 2029 Ein freies und demokratisches Europa • Förderung europäischer Werte innerhalb der EU • Wahrung der europäischen Werte auf globaler Ebene Ein starkes und sicheres Europa • Sicherstellung einer kohärenten und einflussreichen Außenpolitik • Stärkung der Sicherheit und Verteidigung der EU und Schutz der EU-Bürger • Vorbereitung auf eine größere und stärkere Union • Förderung eines umfassenden Ansatzes für Migration und Grenzmanagement Ein wohlhabendes und wettbewerbsfähiges Europa • Stärkung der Wettbewerbsfähigkeit der EU • Erfolgreiche Umsetzung der grünen und digitalen Transformation • Förderung eines innovations- und unternehmensfreundlichen Umfelds • Gemeinsamer Fortschritt 1. Wie schützt uns die Union, wenn die stärksten Staaten wie Deutschland Menschenrechte verletzen, ihre Bürger betrügen und uns belügen, wie sie uns schützen? 2. Wie will die Union unsere Wettbewerbsfähigkeit stärken, wenn der betrügerische Mega-Kartell Schufa Telekom sogar von der Kommissionspräsidentin Ursula von der Leyen unter den Teppich gekehrt wird, wenn das Kartell das Gegenteil von Wettbewerbsfähigkeit ist? 3. Und wie schützt die Union Menschenrechtsverteidiger, wenn die Regierung mich zu verfolgen begonnen hat?</p><p>Agentur der Europäischen Union für Grundrechte (FRA) Die Agentur der Europäischen Union für Grundrechte (FRA) bietet unabhängige, evidenzbasierte Beratung für europäische und nationale politische Entscheidungsträger an. Dadurch trägt sie dazu bei, dass Diskussionen, Politiken und Rechtsvorschriften zu Grundrechten auf einer kritischen Masse an Beweisen basieren und zielgerichtet sind. Úlohy</p>"}, {"n": 11, "body": "<p>Die Agentur bietet Beratung für EU-Institutionen und Regierungen zu Grundrechten an, hauptsächlich in folgenden Bereichen: • diskriminácia, !!! ▪ prístup k spravodlivosti, !!! ▪ rasizmus a xenofóbia, ▪ ochrana údajov, !!! ▪ práva obetí, ▪ práva detí. Der Zweck der Agentur besteht darin, die wirksamere Förderung und den Schutz der Grundrechte in der gesamten EU zu unterstützen. Zu diesem Zweck berät sie ihre Partner und arbeitet mit ihnen zusammen bei: • Sammeln und Analysieren von Informationen und Daten durch sozialrechtliche Forschung, • Bereitstellung von Hilfe und fachlicher Beratung, • Kommunikation und Sensibilisierung für Rechte. Wozu und wem dienen diese Agenturen und Gesetze, wenn die Europäische Kommission tut, was sie will, und die Verletzung der Menschenrechte und des Datenschutzgesetzes ignoriert, wie es die Kommissionspräsidentin Ursula von der Leyen tut? Es ist klar, dass sie diesen Betrug unter den Teppich kehren will, da sie aufgrund ihrer Herkunft mit Deutschland im Einklang steht, was einen Interessenkonflikt darstellt! Ist das die Art und Weise, wie sie (FRA) kommunizieren, dass von der Leyen sich weigert, mit mir zu kommunizieren? Die EU sollte wettbewerbsfähig sein und keine Monopole schaffen! Als Beweis füge ich eine E-Mail an Frau von der Leyen bei.</p><p>5. Vorschlag für eine Entscheidung • Antrag</p><p>Gemäß den Gesetzen und Vorschriften wurden meine Rechte verletzt, und daher fordere ich Schadensersatz. Gemäß Artikel 82 der DSGVO habe ich Anspruch auf Schadensersatz für Schäden, die durch die unrechtmäßige Verarbeitung meiner personenbezogenen Daten entstanden sind. Ich fordere eine Entschädigung für den Zeitverlust, den ich bei der Aufdeckung dieses Betrugs erlitten habe, für psychische Schäden, lebenslange Traumata und Diebstähle, die die beklagten Betrüger an mir und an den Massen der deutschen Bürger, einschließlich Ihnen, Herr Richter, durch die unrechtmäßige Nichtbereitstellung einer grundlegenden Internetverbindung und überhöhte Preise für die angebotenen Dienstleistungen aufgrund des bestehenden Kartells zwischen den Telekommunikationsunternehmen begangen haben und weiterhin begehen. Das Kartell führt aufgrund des Fehlens von Wettbewerb zu hohen Preisen.</p><p>Weiterhin fordere ich ein schriftliches Entschuldigungsschreiben an meine Person für das Trauma, das ich seit mehreren Jahren ertragen muss.</p>"}, {"n": 12, "body": "<p>6. Schlussfolgerung</p><p>Sehr geehrtes Gericht, in diesem Dokument (Klage) beschreibe ich den Sachverhalt des Betrugs und Diebstahls, den die oben genannten Unternehmen an mir angewendet haben und weiterhin anwenden, in verkürzter Form, nur um Ihnen einen Überblick über den gesamten Betrug zu geben, den diese Unternehmen begehen. Alle weiteren detaillierten Informationen sind ausführlich in den Anhängen der Strafanzeigen und Beschwerden an die Europäische Kommission beschrieben, die dieser Klage als PDF-Dateien beigefügt sind und sowohl mit einer handschriftlichen Unterschrift als auch mit einer QES-unsichtbaren Unterschrift, einschließlich dieser Klage, unterzeichnet sind.</p><p>Ich fordere das Landgericht Landshut auf, den Betrug der beklagten Unternehmen aus den oben genannten rechtswidrigen Gründen zu beenden und sie zu verpflichten, meinen Schadenersatz durch einen Zahlungsbefehl zu leisten. Die Deutsche Telekom AG betrügt täglich die 84.552.242 Millionen Menschen umfassende Nation, die an der Spitze des technologischen Fortschritts steht, und das am helllichten Tag, was man nicht so leicht sieht, einschließlich Ihnen und Ihrer Familie, Herr/Frau Richter/in. Und das alles wegen des KARTELLS, Schufa, Telekommunikationsunternehmen, Gerichtsvollzieher und aller deutschen Banken.</p><p>In Kumhausen 2.10.2024                                  Peter Ferenc .........................</p>"}]}, "en": {"title": "Lawsuit against Deutsche Telekom AG and Schufa Holding AG", "pages": [{"n": 1, "body": "<p>English version: „Plaintiff“ Peter Ferenc Rammelkam 2, Kumhausen Deutschland +49 157 317 33332 info@foxprof.club</p><p>in Kumhausen 2.10.2024</p><p>• Lawsuit for Damages</p><p>1. „Defendant“</p><p>• Deutsche Telekom AG Friedrich-Ebert-Allee 140, 53113 Bonn Germany. IČO (Obchodný register)**: HRB 6794 (District Court in Bonn), USt-IdNr. DE 123475223, impressum@telekom.de, GD Timotheus Höttges und • Schufa Holding AG, Kormoranweg 5, 65201 Wiesbaden, Germany. Business ID (Commercial register)**: Not publicly available, TIN (Tax Identification Number)**: DE87ZZZ00000239351</p><p>2. „Subject of the Complaint “ Žaloba sa týka porušenia GDPR a ľudských práv zo strany Deutsche Telekom AG. A preto žalujem vyššie uvedené spoločnosti o náhradu škody spôsobenej podvodným konaním voči mojej osobe na zaplatenie 500 000€ pre každého osobitne, aby súd každého z nich zaviazal uvedenú čiastku zaplatiť na môj účet v Slovenskej sporiteľni: IBAN: SK59 0900 0000 0052 0995 7308 BIC: GIBASKBX.</p><p>3. „Factual allegations“</p><p>• Description of the event: Amtsgericht Landshut Maximilianstraße 22 84028 Landshut Deutschland</p>"}, {"n": 2, "body": "<p>In assessing my application for a fixed internet connection in July on an unspecified day in 2022, Deutsche Telekom AG (hereinafter referred to as Telekom) has used and continues to use my personal data unlawfully through automated individual processing (decision-making), based on the fraudulent trick of the fraudulent agency Schufa with the “creditworthiness” of the consumer without their informed consent (the consumer). My fundamental Union right to internet access is being violated by the provider Deutsche Telekom AG. The government, which covers up this mega cartel fraud, is depriving me not only of internet access, thereby violating my fundamental human rights, including the right to internet access! Moreover, it has forced me to purchase internet data for €108 per month through a 5G SIM prepaid from Telekom, for which I have evidence included in the Complaint to the European Commission, which is attached to this lawsuit! Unlimited data is vital for me as I need to learn English on a daily basis, which is essential for my further professional growth. • Evidence: Detailed evidence is included in the attachments to this lawsuit in PDF format, which must be reviewed by the assigned judges. Here is the list of PDF files: 1. Strafrechtliche Mitteilung_Telekom and Schufa_sharp_Deutsch_fy.pdf 2. Strafrechtliche Mitteilung_Telekom_Altstadt_Angestellter 1_with_QES.pdf 3. Strafrechtliche Mitteilung über GP Peter Frank_with_signature_QES.PDF 4. CS Complaint form request_0_koncept_ostrý_nahlásenie EU komisii podvod_with_QES.pdf 5. Anzeige über Schindler_unterschrift_signed_with_QES.pdf 6. Benachrichtigung der Telekom Mitarbeitern  Telekom 94-95 Altstadt_with_QES.pdf</p><p>7. „Legal grounds“</p><p>• Breach of the law:</p><p>The main issue is the violation of the law protecting my personal consumer data and the universal law (service) for internet access without restriction and discrimination, §78 TKG. Telekommunikationsgesetz (TKG): § 78 (Universal Service): This paragraph stipulates that providers of public telecommunications services must ensure that all end users have access to available and quality electronic communications services, including basic internet access. Providers must not discriminate against any user and must ensure that services are provided at a reasonable price. However, a price of €108 per month for a quality of 20Mbit/s transmission speed and unstable connection is unacceptable and beyond any tolerance.</p>"}, {"n": 3, "body": "<p>In general, no one can restrict a consumer’s right to access the internet, as it is their fundamental right and freedom, which prevails over any “legitimate” interests of the provider! The data subject has the right not to be subject to a decision based solely on Automated Individual Decision-Making (processing) of data, including profiling, which produces legal effects concerning them or similarly significantly (negatively) affects them (GDPR)!!! If the processing is based on consent, the controller must be able to demonstrate that the data subject has given consent to the processing of their personal protected data. And this is also not being adhered to. Therefore, if Telekom wants to use Automated Individual Decision-Making when a consumer requests internet access, it is obliged to obtain the consumer’s informed consent!!!</p><p>According to Article 6 of the GDPR, Deutsche Telekom AG has violated my data protection rights. The GDPR provides individuals with the right to be informed about the existence of Automated Individual Decision-making, its logic, and consequences.</p><p>Telekom has not provided me with this option, does not provide it, and arbitrarily applies the regime of illegal Automated Individual Decision-Making when assessing the request for internet connection (services) as it does not provide me with any opportunity to express my disagreement with the use of Automated Decision-Making, nor does it inform me of any consequences of its use. My informed consent was not obtained, and it behaves as if the laws do not exist for it!!! And last but not least, it concerns the consumer data protection law, which these companies violate by selling insolvency information from executors. Schufa Holding AG sells this information (for financial gain) to telecommunications companies for processing Automated Individual Decision- Making in the form of alleged (fraudulent) creditworthiness of the consumer- applicant for internet connection, without the consumer’s informed consent. So what is the point of the data protection law then?</p><p>Telecom made an Automated Individual Decision based on which it refused to provide me with internet services, as a result of which I had to purchase a 5G ZTE 5001 router and a 5G SIM card to receive internet signal and connect to the “internet” service. The price of the device was approximately €300. The price for the SIM card for 28 days is €100, so my monthly costs for operating this device are higher by: €108 - €40 = €68!!! These are significant negative consequences and costs for me!! Not to mention that the value of the internet connection via DSL is overpriced by 170%. The real price should be no more than €20/month and not €40-45 due to the cartel!!! If the internet cost what it should, up to €20, it would be 440% overpriced. This also means that I am being discriminated against!!! This clearly shows that Telekom is at a disadvantage and that every citizen of the Federal Republic of Germany is being robbed by it.</p>"}, {"n": 4, "body": "<p>And as if by magic, it is now possible to pay with a Slovak bank via automated transfer. These are wonders when you have to pay for an internet that is overpriced by more than 440% due to cartel fraud. It is no longer a requirement to have a German bank when applying for an internet connection with Telekom!!! That condition simply disappeared along the way!!! A cartel agreement, i.e., an agreement between two or more competitors to coordinate their competitive behavior in the market or to influence relevant competition parameters through practices such as setting or coordinating sales prices in the market, is called a cartel and is a violation of competition law, i.e., “unfair commercial practices and unjust enrichment. ” So logically, Telekom has no legal basis under Article 6 (1)(f) of the GDPR to refuse me internet services due to possible excessive indebtedness. The overpriced internet that I have to pay €108 for far exceeds the potential loss from not paying my last billing amount of €40/month for Telekom’s DSL connection. This logically means that I am getting more indebted each month due to Telekom and its fraud against me, not Telekom. Not to mention that to meet the legal basis that Telekom needs to apply AIR, there are legally established conditions: Legal obligations and legitimate interest are two different legal bases under which organizations can process personal data according to the General Data Protection Regulation (GDPR) and the Bundesdatenschutzgesetz (BDSG). ❖ Legal obligations</p>"}, {"n": 5, "body": "<p>Legal obligations Legal obligations mean that an organization must process personal data to fulfill its legal duties. This can include: • Tax obligations: Processing data for tax return purposes. • Accounting: Maintaining records as required by law. • Security: Ensuring compliance with safety regulations and directives. Legitimate interest Legitimate interest is a more flexible legal basis that allows the processing of personal data if it is necessary for the legitimate interests of the organization or a third party, provided these interests do not override the rights and freedoms of the individual. Examples include: • Fraud prevention: Processing data to identify and prevent fraud. • Marketing: Using data for direct marketing purposes. • IT security: Ensuring the security of networks and information systems. As can be seen, neither Legal obligations nor Legitimate interest includes the right to manipulate, trade, or otherwise provide my legally protected personal data by Schufa Holding AG to third parties such as Deutsche Telekom AG without my informed consent for further Automated Individual Decisions by Telekom. ➢ Description of reasons for compensation Due to the misuse of my personal data obtained by Schufa in an illegal manner, which you provided to third parties such as telecommunications companies without my consent for the processing of my personal data for Automated Informed Processing and Decisions by telecommunications companies for providing internet services, you have harmed my rights to access internet services in the EU, which led to the refusal to provide basic internet services by telecommunications and internet service providers.</p><p>➢ EU rules on open internet Open Internet (source: here...) EU rules on open internet provide you as a user with the right to access and distribute any online content and services of your choice. Your internet provider cannot block, slow down, or discriminate against any online content, applications, or services except in 3 specific cases: • To comply with legal obligations, such as a court order to block specific illegal content</p>"}, {"n": 6, "body": "<p>• To maintain network security and integrity, for example, to combat viruses or malware • To manage exceptional or temporary network congestion</p><p>REGULATION (EU) 2015/2120 OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL (source: here...) (1) The aim of this Regulation is to establish common rules to ensure equal and non-discriminatory treatment of traffic in the provision of internet access services and related end-user rights. Its goal is to protect end-users while simultaneously guaranteeing the continuous functioning of the internet ecosystem as an engine of innovation. (6) End-users should have the right to access and distribute information and content, and to use and provide applications and services without discrimination, via their internet access service. (7) To exercise their rights to access and distribute information and content, as well as to use and provide applications and services of their choice, end-users should be able to agree with internet access service providers on tariffs for specific data volumes and speeds of the internet access service. National regulatory authorities and other competent authorities should have the power to intervene against agreements (cartels) or (unfair) commercial practices that, due to their scale, lead to situations where the choice of end-users is significantly restricted in practice (my case). (8) In providing internet access services, providers of these services should treat all traffic equally, without discrimination, restriction, or interference, regardless of the sender or receiver, content, application, or service, or terminal equipment.</p><p>➢ Open Internet (source.:  here...) Internet providers are required to treat all traffic equally when providing internet access services: • without discrimination, restriction, or interference; and • irrespective of: o the sender and receiver; o the content accessed or distributed; or o the applications or services used. Providers may use reasonable traffic management measures, but these must be transparent, non-discriminatory, proportionate, and not based on commercial reasons. For these reasons, I have been unable to use internet services for an extended period for:</p>"}, {"n": 7, "body": "<p>• Job opportunities : In today’s digital age, internet access is often essential for job searching and applying for positions, which is critical for professional development in society. • Communication with authorities : Many government services and communications are now conducted online, meaning that without internet access, we are at a disadvantage. • Business activities : For entrepreneurs, internet access is crucial for managing their business, marketing, and communicating with customers. • Studying English : Education and personal development, including language studies, are directly dependent on online resources and courses. The internet is key for me to learn English, as it provides immediate feedback and audio -video recordings for learning pronunciation in combination with grammar studies</p><p>These points clearly show how internet access can be considered a basic need and fundamental right, enabling individuals to fully participate in society and the economy. My personal data was misused by Schufa and Telekom to maliciously and insidiously prevent access to telecommunications companies’ internet services, which led to the restriction of my access to internet services, a serious violation of my rights to free internet access. In connection with the violation of my human rights and freedoms, I have suffered emotionally and experienced negative emotions, causing me mental and psychological distress. I have experienced anxiety, frustration, depression, and an inability to concentrate, which has tied my hands. I could not use internet services according to my expectations and needs, and as a result, I experienced negative emotions, mental suffering, and stress, putting me under enormous pressure. Schufa Holding AG illegally processes, collects, manipulates, and trades my personal data without my consent, which is considered a violation of the Data Protection Act (DSGVO), GDPR, and such illegal behavior can be considered a criminal offense and lead to criminal consequences. The activities of Schufa Holding AG can also be understood as organized in cooperation with executors, banks, and telecommunications companies as a CARTEL, with the aim of creating a monopoly in the market and putting pressure on debtors to pay off their obligations. Such behavior can also be considered extortion of debtors, which are criminal offenses such as extortion, cartel agreements, or abuse of</p>"}, {"n": 8, "body": "<p>dominant market position. If I do not pay my debts, I will not get internet. This is also in stark contrast to good morals. It is important to note that the GDPR and other data protection laws set clear rules regarding the processing of personal data, including that data subjects must be informed about how and why their data is processed and must have the opportunity to object to this processing. Without their informed consent, their data cannot be used in any case, especially not for the purposes of automated individual decision-making. DIRECTIVE 2014/104/EU OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL of 26 November 2014 on certain rules governing actions for damages under national law for infringements of the competition law provisions of the Member States and of the European Union. (4) “The right to compensation for damage caused by breaches of Union and national competition law requires that all Member States have procedural rules that ensure the effective exercise of this right. ” Chapter V Determination of the Amount of Damage Article 17 Determination of the Amount of Damage 1. Member States shall ensure that the burden of proof and the requirements for proving the amount of damage do not make it practically impossible or excessively difficult to exercise the right to compensation. Member States shall ensure that national courts have the power to estimate the amount of damage in accordance with national procedures if it is established that the claimant has suffered damage, but it is practically impossible or excessively difficult to precisely determine the amount of damage based on the available evidence. (11) In the absence of Union legislation, claims for compensation are governed by the national rules and procedures of the Member States. According to the case law of the Court of Justice of the European Union (hereinafter referred to as the “Court of Justice”), everyone has the right to claim compensation for damage suffered if there is a causal link between the damage and the breach of competition law. (13) The right to compensation for damage is granted to all natural or legal persons, whether consumers, businesses, or public authorities, regardless of the existence of a direct contractual relationship with the unlawfully acting enterprise and regardless of whether the unlawful conduct was previously established by a competition authority. 8. EU Values Priorities of the European Union for 2024 – 2029</p>"}, {"n": 9, "body": "<p>Free and Democratic Europe • Promoting European values within the EU • Upholding EU values at the global level Strong and Secure Europe • Ensuring cohesive and influential external action • Strengthening EU security and defense and protecting EU citizens • Preparing for a larger and stronger Union • Promoting a comprehensive approach to migration and border management</p><p>Prosperous and Competitive Europe • Strengthening EU competitiveness • Successfully implementing the green and digital transformation • Supporting an environment conducive to innovation and entrepreneurship • Collective progress 1. How does the Union ensure the protection of citizens if the strongest states like Germany violate human rights, deceive their citizens, and lie to us about protecting us? 2. How does the Union intend to strengthen competitiveness when the fraudulent Mega cartel Schufa Telekom is being swept under the rug even by the President of the European Commission, Ursula von der Leyen, when a cartel is the opposite of competitiveness? European Union Agency for Fundamental Rights (FRA) The EU Agency for Fundamental Rights (FRA) provides independent, evidence-based advice to European and national policymakers, thereby contributing to ensuring that discussions, policies, and legislation on fundamental rights are based on a critical mass of evidence and are targeted. Tasks The Agency provides advice to EU institutions and governments on fundamental rights, particularly in the following areas: • Discrimination • Access to justice • Racism and xenophobia • Data protection • Victims’ rights • Children’s rights</p>"}, {"n": 10, "body": "<p>The purpose of the agency is to assist in the more effective promotion and protection of fundamental rights throughout the EU. To this end, it consults and collaborates with its partners in: • Collecting and analyzing information and data through socio-legal research • Providing assistance and expert advice • Communicating and raising awareness of rights!!! What is the purpose of these agencies and who do they serve if the European Commission does whatever it wants and ignores violations of human rights and consumer data protection laws, as does the President of the European Commission, Ursula von der Leyen? There is a clear intention to sweep this fraud under the rug, as she is in harmony with Germany due to her origin, creating a conflict of interest!!! Is this how they teach communication (FRA), that Leyen refuses to communicate with me? The EU should be competitive, not creating monopolies!!! As evidence, I attach an email addressed to Ms. Leyen.</p><p>8. Draft Decision</p><p>• Request: According to laws and regulations, my rights have been violated, and therefore I request compensation. According to Article 82 of the GDPR, I am entitled to compensation for damages caused by the unauthorized processing of my personal data. I demand compensation for the time lost in uncovering this fraud, psychological harm, lifelong trauma, and theft committed and still being committed by the defendants against me and the masses of German citizens, including you, Mr. Judge, by unlawfully denying basic internet access and charging excessive prices for services due to the existing cartel among telecommunications companies. The cartel leads to high prices due to the lack of competition. Furthermore, I demand a written apology letter for the trauma I have been forced to endure for several years.</p><p>9. Conclusion</p><p>Dear Court, in this document (Lawsuit), I describe the factual situation of fraud and theft that the aforementioned companies have applied and continue to apply to me in a limited form only to give you an overview of the entire fraud these companies are committing. All other detailed information is extensively described in the attachments of Criminal Complaints and Complaints to the European Commission, which are attached to this lawsuit in PDF formats and are signed by hand with a physical signature and also with a QES invisible signature, including this lawsuit. I also call on the Landshut court to order the defendant companies to cease this fraud for the above-mentioned illegal reasons for its application and to oblige them to pay my compensation by payment order. The company Deutsche Telekom AG robs the 84,552,242 million nation, which is at the</p>"}, {"n": 11, "body": "<p>forefront of technological progress, every day in broad daylight by violating human rights, and this is not easily seen, including you and your family, Mr. Judge/Mrs. Judge.</p><p>In Kumhausen 2.10.2024                                  Peter Ferenc .........................</p>"}]}, "sk": {"title": "Žaloba proti Deutsche Telekom AG a Schufa Holding AG", "pages": [{"n": 1, "body": "<p>Slowak version: „Žalobca“ Peter Ferenc Rammelkam 2, Kumhausen Deutschland +49 157 317 33332 info@foxprof.club</p><p>in Kumhausen 2.10.2024</p><p>Žaloba.</p><p>4. „Žalovaný“</p><p>• Deutsche Telekom AG Friedrich-Ebert-Allee 140, 53113 Bonn Germany. IČO (Obchodný register)**: HRB 6794 (Okresný súd v Bonne) und • Schufa Holding AG, Kormoranweg 5, 65201 Wiesbaden, Germany. IČO (Obchodný register)**: Nie je verejne dostupné, **DIČO (Daňové identifikačné číslo)**: DE87ZZZ00000239351</p><p>5. „Predmet žaloby“ Žaloba sa týka porušenia GDPR a ľudských práv zo strany Deutsche Telekom AG. A preto žalujem vyššie uvedené spoločnosti o náhradu škody spôsobenej podvodným konaním voči mojej osobe na zaplatenie 500 000€ pre každého osobitne, aby súd každého z nich zaviazal uvedenú čiastku zaplatiť na môj účet v Slovenskej sporiteľni: IBAN: SK59 0900 0000 0052 0995 7308 BIC: GIBASKBX.</p><p>6. „Skutkové tvrdenia“</p><p>• Opis udalosti: Pri posudzovaní mojej žiadosti o pevné pripojenie na internet v júli v presne nezistený deň roku 2022 použil a stále používa Deutsche Telekom AG (ďalej len Telekom) neoprávnene spracovala moje osobné údaje formou Automatizovaného Amtsgericht Landshut Maximilianstraße 22 84028 Landshut Deutschland</p>"}, {"n": 2, "body": "<p>individuálneho spracovania,  (rozhodnutia), ktorého základom je použitie podvodného triku podvodnej agentúry Schufa s „BONITOU“ spotrebiteľa bez jeho informovaného súhlasu (spotrebiteľa). Je porušené moje základné Unijné právo a to právo na prístup na internet poskytovateľom Deutsche Telekom AG. Vláda, ktorá kryje tento Mega kartelový podvod ma okráda nielen o pripojenie na internet, čím porušuje moje základné ľudské práva a to právo na pripojenie na internet!!! A nielen to, prinútila ma kupovať internetové dáta za 108€/mesiac cez 5G SIM pre-paid od Telekomu, na čo mám aj dôkazy, ktoré sú uvedené v Sťažnosti na EK, ktorá je prílohou tejto žaloby!! Neobmedzené dáta sú pre mňa životne dôležité, nakoľko sa potrebujem učiť anglický jazyk na dennej báze, ktorý potrebujem pre môj ďalší profesionálny rast. • Dôkazy: Detailné dôkazy sú v prílohách tejto žaloby vo formátoch PDF, ktoré si treba naštudovať konkrétnym prideleným sudcom. Tu je zoznam súborov pdf: 10. Strafrechtliche Mitteilung_Telekom and Schufa_sharp_Deutsch_fy.pdf 11. Strafrechtliche Mitteilung_Telekom_Altstadt_Angestellter 1_with_QES.pdf 12. Strafrechtliche Mitteilung über GP Peter Frank_with_signature_QES.PDF 13. CS Complaint form request_0_koncept_ostrý_nahlásenie EU komisii podvod_with_QES.pdf 14. Anzeige über Schindler_unterschrift_signed_with_QES.pdf 15. Benachrichtigung der Telekom Mitarbeitern  Telekom 94-95 Altstadt_with_QES.pdf</p><p>16. „Právne dôvody“</p><p>• Porušenie zákona:</p><p>Ide hlavne o porušenie zákona na ochranu mojich chránených osobných údajov spotrebiteľa a univerzálneho zákona (služby) na pripojenie na internet bez obmedzenia a diskriminácie §78 TKG. Telekommunikationsgesetz (TKG): § 78 (Univerzálna služba): Tento paragraf stanovuje, že poskytovatelia verejných telekomunikačných služieb musia zabezpečiť, aby všetci koncoví užívatelia mali prístup k dostupným a kvalitným službám elektronických komunikácií, vrátane základného prístupu k internetu. Poskytovatelia nesmú diskriminovať žiadneho užívateľa a musia zabezpečiť, aby služby boli poskytované za primeranú cenu. No a cena 108€/mesiac v kvalite 20Mbit/s prenosovej rýchlosti a nestabilného pripojenia je neprijateľná a za hranicou akejkoľvek tolerancie.</p><p>Čiže obecne vzato, nikto nemôže spotrebiteľa obmedziť na jeho práve k prístupu k internetu, lebo je to jeho základné právo a sloboda a prevyšuje nad akékoľvek „oprávnené“ záujmy poskytovateľa! Dotknutá osoba má právo na to, aby sa na ňu !!nevzťahovalo!! rozhodnutie, ktoré je založené výlučne na !!Automatizovanom</p>"}, {"n": 3, "body": "<p>Individuálnom Rozhodovaní (spracúvaní) údajov!!, vrátane profilovania a ktoré má právne účinky, ktoré sa jej týkajú alebo ju podobne významne (negatívne) ovplyvňujú (GDPR)!!! Ak je spracúvanie založené na súhlase, prevádzkovateľ musí vedieť preukázať, že dotknutá osoba vyjadrila súhlas so spracúvaním svojich osobných chránených údajov. No a toto sa taktiež vôbec nedodržuje. Čiže ak by chcel použiť Telekom pri žiadosti spotrebiteľa o internetové pripojenie Automatizované Individuálne Rozhodnutie, je povinný požiadať spotrebiteľa o jeho informovaný súhlas!!!</p><p>Podľa článku 6 GDPR spoločnosť Deutsche Telekom AG porušila moje práva na ochranu osobných údajov. GDPR poskytuje jednotlivcom právo byť informovaní o existencii automatizovaného individuálneho rozhodnutia, jeho logike a dôsledkoch. Telekom mne túto možnosť neposkytol, neposkytuje a svojvoľne si uplatňuje aplikovanie režimu nezákonného Automatizovaného Individuálneho Rozhodnutia pri posudzovaní žiadosti o internetové pripojenie (služby) nakoľko mi neposkytuje žiadnu možnosť vyjadriť môj nesúhlas k použitiu Automatizovaného rozhodnutia, lebo ma ani neinformuje o nejakých dôsledkoch jeho použitia. Môj informovaný súhlas nezískal a správa sa akoby preňho zákony ani neexistovali!!! No a v neposlednom rade ide o zákon na  ochranu osobných údajov spotrebiteľa, ktorý tieto spoločnosti porušujú tým, že informáciu o insolventnosti od exekútorov, spoločnosť Schufa Holding AG predáva (za finačný prospech) na spracovanie telekomunikačným spoločnostiam v elektronickej forme cez internet na spracovanie Automatizovaného Individuálního Rozhodnutia formou údajnej bonity (podvodnej) spotrebiteľa-žiadateľa o pripojenie na internet a to bez informovaného súhlasu spotrebiteľa. Tak načo je potom zákon na ochranu osobných údajov?</p><p>Telecom uskutočnil automatizované individuálne rozhodnutie na základe ktorého mi odmietol poskytnúť internetové služby v dôsledku čoho som si musel zakúpiť router 5G ZTE 5001 a 5G SIM kartu na príjem internetového signálu a pripojenia k službe „internet“ . Cena zariadenia bola cca 300€. Cena za SIM kartu na 28 dní je 100€ čiže mesačné náklady 108€ na prevádzku tohto zariadenia mám vyššie o : 108€ - 40€ = 68€!!! Toto sú pre mňa značné negatívne dôsledky a teda aj náklady!! Nehovoriac o tom, že hodnota internetového pripojenia cez DSL je predražená 170%. Čiže reálna cena by mala byť nie viac ako 20€/ mesiac a nie 40€-45€ z dôvodu kartelu!!! Ak by stál internet ako má stáť do 20€, tak by to bolo 440% predražené. A to taktiež znamená, že som  diskriminovaný!!! Z tohto jasne vyplýva, že Telekom ťahá za kratší koniec a že je ním okrádaný každý občan Spolkovej krajiny Nemecka.</p>"}, {"n": 4, "body": "<p>A ako zázrakom, ide zrazu platiť aj Slovenskou bankou automatizovaným prevodom. To sú divy, keď treba zaplatiť o viac ako 440% predražený internet kvôli kartelovému podvodu. Už nie je podmienkou Nemecká banka pri žiadosti o internetové pripojenie u Telekomu!!! Tá podmienka sa jednoducho cestou vyparila!!! Kartelová dohoda a teda jednanie vo vzájomnej zhode medzi dvoma či viacerými súťažiacimi s cieľom koordinovať ich súťažné chovanie na trhu alebo ovplyvňovať príslušné parametre hospodárskej súťaže a to prostredníctvom praktík, ako je mimo iného stanovovanie či koordinácia predajných cien na trhu sa nazýva kartel a je to porušenie právnych predpisov hospodárskej súťaže, čiže „nekalé obchodné praktiky a neoprávnené obohacovanie“ . Takže logicky Telekom nedisponuje žiadnym právnym základom čl. 6 ods. 1 písm. f) GDPR, aby z dôvodu možného nadmerného zadlženia mi ako spotrebiteľovi odmietol poskytnúť internetové služby. Pretože predražený internet ktorý musím zaplatiť 108€ vysoko prevyšuje možnú stratu pri nezaplatení mojej poslednej fakturačnej čiastky 40€/mesiac DSL pripojenia Telekomu. Z tohto logicky vyplýva, že ja sa vďaka Telekomu a jeho podvodu na mne ešte viacej každý mesiac zadlžujem a nie Telekom. Nehovoriac o tom, že na splnenie právneho základu, ktorý potrebuje Telekom na aplikovanie AIR sú zákonom stanovené podmienky: Právne povinnosti a oprávnený záujem sú dva rôzne právne základy, na základe ktorých môžu organizácie spracovávať osobné údaje podľa General Data Protection Regulation (GDPR) a Bundesdatenschutzgesetz (BDSG).</p>"}, {"n": 5, "body": "<p>❖ Právne povinnosti Právne povinnosti znamenajú, že organizácia musí spracovávať osobné údaje, aby splnila svoje zákonné povinnosti. To môže zahŕňať: • Daňové povinnosti: Spracovanie údajov na účely daňového priznania. • Účtovníctvo: Udržiavanie záznamov podľa zákona. • Bezpečnosť: Zabezpečenie súladu s bezpečnostnými predpismi a nariadeniami. Oprávnený záujem Oprávnený záujem je flexibilnejší právny základ, ktorý umožňuje spracovanie osobných údajov, ak je to nevyhnutné pre oprávnené záujmy organizácie alebo tretej strany, pokiaľ tieto záujmy neprevážia nad právami a slobodami jednotlivca. Príklady zahŕňajú: • Predchádzanie podvodom: Spracovanie údajov na identifikáciu a prevenciu podvodov. • Marketing: Používanie údajov na priame marketingové účely. • Bezpečnosť IT: Zabezpečenie bezpečnosti sietí a informačných systémov Ako je vidieť, ani pod Právne povinnosti a ani pod Oprávnený záujem nespadá právo manipulovať, obchodovať či akokoľvek poskytovať spoločnosťou Schufa Holding AG moje osobné zákonom chránené údaje tretím stranám ako je Deutsche Telekom AG bez môjho informovaného súhlasu na ďalšie Automatizované individuálne rozhodnutia spoločnosťou Telekom. ➢ Popis dôvodov na odškodnenie Z dôvodu zneužitia mojich osobných údajov získaných spoločnosťou Schufa nezákonným spôsobom ktoré ste poskytli tretím stranám ako sú telekomunikačné spoločnosti bez môjho akéhokoľvek súhlasu na spracovanie mojich osobných údajov na Automatizované informované spracovanie a rozhodnutia telekomunikačných spoločností pre poskytovanie internetových služieb, ste ma poškodili na mojich právach o prístupe k internetovým službám v EÚ čo viedlo k odmietnutiu poskytnutia základných internetových služieb zo strany telekomunikačných a internetových služieb telekomunikačných spoločností. ➢ Pravidlá EÚ o otvorenom internete. Otvorený internet (zdroj: tu...) Pravidlá EÚ o otvorenom internete vám ako používateľovi poskytujú právo na prístup k akémukoľvek online obsahu a službám, ktoré si vyberiete, a/alebo na ich distribúciu. Váš poskytovateľ internetu nemôže blokovať, spomaľovať ani diskriminovať akýkoľvek online obsah, aplikácie alebo služby s výnimkou 3 osobitných prípadov:</p>"}, {"n": 6, "body": "<p>• na splnenie zákonných povinností, ako je súdny príkaz na zablokovanie konkrétneho nezákonného obsahu • na zachovanie bezpečnosti a integrity siete, napríklad na boj proti vírusom alebo malvéru • na zvládnutie výnimočného alebo dočasného preťaženia siete</p><p>➢ NARIADENIE EURÓPSKEHO PARLAMENTU A RADY (EÚ) 2015/2120 (zdroj: tu...) (1) Cieľom tohto nariadenia je stanoviť spoločné pravidlá na zabezpečenie rovnakého a nediskriminačného zaobchádzania s prevádzkou pri poskytovaní služieb prístupu k internetu a súvisiacich práv koncových užívateľov. Jeho cieľom je chrániť koncových používateľov a zároveň zaručiť nepretržité fungovanie internetového ekosystému ako motora inovácií. (6) Koncoví užívatelia by mali mať právo na prístup k informáciám a obsahu a na ich šírenie a právo využívať a poskytovať aplikácie a služby bez diskriminácie prostredníctvom svojej služby prístupu k internetu. (7) Aby koncoví užívatelia mohli uplatňovať svoje práva na prístup k informáciám a obsahu a na ich šírenie, ako aj na používanie a poskytovanie aplikácií a služieb podľa vlastného výberu, mali by mať možnosť dohodnúť sa s poskytovateľmi služieb prístupu k internetu na tarifách za konkrétne objemy dát a rýchlosti služby prístupu k internetu. Národné regulačné orgány a iné príslušné orgány by mali mať právomoc zasiahnuť proti dohodám (kartelom) alebo (nekalým) obchodným praktikám, ktoré z dôvodu svojho rozsahu vedú k situáciám, keď je voľba koncových používateľov v praxi podstatne obmedzená (môj prípad). (8) Pri poskytovaní služieb prístupu k internetu by poskytovatelia týchto služieb mali zaobchádzať s každou prevádzkou rovnako, bez diskriminácie, obmedzenia alebo zasahovania, nezávisle od odosielateľa alebo príjemcu, obsahu, aplikácie alebo služby alebo koncového zariadenia.</p><p>➢ Otvorený prístup na internet (zdroj.: tu...)</p>"}, {"n": 7, "body": "<p>Poskytovatelia internetu sú povinní zaobchádzať so všetkými prevádzkami rovnako, keď poskytujú služby prístupu k internetu: • bez diskriminácie, obmedzenia alebo zasahovania; a • bez ohľadu na: odosielateľ a príjemca; • obsah, ku ktorému sa pristupuje alebo ktorý sa distribuuje; alebo použité aplikácie alebo služby. Poskytovatelia môžu používať primerané opatrenia na riadenie prevádzky, ktoré však musia byť transparentné, nediskriminačné, primerané a nesmú byť založené na obchodných dôvodoch. Z týchto dôvodov som nemohol dlhodobo využívať internetové služby na: • Získavanie pracovných príležitostí o V dnešnej digitálnej dobe je prístup k internetu často nevy hnutný na hľadanie práce a aplikovanie na pracovné pozície, čo je v dnešnej dobe kritické pre profesionálny rozvoj osobnosti človeka v spoločnosti. • Komunikáciu s úradmi o Mnoho vládnych služieb a komunikácie sa teraz vykonáva online, čo znamená, že bez prístupu k internetu sme znevýhodnení. • Podnikateľské aktivity o Pre podnikateľov je prístup k internetu kľúčový pre riadenie ich podnikania, marketing a komunikáciu so zákazníkmi. • Štúdium Anglického jazyka   o Vzdelávanie a osobný rozvoj, vrátane štúdia jazykov, sú priamo závislé od online zdrojov a kurzov. Internet je na učenie anglického jazyka pre mňa kľúčový, nakoľko mi poskytuje okamžitú spätnú väzbu a audio video nahrávky na učenie sa výslovnosti predmetného jazyka v kombinácii s učením gramatiky. Tieto body jasne ukazujú, ako môže byť prístup k internetu považovaný za základnú potrebu a základné práva, ktoré umožňuje jednotlivcom plnohodnotne sa zapájať do spoločnosti a ekonomiky. Moje  osobné údaje spoločnosť Schufa a Telekom zneužila na zabránenie prístupu podlým a zákerným spôsobom k internetovým službám telekomunikačných spoločností čo viedlo k obmedzeniu môjho prístupu k internetovým službám, čo je vážne porušenie mojich práv k slobodnému prístupu k internetu. V súvislosti s porušovaním mojich ľudských práv a slobôd som trpel emocionálne a prežíval negatívne emócie, čím som mentálne a  duševne trpel. Prežíval som, úzkosť, frustráciu, depresie a nedokázal som sa na nič</p>"}, {"n": 8, "body": "<p>koncentrovať čo mi zväzovalo ruky. Nemohol som využívať internetové služby podľa mojich očakávaní a potrieb a v dôsledku toho som prežíval negatívne emócie, duševné utrpenie a stres, v dôsledku čoho som pod obrovským tlakom. Spoločnosť Schufa Holding AG nezákonne spracováva, zhromažďuje, manipuluje a obchoduje s mojimi osobnými údajmi bez môjho súhlasu, čo je považované za porušenie Zákona o ochrane osobných údajov (DSGVO), GDPR a takéto nezákonné správanie môže byť považované za trestný čin a  viesť k trestnoprávnym dôsledkom. Aktivity spoločnosti Schufa Holding AG sa dajú tiež chápať ako organizované v kooperácii s exekútormi, bankami a telekomunikačnými spoločnosťami ako KARTEL, za účelom vytvorenia monopolu na trhu a vytvárania tlaku na dlžníkov si splatiť svoje záväzky. Takéto správanie môže byť tiež považované ako vydieranie dlžníkov a to sú trestné činy ako vydieranie, kartelové dohody alebo zneužitie dominantného postavenia na trhu. Ak si nezaplatím dlhy, nedostanem internet. Čo je tiež v príkrom rozpore s dobrými mravmi. Je dôležité poznamenať, že GDPR a iné zákony o ochrane údajov stanovujú jasné pravidlá týkajúce sa spracovania osobných údajov, vrátane toho, že subjekty údajov musia byť informované o tom, ako a prečo sú ich údaje spracovávané a musia mať možnosť namietať voči tomuto spracovaniu a bez ich informovaného súhlasu nemôžu byť v nijakom prípade použité a už vôbec nie pre účely automatizovaného individuálneho rozhodnutia. SMĚRNICE EVROPSKÉHO PARLAMENTU A RADY 2014/104/EU ze dne 26. listopadu 2014 o určitých pravidlech upravujících žaloby o náhradu škody podle vnitrostátního práva v případě porušení právních předpisů členských států a Evropské unie o hospodářské soutěži (4) Z práva Unie vyplývající právo na náhradu škody způsobené porušením unijních a vnitrostátních právních předpisů o hospodářské soutěži vyžaduje, aby měly všechny členské státy procesní pravidla, která zajišťují účinný výkon tohoto práva. KAPITOLA V STANOVENÍ VÝŠE ŠKODY Článek 17 Stanovení výše škody 1.  Členské státy zajistí, aby důkazní břemeno a požadavky na dokazování, jež jsou nezbytné pro stanovení výše škody, prakticky neznemožňovaly či nepřiměřeně neztěžovaly uplatnění práva na náhradu škody. Členské státy zajistí, aby vnitrostátní soudy měly pravomoc stanovit v souladu s vnitrostátními postupy výši škody odhadem, pokud bylo zjištěno, že žalobci byla způsobena škoda, avšak na základě dostupných důkazů je prakticky nemožné nebo nepřiměřeně obtížné přesně stanovit výši způsobené škody. (11) Při neexistenci právních předpisů Unie se žaloby o náhradu škody řídí vnitrostátními pravidly a postupy členských států. Podle judikatury Soudního dvora Evropské unie (dále jen „Soudní</p>"}, {"n": 9, "body": "<p>dvůr“) má každý právo požadovat náhradu vzniklé škody, existuje-li příčinná souvislost mezi škodou a porušením právních předpisů o hospodářské soutěži. (13) Právo na náhradu škody je přiznáno všem fyzickým nebo právnickým osobám, ať již spotřebitelům, podnikům nebo orgánům veřejné moci, bez ohledu na existenci přímého smluvního vztahu s protiprávně jednajícím podnikem a bez ohledu na skutečnost, zda protiprávní jednání předtím konstatoval orgán pro hospodářskou soutěž. 8. Hodnoty EU Priority Európskej únie na roky 2024 – 2029 Slobodná a demokratická Európa ▪ presadzovanie európskych hodnôt v rámci EÚ ▪ dodržiavanie hodnôt EÚ na celosvetovej úrovni Silná a bezpečná Európa ▪ zabezpečenie súdržnej a vplyvnej vonkajšej činnosti ▪ posilnenie bezpečnosti a obrany EÚ a ochrana občanov EÚ ▪ príprava na väčšiu a silnejšiu Úniu ▪ presadzovanie komplexného prístupu k migrácii a riadeniu hraníc Prosperujúca a konkurencieschopná Európa ▪ posilnenie konkurencieschopnosti EÚ ▪ úspešná realizácia zelenej a digitálnej transformácie ▪ podpora prostredia priaznivého pre inovácie a podnikanie ▪ spoločný pokrok 1. Ako nám únia zabezpečuje ochranu občanov, ak najsilnejšie štáty ako je Nemecko, porušujú ľudské práva, okádajú svojich občanov ale klamú nám ako nás chránia? 2. Ako nám chce únia posilniť konkurencie schopnosť, keď podvodný Mega kartel Schufa Telekom chce zamiesť pod koberec aj samotná predsedkyňa EK Ursula von der Leyen, keď kartel je opakom konkurencieschopnosti?</p><p>Agentúra Európskej únie pre základné práva (FRA) Agentúra EÚ pre základné práva (FRA) poskytuje nezávislé poradenstvo založené na dôkazoch európskym a vnútroštátnym tvorcom politiky, čím prispieva k tomu, aby diskusie, politiky a právne predpisy o základných právach vychádzali z kritickej masy podkladov a boli cielené. Úlohy</p>"}, {"n": 10, "body": "<p>Agentúra poskytuje poradenstvo inštitúciám EÚ a vládam o základných právach, a to hlavne v týchto oblastiach: ▪ diskriminácia, !!! ▪ prístup k spravodlivosti, !!! ▪ rasizmus a xenofóbia, ▪ ochrana údajov, !!! ▪ práva obetí, ▪ práva detí. Účelom agentúry je pomáhať pri účinnejšej podpore a ochrane základných práv v celej EÚ. Na tento účel konzultuje svojich partnerov a spolupracuje s nimi pri: ▪ zhromažďovaní a analýze informácií a údajov prostredníctvom socioprávneho výskumu, ▪ poskytovaní pomoci a odborného poradenstva, ▪ komunikovaní a zvyšovaní povedomia o právach. !!! Načo a komu slúžia tieto agentúry, keď európska komisia si robí čo chce a porušovanie ľudských práv a porušovanie zákona na ochranu chránených osobných údajov spotrebiteľa ignoruje ako predsedkyňa EK Ursula von der Leyen? Je tu jej jasný úmysel zamiesť tento podvod pod koberec, nakoľko je s nemeckom v súzvuku vzhľadom na jej pôvod a teda je tu konflikt záujmov!!! To tak ich učia komunikovať (FRA), že Leyen odmieta so mnou komunikovať? EU má byť konkurencie schopná a nie vytvárať monopoly!!! Ako dôkaz prikladám e-mail adresovaný p. Leyen.</p><p>17. Návrh na rozhodnutie</p><p>• Žiadosť:</p><p>Podľa zákonov a predpisov došlo k porušeniu mojich práv a preto žiadam o náhradu škody. Podľa článku 82 GDPR mám nárok na náhradu škody spôsobenej neoprávneným spracovaním mojich osobných údajov. Požadujem zaplatiť mne odškodné za stratu času venovaného odhaleniu tohto podvodu, psychickú ujmu, doživotnú traumu a krádeže, ktorej sa žalovaní aktéri podvodu dopustili a stále dopúšťajú na mne a na masách občanov Nemecka vrátane vás p. sudca, neoprávneným neposkytovaním základného internetového pripojenia a nadmernou cenou za poskytované služby z dôvodu existujúceho kartelu medzi telekomunikačnými spoločnosťami. Kartel vedie k vysokým cenám z dôvodu absencie konkurencie. Ďalej požadujem písomné ospravedlnenie listom mojej osobe za traumu, ktorú som už niekoľko rokov nútený znášať.</p>"}, {"n": 11, "body": "<p>18. Záver</p><p>Vážený súd, v tomto dokumente (Žalobe), popisujem skutkový stav podvodu a krádeže, ktorý na mne aplikovali a stále aplikujú vyššie uvedené spoločnosti v oklieštenej forme len preto, aby som vás uviedol do obrazu celého podvodu, ktorého sa tieto spoločnosti dopúšťajú. Všetky ostatné detailné informácie sú obšírne rozpísané v prílohách Trestných oznámení a Sťažností na EK, ktoré sú prílohou tejto žaloby vo formátoch PDF a sú podpísané vlastnoručne fyzickým podpisom a aj QES neviditeľným podpisom vrátane tejto žaloby.</p><p>Taktiež vyzývam súd Landshut, aby prikázal tento podvod žalovaným spoločnostiam ukončiť z vyššie uvedených nezákonných dôvodov jeho aplikovania a zaviazať ich uhradiť moje odškodné platobným rozkazom. Spoločnosť Deutsche Telekom AG denno denne okráda 84,552,242 milónový národ, ktorý je na špici technologického pokroku a to za bieleho dňa formou porušovania ľudských práv a to sa len tak ľahko nevidí, vrátane vás a vašej rodiny p. sudca/sudkyňa.</p><p>V Kumhausene 2.10.2024                                  Peter Ferenc .........................</p>"}]}, "hr": {"title": "Tužba protiv Deutsche Telekom AG i Schufa Holding AG", "pages": [{"n": 1, "body": "<p>„Tužitelj“ Peter Ferenc Rammelkam 2, Kumhausen Deutschland +49 157 317 33332 info@foxprof.club Amtsgericht Landshut Maximilianstraße 22 84028 Landshut Deutschland u Kumhausenu, 2.10.2024. TUŽBA 4. „Tuženici“ • Deutsche Telekom AG, Friedrich-Ebert-Allee 140, 53113 Bonn, Njemačka. Registarski broj (sudski registar): HRB 6794 (Općinski sud u Bonnu); • i • Schufa Holding AG, Kormoranweg 5, 65201 Wiesbaden, Njemačka. Registarski broj (sudski registar): nije javno dostupan; porezni identifikacijski broj: DE87ZZZ00000239351. 5. „Predmet tužbe“ Tužba se odnosi na povredu GDPR-a i ljudskih prava od strane društva Deutsche Telekom AG. Stoga tužim gore navedena društva za naknadu štete prouzročene prijevarnim postupanjem prema mojoj osobi te tražim isplatu od 500 000 EUR za svako pojedinačno, kako bi sud svako od njih obvezao da navedeni iznos uplati na moj račun kod Slovenská sporiteľňa: IBAN: SK59 0900 0000 0052 0995 7308 BIC: GIBASKBX. 6. „Činjenične tvrdnje“ Opis događaja: Pri ocjeni mojeg zahtjeva za fiksni internetski priključak u srpnju, na točno neutvrđeni dan 2022. godine, društvo Deutsche Telekom AG (dalje: Telekom) nezakonito je obradilo — i još uvijek obrađuje — moje osobne podatke u obliku automatizirane pojedinačne obrade (odluke), koja se temelji na prijevarnom triku prijevarne agencije Schufa o „BONITETU“ (kreditnoj sposobnosti) potrošača, bez njegove informirane privole (potrošača). Time je povrijeđeno moje temeljno pravo Unije — pravo na pristup internetu preko pružatelja Deutsche Telekom AG. Vlada, koja pokriva ovu mega kartelnu prijevaru, ne samo da me lišava internetskog priključka,</p>"}, {"n": 2, "body": "<p>čime krši moja temeljna ljudska prava — pravo na pristup internetu — nego me je i prisilila kupovati internetske podatke za 108 EUR mjesečno putem 5G SIM prepaid kartice Telekoma, za što također imam dokaze navedene u Pritužbi Europskoj komisiji, koja je prilog ovoj tužbi. Neograničeni podaci za mene su životno važni jer moram svakodnevno učiti engleski jezik, koji mi je potreban za daljnji profesionalni razvoj. Dokazi: Detaljni dokazi nalaze se u prilozima ove tužbe u PDF formatu, koje mora proučiti konkretno dodijeljeni sudac. Ovdje je popis PDF datoteka: – 10. Strafrechtliche Mitteilung_Telekom and Schufa_sharp_Deutsch_fy.pdf – 11. Strafrechtliche Mitteilung_Telekom_Altstadt_Angestellter 1_with_QES.pdf – 12. Strafrechtliche Mitteilung über GP Peter Frank_with_signature_QES.PDF – 13. CS Complaint form request_0_koncept_ostrý_nahlásenie EU komisii podvod_with_QES.pdf – 14. Anzeige über Schindler_unterschrift_signed_with_QES.pdf – 15. Benachrichtigung der Telekom Mitarbeitern Telekom 94-95 Altstadt_with_QES.pdf 16. „Pravni razlozi“ Povreda zakona: Riječ je ponajprije o povredi zakona o zaštiti mojih zaštićenih osobnih podataka potrošača i univerzalne usluge pristupa internetu bez ograničenja i diskriminacije — § 78 TKG. Telekommunikationsgesetz (TKG), § 78 (Univerzalna usluga): ovaj članak propisuje da pružatelji javnih telekomunikacijskih usluga moraju osigurati da svi krajnji korisnici imaju pristup dostupnim i kvalitetnim elektroničkim komunikacijskim uslugama, uključujući osnovni pristup internetu. Pružatelji ne smiju diskriminirati nijednog korisnika i moraju osigurati da se usluge pružaju po razumnoj cijeni. A cijena od 108 EUR mjesečno za kvalitetu od 20 Mbit/s brzine prijenosa i nestabilnu vezu neprihvatljiva je i izvan svake granice tolerancije. Dakle, općenito govoreći, nitko ne može ograničiti potrošača u njegovu pravu na pristup internetu, jer je to njegovo temeljno pravo i sloboda te nadilazi bilo koje „opravdane“ interese pružatelja! Ispitanik ima pravo da se na njega ne primjenjuje odluka koja se temelji isključivo na automatiziranoj pojedinačnoj obradi (odlučivanju) podataka, uključujući profiliranje, a koja proizvodi pravne učinke koji se na njega odnose ili ga slično značajno (negativno) pogađaju (GDPR)! Ako se obrada temelji na privoli, voditelj obrade mora moći dokazati da je ispitanik dao privolu za obradu svojih zaštićenih osobnih podataka. A to se također uopće ne poštuje. Dakle, ako bi Telekom pri zahtjevu potrošača za internetskim priključkom želio primijeniti automatiziranu pojedinačnu odluku, dužan je zatražiti informiranu privolu potrošača! Prema članku 6. GDPR-a, društvo Deutsche Telekom AG povrijedilo je moja prava na zaštitu osobnih podataka. GDPR pojedincima daje pravo da budu informirani o postojanju automatizirane pojedinačne odluke, njezinoj logici i posljedicama. Telekom mi tu mogućnost nije pružio, ne pruža je i samovoljno primjenjuje režim nezakonite automatizirane pojedinačne odluke pri ocjeni zahtjeva za internetski priključak (usluge), budući da mi ne pruža nikakvu mogućnost da izrazim svoje neslaganje s uporabom automatizirane odluke, jer me ni ne informira o mogućim posljedicama njezine uporabe. Moju informiranu privolu nije pribavio i ponaša se kao da za njega zakoni ni ne postoje! I na kraju, ali ne manje važno, riječ je o zakonu o zaštiti osobnih podataka potrošača, koji ta društva krše time što informaciju o insolventnosti od ovršitelja društvo Schufa Holding AG prodaje (radi financijske koristi) na</p>"}, {"n": 3, "body": "<p>obradu telekomunikacijskim društvima u elektroničkom obliku putem interneta radi obrade automatizirane pojedinačne odluke u obliku navodne (prijevarne) kreditne sposobnosti potrošača — podnositelja zahtjeva za pristup internetu, i to bez informirane privole potrošača. Čemu onda služi zakon o zaštiti osobnih podataka? Telekom je donio automatiziranu pojedinačnu odluku na temelju koje mi je odbio pružiti internetske usluge, uslijed čega sam morao kupiti usmjerivač 5G ZTE 5001 i 5G SIM karticu za prijam internetskog signala i priključak na uslugu „internet“. Cijena uređaja iznosila je oko 300 EUR. Cijena SIM kartice za 28 dana iznosi 100 EUR, pa su moji mjesečni troškovi od 108 EUR za rad ovog uređaja viši za: 108 EUR − 40 EUR = 68 EUR! Za mene su to znatne negativne posljedice, a time i troškovi! Da ne spominjem da je vrijednost internetskog priključka putem DSL-a precijenjena za 170 %. Stvarna cijena ne bi trebala biti veća od 20 EUR mjesečno, a ne 40–45 EUR zbog kartela! Kada bi internet stajao onoliko koliko bi trebao, do 20 EUR, to bi bilo precijenjeno za 440 %. A to također znači da sam diskriminiran! Iz ovoga je jasno da Telekom vuče kraći kraj i da svaki građanin Savezne Republike Njemačke biva njime opljačkan. I kao nekim čudom, odjednom se može platiti i slovačkom bankom automatiziranim prijenosom. To su čuda kad treba platiti za više od 440 % precijenjeni internet zbog kartelne prijevare. Njemačka banka više nije uvjet pri zahtjevu za internetski priključak kod Telekoma! Taj se uvjet jednostavno usput ispario! Kartelni sporazum, dakle usklađeno djelovanje između dvaju ili više natjecatelja s ciljem koordinacije njihova tržišnog natjecateljskog ponašanja ili utjecaja na relevantne parametre tržišnog natjecanja, putem praksi kao što je, među ostalim, određi
