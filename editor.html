<!DOCTYPE html>
<html lang="sk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>FIA FOX — editor registra</title>
<style>
:root{--navy:#1F3864;--red:#C00000;--bd:#c9d8e8;--bg:#eef3f8;--gold:#f0c040}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#22303f;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
#bar{background:var(--navy);color:#fff;padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
#bar b{letter-spacing:.02em}
#bar .sp{flex:1}
button{font:inherit;border:1px solid var(--bd);background:#fff;color:#3d4d5e;border-radius:5px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--navy);color:var(--navy)}
#bar button{background:#2a4a80;color:#fff;border-color:#42639b}
#bar button:hover{background:#375c9a;color:#fff}
#bar button.go{background:#ffd34d;color:#3a2c00;border-color:#e8b93a;font-weight:700}
.page{max-width:1700px;margin:0 auto;padding:14px 16px 40px}
.sect{margin-bottom:16px}
.langbar{background:#fff;border:1px solid var(--bd);border-radius:7px;padding:9px 13px;margin-bottom:14px;
 display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.langbar .lb{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:#7a8899;margin-right:4px}
.flg{background:none;border:1px solid rgba(31,56,100,.28);border-radius:4px;padding:0;cursor:pointer;
 width:38px;height:25px;opacity:.5;overflow:hidden}
.flg img{width:38px;height:25px;object-fit:cover;display:block}
.flg.on{opacity:1;border-color:var(--navy);box-shadow:0 0 0 2px rgba(31,56,100,.28)}
.langbar .info{margin-left:auto;font-size:12px;color:#8a97a6}
.langbar .info b{color:var(--red)}
.sect>h2{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:#7a8899;
 display:flex;align-items:center;gap:10px}
.sect>h2 .cnt{background:#dde6f0;color:#4a5b6d;border-radius:999px;padding:1px 9px;font-size:11px;letter-spacing:0}

/* ── dlaždice kauz ── */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--navy);border-radius:6px;
 padding:10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.tile:hover{background:#f5f9fd}
.tile.on{background:#eef4fb;box-shadow:0 0 0 2px rgba(31,56,100,.3)}
.tile .tn{font-size:13px;font-weight:700;color:var(--navy);line-height:1.3}
.tile .tk{font-size:10.5px;color:#8a97a6;letter-spacing:.04em;margin-top:3px}
.tile .tc{display:inline-block;margin-top:7px;font-size:11px;background:#eef2f7;color:#54637a;border-radius:999px;padding:1px 9px}

/* ── konania ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:11px 13px;cursor:pointer}
.card:hover{background:#f5f9fd}
.card.on{background:#eef4fb;box-shadow:0 0 0 2px rgba(31,56,100,.3)}
.card .cn{font-size:14px;font-weight:600;color:var(--navy);line-height:1.35}
.card .co{font-size:12px;color:#7a8899;margin-top:3px}
.card .cb{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:10.5px;border-radius:999px;padding:1px 9px;background:#eef2f7;color:#54637a}
.pill.az{background:#fff3d6;color:#8a5a00;border:1px solid var(--gold)}

/* ── dokumenty + editor ── */
.split{display:grid;grid-template-columns:minmax(420px,1fr) minmax(460px,620px);gap:14px;align-items:start}
@media(max-width:1150px){.split{grid-template-columns:1fr}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.col h3{margin:0 0 7px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7a8899}
.doc{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:9px 11px;margin-bottom:7px;cursor:pointer}
.doc:hover{background:#f5f9fd}
.doc.on{background:#fff8e6;box-shadow:0 0 0 2px var(--gold)}
.doc .dt{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:#8a97a6;font-weight:700}
.doc .ds{font-size:13px;color:var(--navy);font-weight:600;margin-top:2px;line-height:1.35}
.doc .dw{margin-top:5px;display:flex;gap:5px;flex-wrap:wrap}
.ob{font-size:11.5px;text-decoration:none;border:1px solid var(--bd);background:#fff;border-radius:4px;
 padding:3px 10px;color:#3d4d5e;white-space:nowrap}
.ob:hover{border-color:var(--navy);color:var(--navy);background:#f2f7fc}
.ob.og{background:#fff8e6;border-color:var(--gold);color:#8a5a00}
.warn{background:#fdeaea;color:#8a1c1c;border:1px solid #f0b8b8}
.ed{background:#fff;border:1px solid var(--bd);border-top:4px solid var(--navy);border-radius:7px;
 padding:14px 16px;position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto}
.ed h2{margin:0 0 4px;font-size:15px;color:var(--navy)}
.ed .sub{font-size:12px;color:#8a97a6;margin-bottom:6px}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:10px}
.chk input{width:auto}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7a8899;margin:11px 0 3px}
input,select,textarea{width:100%;border:1px solid var(--bd);border-radius:4px;padding:7px 9px;font:inherit;background:#fff}
textarea{min-height:64px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.lang{display:grid;grid-template-columns:34px 1fr auto;gap:7px;align-items:center;margin-bottom:4px}
.otv{display:inline-block;text-decoration:none;background:var(--navy);color:#fff;border-radius:4px;
 padding:5px 9px;font-size:12px;line-height:1}
.otv:hover{background:#16294a}
.origbox{background:#fff8e6;border:1px solid var(--gold);border-radius:5px;padding:10px 12px;margin-top:12px}
.origbox a{display:inline-block;margin-top:6px;background:#ffd34d;color:#3a2c00;text-decoration:none;
 border-radius:4px;padding:5px 12px;font-weight:700;font-size:12.5px}
.lang .lc{font-size:10.5px;font-weight:700;color:var(--navy);text-align:center;background:#eef4fb;border-radius:3px;padding:4px 0}
.miss{border-color:var(--red) !important;background:#fff7f7}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px;padding-top:11px;border-top:1px solid var(--bd)}
.msg{margin:9px 0;padding:9px 12px;border-radius:5px;font-size:13px}
.msg.ok{background:#e9f7ef;border:1px solid #b7e2c8;color:#0B7A3B}
.msg.err{background:#fdeaea;border:1px solid #f0b8b8;color:#8a1c1c}
.hint{font-size:12px;color:#8a97a6}
.empty{background:#fff;border:1px dashed var(--bd);border-radius:6px;padding:18px;text-align:center;color:#8a97a6;font-size:13px}
</style></head>
<body>

<div id="bar">
 <b>FIA FOX · editor registra</b>
 <button onclick="document.getElementById('fl').click()">📂 Načítať JSON</button>
 <input type="file" id="fl" accept=".json" style="display:none">
 <button onclick="loadWeb()">🌐 Načítať z webu</button>
 <button onclick="aktualizuj()" title="Stiahne najnovšiu verziu formulára z repozitára">⟳ Aktualizovať formulár</button>
 <span style="font-size:11.5px;opacity:.7" id="ver"></span>
 <span class="sp"></span>
 <span id="stat" style="font-size:12.5px;opacity:.85"></span>
 <button onclick="kontrola()">✔ Kontrola</button>
 <button class="go" onclick="stiahni()">⬇ Stiahnuť JSON</button>
</div>

<div class="page">
 <div class="langbar">
  <span class="lb">Jazyk zobrazenia</span>
  <span id="flags"></span>
  <span class="info" id="langinfo"></span>
 </div>

 <div class="sect">
  <h2>Kauzy <span class="cnt" id="c-kz">0</span>
   <button onclick="selKz=null;selKa=null;selPo=null;render()" style="margin-left:auto">Zobraziť všetko</button></h2>
  <div class="tiles" id="tiles"><div class="empty">Načítaj dáta tlačidlom hore.</div></div>
 </div>

 <div class="sect">
  <h2>Konania <span class="cnt" id="c-ka">0</span>
   <button onclick="prepniRadenie()" id="radbtn" style="margin-left:auto">↓ najnovšie</button>
   <button onclick="novaKarta()">+ Nové konanie</button></h2>
  <div class="cards" id="cards"><div class="empty">—</div></div>
 </div>

 <div class="split">
  <div class="sect">
   <h2>Dokumenty <span class="cnt" id="c-po">0</span>
    <button onclick="novaPolozka()" style="margin-left:auto">+ Nový dokument</button></h2>
   <div class="cols">
    <div class="col"><h3>▲ Odoslané</h3><div id="dsent"><div class="empty">—</div></div></div>
    <div class="col"><h3>▼ Došlé</h3><div id="drecv"><div class="empty">—</div></div></div>
   </div>
  </div>
  <div class="ed" id="ed"><h2>Editor</h2><p class="hint">Vyber kauzu, konanie alebo dokument.</p></div>
 </div>
</div>

<script>
const L9=["de","en","sk","hr","pl","es","it","fr","sv"];
const RAW="https://raw.githubusercontent.com/peterferenc246-design/fia-fox-web/main/_data/fia_data.json";
const VIEWER="https://peterferenc246-design.github.io/fia/viewer.html";
const VERZIA="2026-07-24 13:15";
let D=null, selKz=null, selKa=null, selPo=null, zmenene=false;
let LANG='sk';
const FLAG={de:"de",en:"gb",sk:"sk",hr:"hr",pl:"pl",es:"es",it:"it",fr:"fr",sv:"se"};
function kresliVlajky(){
 document.getElementById('flags').innerHTML = L9.map(L=>
  '<button class="flg'+(L===LANG?' on':'')+'" data-l="'+L+'" title="'+L.toUpperCase()+'" onclick="setLang(\''+L+'\')">'
  +'<img src="https://flagcdn.com/'+FLAG[L]+'.svg" alt="'+L.toUpperCase()+'"></button>').join('');
}
function setLang(L){ LANG=L; kresliVlajky(); render(); }
function txt(o){ if(!o) return ''; return o[LANG] || ''; }
function txtFb(o){ if(!o) return ''; return o[LANG] || o.sk || o.de || o.en || Object.values(o).find(v=>v) || ''; }
document.getElementById('ver').textContent='v '+VERZIA;

function stat(t){document.getElementById('stat').textContent=t;}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function kartaById(id){return (D.karty||[]).find(k=>k.id===id);}
function nazovKarty(k){return txtFb(k.nazov)||k.id;}
function predmet(p){return txtFb(p.subj9)||p.subj||'(bez predmetu)';}

function dkey(v){
 v=(v||'').trim();
 let m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);        if(m) return m[1]+m[2]+m[3];
 m=v.match(/^(\d{1,2})\.\s*(\d{1,2})\.\s*(\d{4})$/); if(m) return m[3]+('0'+m[2]).slice(-2)+('0'+m[1]).slice(-2);
 return '00000000';
}
let radDesc=true;
function prepniRadenie(){ radDesc=!radDesc; render(); }
function chyba9(o){return L9.filter(L=>!((o||{})[L]||'').trim()).length;}

/* ── načítanie ── */
document.getElementById('fl').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f) return;
 const r=new FileReader();
 r.onload=()=>{ try{ D=JSON.parse(r.result); poNacitani('súbor '+f.name);}catch(err){alert('Chybný JSON: '+err);} };
 r.readAsText(f,'utf-8');
});
function loadWeb(){ stat('načítavam dáta…');
 document.getElementById('tiles').innerHTML='<div class="empty">Načítavam dáta z repozitára…</div>';
 fetch(RAW+'?v='+Date.now())
  .then(r=>{ if(!r.ok) throw new Error('server vrátil '+r.status); return r.json(); })
  .then(j=>{D=j;poNacitani('web');})
  .catch(e=>{ stat('načítanie zlyhalo');
   document.getElementById('tiles').innerHTML='<div class="empty" style="color:#8a1c1c;border-color:#f0b8b8">'
    +'Načítanie dát zlyhalo: '+esc(String(e))+'<br><br>Skús tlačidlo <b>Načítať JSON</b> a vyber súbor z disku.</div>'; });
}
function pripravKauzy(){
 D.kauzy_reg = D.kauzy_reg || [];
 D.kauzy_reg.forEach(z=>{ z.nazov=z.nazov||{}; z.warn=z.warn||{}; z.jur=z.jur||[]; z.ids=z.ids||[]; });
}
function kauzaKarty(cid){ const z=(D.kauzy_reg||[]).find(z=>(z.ids||[]).indexOf(cid)>=0); return z?z.spis:''; }
function kauzaPodla(spis){ return (D.kauzy_reg||[]).find(z=>z.spis===spis); }
function poNacitani(z){ D.karty=D.karty||[];D.polozky=D.polozky||[];D.suhrny=D.suhrny||{}; pripravKauzy();
 selKz=selKa=selPo=null; stat(D.karty.length+' konaní · '+D.polozky.length+' dokumentov · '+z); render(); }
function aktualizuj(){
 window.__akt=true;
 try{ sessionStorage.removeItem('fia_stav'); }catch(e){}
 if(!zmenene){                      // nic rozrobene -> stiahni cerstve data
  location.replace(location.pathname.split('?')[0]+'?v='+Date.now());
  return;
 }
 try{
  if(D) sessionStorage.setItem('fia_stav', JSON.stringify({
    D:D, selKz:selKz, selKa:selKa, selPo:selPo, LANG:LANG, y:window.scrollY, t:Date.now()}));
 }catch(e){
  if(!confirm('Stav sa nepodarilo odložiť ('+e+').\nPokračovať a načítať formulár nanovo?')) return;
 }
 location.replace(location.pathname.split('?')[0]+'?v='+Date.now());
}
function obnovStav(){
 let raw=null;
 try{ raw=sessionStorage.getItem('fia_stav'); }catch(e){}
 if(!raw) return false;
 try{
  const st=JSON.parse(raw);
  sessionStorage.removeItem('fia_stav');
  D=st.D; selKz=st.selKz; selKa=st.selKa; selPo=st.selPo; LANG=st.LANG||'sk';
  D.karty=D.karty||[]; D.polozky=D.polozky||[]; D.suhrny=D.suhrny||{}; pripravKauzy();
  kresliVlajky(); render();
  stat(D.karty.length+' konaní · '+D.polozky.length+' dokumentov · obnovené po aktualizácii');
  document.getElementById('ed').insertAdjacentHTML('afterbegin',
   '<div class="msg ok">Formulár aktualizovaný na v '+VERZIA+'. Rozpracované dáta aj výber zostali zachované.<br>'
   +'<button style="margin-top:7px" onclick="if(confirm(\'Zahodiť rozpracované zmeny a načítať čerstvé dáta z webu?\')){zmenene=false;loadWeb();}">'
   +'⟲ Načítať čerstvé dáta z webu</button></div>');
  setTimeout(()=>window.scrollTo(0,st.y||0),60);
  return true;
 }catch(e){ try{sessionStorage.removeItem('fia_stav');}catch(x){} return false; }
}

/* ── vykreslenie ── */
function render(){ if(!D) return; tiles(); cards(); docs(); editor(); langinfo();
 const b=document.getElementById('radbtn'); if(b) b.textContent = radDesc?'↓ najnovšie':'↑ najstaršie';
}
function langinfo(){
 if(!D){document.getElementById('langinfo').textContent='';return;}
 const kz=(D.kauzy_reg||[]).filter(z=>!((z.nazov||{})[LANG]||'').trim()).length;
 const kk=(D.karty||[]).filter(k=>!((k.nazov||{})[LANG]||'').trim()).length;
 const pp=(D.polozky||[]).filter(p=>!((p.subj9||{})[LANG]||'').trim()).length;
 const uu=(D.polozky||[]).filter(p=>!((p.urls||{})[LANG]||'').trim()).length;
 const el=document.getElementById('langinfo');
 el.innerHTML = (kz+kk+pp+uu)
  ? 'V jazyku '+LANG.toUpperCase()+' chýba: <b>'+kz+'</b> názvov káuz · <b>'+kk+'</b> názvov konaní · <b>'+pp+'</b> predmetov · <b>'+uu+'</b> odkazov'
  : 'V jazyku '+LANG.toUpperCase()+' je všetko vyplnené.';
}

function tiles(){
 const zoz=(D.kauzy_reg||[]);
 document.getElementById('c-kz').textContent=zoz.length;
 document.getElementById('tiles').innerHTML = zoz.map(z=>{
  const nk=(z.ids||[]).filter(id=>kartaById(id)).length;
  const nd=(D.polozky||[]).filter(p=>(z.ids||[]).indexOf(p.karta)>=0).length;
  const chL=!((z.nazov||{})[LANG]||'').trim();
  const fl=(z.jur||[]).map(j=> j==='eu' ? '🇪🇺'
        : '<img src="https://flagcdn.com/'+(j==='sk'?'sk':j)+'.svg" style="width:16px;height:11px;object-fit:cover;border-radius:2px;vertical-align:-1px">').join(' ');
  return '<button class="tile'+(selKz===z.spis?' on':'')+'" onclick="pickKz(\''+z.spis.replace(/'/g,"\'")+'\')">'
   +'<div style="margin-bottom:4px">'+fl+'</div>'
   +'<div class="tn">'+esc(txtFb(z.nazov)||z.spis)+'</div>'
   +'<div class="tk">'+esc(z.spis)+'</div>'
   +(((z.warn||{})[LANG]||'')?'<div style="font-size:11px;color:var(--red);font-style:italic;font-weight:700;margin-top:5px">'+esc(z.warn[LANG])+'</div>':'')
   +'<span class="tc">'+nk+' konaní · '+nd+' dok.</span>'
   +(chL?'<span class="pill warn" style="margin-left:6px">chýba '+LANG.toUpperCase()+'</span>':'')
   +'</button>';}).join('') || '<div class="empty">Žiadne kauzy.</div>';
}
function cards(){
 const kz=selKz?kauzaPodla(selKz):null;
 const zoz=(D.karty||[]).filter(k=>!kz||(kz.ids||[]).indexOf(k.id)>=0)
   .slice().sort((a,b)=>{const x=dkey(a.date),y=dkey(b.date); return radDesc? y.localeCompare(x): x.localeCompare(y);});
 document.getElementById('c-ka').textContent=zoz.length;
 document.getElementById('cards').innerHTML = zoz.map(k=>{
  const n=(D.polozky||[]).filter(p=>p.karta===k.id).length;
  const ch=chyba9(k.nazov); const chL=!((k.nazov||{})[LANG]||'').trim();
  return '<div class="card'+(selKa===k.id?' on':'')+'" onclick="pickKa(\''+k.id.replace(/'/g,"\\'")+'\')">'
   +'<div class="cn">'+esc(nazovKarty(k))+'</div>'
   +'<div class="co">'+esc(txtFb(k.organ))+'</div>'
   +'<div class="cb"><span class="pill">'+esc(k.date||'bez dátumu')+'</span>'
   +'<span class="pill az">'+esc(k.az||'bez značky')+'</span>'
   +'<span class="pill">'+n+' dok.</span>'
   +(chL?'<span class="pill warn">chýba '+LANG.toUpperCase()+'</span>':'')+(ch?'<span class="pill">bez '+ch+' jaz.</span>':'')+'</div></div>';}).join('')
  || '<div class="empty">Žiadne konania'+(selKz?' v tejto kauze':'')+'.</div>';
}
function docs(){
 const kzo=selKz?kauzaPodla(selKz):null;
 const zoz=(D.polozky||[]).filter(p=>(!selKa||p.karta===selKa)&&(!kzo||(kzo.ids||[]).indexOf(p.karta)>=0))
   .slice().sort((a,b)=>{const x=dkey(a.date),y=dkey(b.date); return radDesc? y.localeCompare(x): x.localeCompare(y);});
 document.getElementById('c-po').textContent=zoz.length;
 const kresli=arr=>arr.map(p=>{const i=D.polozky.indexOf(p);
  const cs=chyba9(p.subj9), cu=chyba9(p.urls);
  const csL=!((p.subj9||{})[LANG]||'').trim(), cuL=!((p.urls||{})[LANG]||'').trim();
  return '<div class="doc'+(selPo===i?' on':'')+'" onclick="pickPo('+i+')">'
   +'<div class="dt"><span>'+esc(p.date||'—')+'</span><span>'+esc(p.az||'')+'</span></div>'
   +'<div class="ds">'+esc(predmet(p))+'</div>'
   +'<div class="dw">'
   +(((p.urls||{})[LANG])?'<a class="pill" style="background:#1F3864;color:#fff;text-decoration:none" '
      +'href="'+esc(p.urls[LANG])+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗ otvoriť</a>':'')
   +(p.orig?'<a class="pill" style="background:#ffd34d;color:#3a2c00;text-decoration:none" '
      +'href="'+esc(p.orig)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">✍ QES</a>':'')
   +(p.dolezite?'<span class="pill warn">❗ dôležité</span>':'')
   +'<span class="pill">'+(p.access==='pw'?'🔒 heslo':'🌐 verejné')+'</span>'
   +(p.summodId?'<span class="pill">súhrn</span>':'')
   +(csL?'<span class="pill warn">predmet '+LANG.toUpperCase()+'</span>':'')
   +(cuL?'<span class="pill warn">odkaz '+LANG.toUpperCase()+'</span>':'')
   +(cs&&!csL?'<span class="pill">predmet bez '+cs+'</span>':'')
   +(cu&&!cuL?'<span class="pill">odkaz bez '+cu+'</span>':'')
   +'</div>'
   +'<div class="dw" style="margin-top:6px">'
   +(((p.urls||{})[LANG])?'<a class="ob" href="'+esc(p.urls[LANG])+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">📄 Otvoriť ('+LANG.toUpperCase()+')</a>':'<span class="pill warn">bez odkazu v '+LANG.toUpperCase()+'</span>')
   +(p.orig?'<a class="ob og" href="'+esc(VIEWER+'?doc='+encodeURIComponent(p.orig))+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">✍ Originál (QES)</a>':'')
   +'</div></div>';}).join('');
 const s=zoz.filter(p=>p.dir==='sent'), r=zoz.filter(p=>p.dir!=='sent');
 document.getElementById('dsent').innerHTML=kresli(s)||'<div class="empty">—</div>';
 document.getElementById('drecv').innerHTML=kresli(r)||'<div class="empty">—</div>';
}
function pickKz(k){selKz=(selKz===k?null:k); selKa=null; selPo=null; render();}
function pickKa(c){selKa=(selKa===c?null:c); selPo=null; selKz=selKa?kauzaKarty(c):selKz; render();}
function pickPo(i){selPo=(selPo===i?null:i); if(selPo!==null){const p=D.polozky[i]; selKa=p.karta; selKz=kauzaKarty(p.karta);} render();}

/* ── editor ── */
function pole(l,v,on){return '<label>'+l+'</label><input value="'+esc(v)+'" oninput="'+on+'">';}
function ta(l,v,on){return '<label>'+l+'</label><textarea oninput="'+on+'">'+esc(v)+'</textarea>';}
function chk(l,v,on){return '<div class="chk"><input type="checkbox" '+(v?'checked':'')+' onchange="'+on+'"><span>'+l+'</span></div>';}
function sel(l,v,opts,on){return '<label>'+l+'</label><select onchange="'+on+'">'
 +opts.map(o=>'<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';}
function jaz(o,c,ta,link){const por=[LANG].concat(L9.filter(x=>x!==LANG));
 return por.map(L=>{const v=(o&&o[L])||'';
  const ot = (link&&v) ? '<a class="otv" href="'+esc(v)+'" target="_blank" rel="noopener" title="Otvoriť">↗</a>' : '';
 return '<div class="lang"'+(L===LANG?' style="outline:2px solid #ffd34d;outline-offset:2px;border-radius:4px"':'')+'><div class="lc">'+L.toUpperCase()+'</div>'
  +(ta?'<textarea class="'+(v?'':'miss')+'" oninput="'+c+'[\''+L+'\']=this.value;this.classList.remove(\'miss\')">'+esc(v)+'</textarea>'
     :'<input class="'+(v?'':'miss')+'" value="'+esc(v)+'" oninput="'+c+'[\''+L+'\']=this.value;this.classList.remove(\'miss\')">')
  +ot+'</div>';}).join('');}
function editor(){
 const e=document.getElementById('ed');
 if(selPo!==null && D.polozky[selPo]){
  const p=D.polozky[selPo], i=selPo, P='D.polozky['+i+']';
  const sid=p.summodId||'', suh=sid?(D.suhrny[sid]=D.suhrny[sid]||{}):null;
  e.innerHTML='<h2>Dokument</h2><div class="sub">'+esc(p.date||'')+' · '+(p.dir==='sent'?'odoslané':'došlé')+'</div>'
  +'<div class="row3">'+pole('Dátum DD.MM.RRRR',p.date||'',P+'.date=this.value;docs()')
  +sel('Smer',p.dir||'sent',[['sent','▲ odoslané'],['recv','▼ došlé']],P+'.dir=this.value;docs()')
  +sel('Stav',p.stav||'laeuft',[['laeuft','prebieha'],['eingereicht','podané'],['erledigt','vybavené'],
      ['abgelehnt','zamietnuté']],P+'.stav=this.value')+'</div>'
  +'<div class="row">'
  +sel('Prístup',p.access||'pub',[['pub','🌐 verejné'],['pw','🔒 heslo']],P+'.access=this.value;docs()')
  +'<label>Konanie</label><select onchange="'+P+'.karta=this.value;render()">'
  +(D.karty||[]).map(k=>'<option value="'+esc(k.id)+'"'+(k.id===p.karta?' selected':'')+'>'+esc(nazovKarty(k))+'</option>').join('')
  +'</select></div>'
  +'<div class="row">'+pole('Spisová značka',p.az||'',P+'.az=this.value;docs()')
  +pole('Naša značka',p.ourref||'',P+'.ourref=this.value')+'</div>'
  +pole('Orgán',p.court||'',P+'.court=this.value')
  +pole('Oblasť (kartell gdpr…)',(p.oblast||[]).join(' '),P+'.oblast=this.value.split(/\s+/).filter(Boolean)')
  +chk('❗ Dôležité — červený pruh a výkričník',p.dolezite,P+'.dolezite=this.checked;'+P+'.important=this.checked;docs()')
  +chk('💬 Povoliť komentáre',p.komentare,P+'.komentare=this.checked;'+P+'.comments=this.checked')
  +'<label>Predmet — 9 jazykov</label>'+jaz(p.subj9=p.subj9||{},P+'.subj9')
  +'<label>Odkaz na dokument — 9 jazykov <span style="text-transform:none;letter-spacing:0">(↗ otvorí)</span></label>'+jaz(p.urls=p.urls||{},P+'.urls',0,1)
  +'<div class="origbox">'
  +pole('Podpísaný originál (QES) — URL',p.orig||'',P+'.orig=this.value;editor();docs()')
  +(p.orig?('<a href="'+esc(p.orig)+'" target="_blank" rel="noopener">✍ Otvoriť podpísaný originál</a>')
          :'<div class="hint">Bez tejto adresy sa na karte nezobrazí tlačidlo „Podpísaný originál (QES)".</div>')
  +'</div>'
  +pole('Názov súboru',p.fname||'',P+'.fname=this.value')
  +pole('Cesta k súboru v repe',p.fpath||'',P+'.fpath=this.value')
  +pole('Podpísaný originál (QES) — URL',p.orig||'',P+'.orig=this.value;docs()')
  +pole('Náhradný odkaz (fallback)',p.fallback||'',P+'.fallback=this.value')
  +pole('Podtitul konania na položke',p.cardsubj||'',P+'.cardsubj=this.value')
  +ta('Sprievodný text k dokumentu',p.begleit||'',P+'.begleit=this.value')
  +'<div class="row">'+pole('Odpoveď na (replyTo)',p.replyTo||'',P+'.replyTo=this.value')
  +pole('Vlákno (thread)',p.thread||'',P+'.thread=this.value')+'</div>'
  +pole('ID súhrnu',sid,P+'.summodId=this.value;editor()')
  +(suh?('<label>Súhrn — 9 jazykov</label>'+jaz(suh,'D.suhrny[\''+sid+'\']',1)):'<p class="hint">Bez ID súhrnu sa súhrn needituje.</p>')
  +'<div class="acts"><button onclick="klonPo()">⧉ Duplikovať</button><button onclick="zmazPo()">🗑 Zmazať</button></div>';
 } else if(selKa && kartaById(selKa)){
  const k=kartaById(selKa), i=D.karty.indexOf(k);
  const P='D.karty['+i+']';
  e.innerHTML='<h2>Konanie</h2><div class="sub">'+esc(k.id)+'</div>'
  +pole('ID karty',k.id,P+'.id=this.value')
  +'<div class="row">'+pole('Spisová značka',k.az||'',P+'.az=this.value;cards()')
  +pole('Naša značka',k.ourref||'',P+'.ourref=this.value')+'</div>'
  +'<div class="row">'+pole('Dátum RRRR-MM-DD',k.date||'',P+'.date=this.value;cards()')
  +pole('Dátum ako text',k.datum_txt||'',P+'.datum_txt=this.value')+'</div>'
  +'<div class="row">'+pole('Jurisdikcia (de sk eu)',(k.jur||[]).join(' '),P+'.jur=this.value.split(/\s+/).filter(Boolean)')
  +pole('Oblasť (kartell gdpr majetok…)',(k.area||[]).join(' '),P+'.area=this.value.split(/\s+/).filter(Boolean)')+'</div>'
  +'<div class="row">'+pole('Orgán (text)',k.organ_txt||'',P+'.organ_txt=this.value')
  +pole('Pripnuté navrch (číslo)',k.pin||'',P+'.pin=this.value')+'</div>'
  +sel('Farba stavu',k.stav_trieda||'p-blue',[['p-blue','modrá — prebieha'],['p-amber','žltá — podané'],
      ['p-green','zelená — vybavené'],['p-red','červená — zamietnuté']],P+'.stav_trieda=this.value')
  +'<label>Názov konania — 9 jazykov</label>'+jaz(k.nazov=k.nazov||{},P+'.nazov')
  +'<label>Podtitul konania — 9 jazykov</label>'+jaz(k.podtitul=k.podtitul||{},P+'.podtitul')
  +'<label>Riadok Orgán / Oblasť — 9 jazykov</label>'+jaz(k.meta=k.meta||{},P+'.meta')
  +'<label>Stav — 9 jazykov</label>'+jaz(k.stav=k.stav||{},P+'.stav')
  +'<label>Sprievodný text ku konaniu — 9 jazykov (HTML)</label>'+jaz(k.sprievodny=k.sprievodny||{},P+'.sprievodny',1)
  +'<div class="acts"><button onclick="zmazKa()">🗑 Zmazať konanie</button></div>';
 } else if(selKz && kauzaPodla(selKz)){
  const z=kauzaPodla(selKz), zi=D.kauzy_reg.indexOf(z);
  const nk=(z.ids||[]).filter(id=>kartaById(id)).length;
  const nd=(D.polozky||[]).filter(p=>(z.ids||[]).indexOf(p.karta)>=0).length;
  e.innerHTML='<h2>Kauza</h2><div class="sub">'+esc(z.spis)+' · '+nk+' konaní · '+nd+' dokumentov</div>'
  +pole('Kód kauzy (data-spis)',z.spis,'D.kauzy_reg['+zi+'].spis=this.value')
  +pole('Jurisdikcia (de sk eu)',(z.jur||[]).join(' '),'D.kauzy_reg['+zi+'].jur=this.value.split(/\s+/).filter(Boolean);tiles()')
  +'<label>Názov kauzy — 9 jazykov</label>'+jaz(z.nazov,'D.kauzy_reg['+zi+'].nazov')
  +'<label>Červený podtitul — 9 jazykov (nepovinné)</label>'+jaz(z.warn,'D.kauzy_reg['+zi+'].warn')
  +'<label>Konania v kauze</label>'
  +'<div style="font-size:12.5px;color:#4a5b6d">'+(z.ids||[]).map(id=>{const k=kartaById(id);
     return '• '+esc(k?nazovKarty(k):id)+(k?'':' <span class="pill warn">karta neexistuje</span>');}).join('<br>')+'</div>'
  +'<div class="acts"><button onclick="tiles();stat(\'Dlaždice prekreslené\')">↻ Prekresliť</button></div>';
 } else e.innerHTML='<h2>Editor</h2><p class="hint">Vyber kauzu, konanie alebo dokument.</p>';
}


/* ── pridávanie a mazanie ── */
function p9(){const o={};L9.forEach(L=>o[L]='');return o;}
function novaKarta(){ if(!D){alert('Najprv načítaj dáta.');return;}
 const id=prompt('ID nového konania:','case-'); if(!id) return;
 if(kartaById(id)){alert('Také ID už existuje.');return;}
 D.karty.push({id:id,jur:['de'],date:new Date().toISOString().slice(0,10),az:'',ourref:'',area:[],pin:'',
  datum_txt:'',nazov:p9(),organ:p9(),stav:{}});
 selKa=id; selPo=null; render();}
function novaPolozka(){ if(!D){alert('Najprv načítaj dáta.');return;}
 if(!(D.karty||[]).length){alert('Najprv vytvor konanie.');return;}
 const cid=selKa||D.karty[0].id, kz=kauzaKarty(cid), d=new Date();
 D.polozky.push({kauza:(kz==='(bez kauzy)'?'':kz),kauza_nazov:'',dir:'sent',
  date:('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear(),
  stav:'laeuft',access:'',az:'',ourref:'',court:'',cmtid:'',summodId:'',fname:'',fpath:'',
  cats:{},mode:'item',v:1,karta:cid,subj9:p9(),urls:p9(),subj:'',
  begleit:'',cardsubj:'',fallback:'',orig:'',thread:'',replyTo:'',dolezite:false,komentare:true,
  important:false,comments:true,oblast:[],jur:[]});
 selPo=D.polozky.length-1; selKa=cid; render();}
function klonPo(){const p=JSON.parse(JSON.stringify(D.polozky[selPo]));p.summodId='';
 D.polozky.splice(selPo+1,0,p);selPo=selPo+1;render();}
function zmazPo(){if(!confirm('Zmazať tento dokument?'))return;D.polozky.splice(selPo,1);selPo=null;render();}
function zmazKa(){const k=kartaById(selKa);const n=D.polozky.filter(p=>p.karta===selKa).length;
 if(!confirm('Zmazať konanie „'+nazovKarty(k)+'"?'+(n?'\n\nMá '+n+' dokumentov — zostanú bez konania.':'')))return;
 D.karty.splice(D.karty.indexOf(k),1);selKa=null;selPo=null;render();}

/* ── kontrola a export ── */
function kontrola(){ if(!D){alert('Najprv načítaj dáta.');return;}
 const ch=[];
 (D.kauzy_reg||[]).forEach(z=>{const c=L9.filter(L=>!((z.nazov||{})[L]||'').trim());
  if(c.length)ch.push('Kauza '+z.spis+': chýba názov v '+c.join(', ').toUpperCase());
  (z.ids||[]).forEach(id=>{if(!kartaById(id))ch.push('Kauza '+z.spis+': odkazuje na neexistujúce konanie '+id);});});
 (D.karty||[]).forEach(k=>{const c=L9.filter(L=>!(k.nazov||{})[L]);
  if(c.length)ch.push('Konanie '+k.id+': chýba názov v '+c.join(', ').toUpperCase());
  if(!k.az)ch.push('Konanie '+k.id+': prázdna spisová značka');});
 (D.polozky||[]).forEach((p,i)=>{
  const s=L9.filter(L=>!(p.subj9||{})[L]); if(s.length)ch.push('Dokument '+(p.date||'#'+(i+1))+': chýba predmet v '+s.join(', ').toUpperCase());
  const u=L9.filter(L=>!(p.urls||{})[L]);
  if(u.length===9)ch.push('Dokument '+(p.date||'#'+(i+1))+': žiadny odkaz');
  else if(u.length)ch.push('Dokument '+(p.date||'#'+(i+1))+': chýba odkaz v '+u.join(', ').toUpperCase());
  if(!/^\d{2}\.\d{2}\.\d{4}$/.test(p.date||''))ch.push('Dokument #'+(i+1)+': zlý tvar dátumu „'+(p.date||'')+'"');
  if(!p.karta)ch.push('Dokument '+(p.date||'#'+(i+1))+': nepatrí do konania');
  if(p.summodId&&!D.suhrny[p.summodId])ch.push('Dokument '+(p.date||'#'+(i+1))+': súhrn '+p.summodId+' neexistuje');});
 document.getElementById('ed').insertAdjacentHTML('afterbegin', ch.length
  ?'<div class="msg err"><b>'+ch.length+' nedostatkov:</b><br>'+ch.slice(0,50).map(esc).join('<br>')+(ch.length>50?'<br>…':'')+'</div>'
  :'<div class="msg ok">Kontrola prešla — 9 jazykov, dátumy aj väzby v poriadku.</div>');
}
window.addEventListener('DOMContentLoaded',()=>{kresliVlajky(); if(!obnovStav()) loadWeb();});

document.addEventListener('input',()=>{zmenene=true;},true);
window.addEventListener('beforeunload',e=>{ if(zmenene && !window.__akt){ e.preventDefault(); e.returnValue=''; }});

function stiahni(){ if(!D){alert('Najprv načítaj dáta.');return;}
 D.kauzy=(D.kauzy_reg||[]).map(z=>({spis:z.spis,jur:z.jur||[],ids:z.ids||[],
   n:(D.polozky||[]).filter(p=>(z.ids||[]).indexOf(p.karta)>=0).length}));
 (D.polozky||[]).forEach(p=>{ const kz=kauzaKarty(p.karta); if(kz) p.kauza=kz; });
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));
 a.download='fia_data.json'; a.click();
 zmenene=false; stat('JSON stiahnutý — pošli ho na nasadenie.');
}
